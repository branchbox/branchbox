# Configuration for git-cliff
# See https://git-cliff.org/docs/configuration

[changelog]
# Changelog header
header = """
# Changelog

All notable changes to BranchBox will be documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }}\
          {% if commit.scope %} *({{ commit.scope }})* {% endif %}\
          {% if commit.breaking %} **[BREAKING]** {% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# Template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""

# Remove the leading and trailing whitespace from the template
trim = true

[git]
# Parse commits according to conventional commit spec
conventional_commits = true

# Filter out commits that don't follow conventional format
filter_unconventional = false

# Process each line of a commit as an individual commit
split_commits = false

# Regex for parsing commit messages
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\): prepare", skip = true },
  { message = "^chore\\(release\\): finalize", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "Build System" },
  { message = "^revert", group = "Reverts" },
]

# Protect breaking changes from being skipped
protect_breaking_commits = true

# Filter out commits
filter_commits = false

# Regex for matching git tags
# Match semantic version tags like v1.2.3 or v1.2.3-beta.1
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"

# Regex for skipping tags
skip_tags = "v0.0.0-test.*"

# Regex for ignoring tags
ignore_tags = ""

# Sort commits by oldest first
topo_order = false

# Sort commits
sort_commits = "oldest"

[remote.github]
owner = "branchbox"
repo = "branchbox"
