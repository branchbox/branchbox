name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  change_detection:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.filter.outputs.code }}
      repo: ${{ steps.filter.outputs.repo }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect doc-only changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            repo:
              - '.github/workflows/**'
              - '.copier/**'
              - '.devcontainer/**'
              - 'core/**'
              - 'cli/**'
              - 'Cargo.*'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - 'LICENSE'

  # Fast quality checks (linting, formatting, security)
  quality_checks:
    name: Quality Checks
    needs: change_detection
    if: github.event_name != 'pull_request' || needs.change_detection.outputs.code == 'true' || needs.change_detection.outputs.repo == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [fmt, clippy, audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        if: matrix.check == 'audit'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit
        if: matrix.check == 'audit'
        run: cargo audit

  # Unit tests with coverage
  unit_tests:
    name: Unit Tests
    needs: change_detection
    if: (github.event_name != 'pull_request' || needs.change_detection.outputs.code == 'true' || needs.change_detection.outputs.repo == 'true') && (matrix.run_on == 'always' || github.event_name != 'pull_request')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            run_on: always
          - os: macos-latest
            rust: stable
            run_on: push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --all-features --no-fail-fast

      - name: Run doc tests
        run: cargo test --doc --all-features

  # Code coverage (Linux only)
  coverage:
    name: Code Coverage
    needs: change_detection
    if: github.event_name != 'pull_request' && (needs.change_detection.outputs.code == 'true' || needs.change_detection.outputs.repo == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Report coverage
        run: |
          cargo llvm-cov report --json --summary-only > coverage-summary.json
          coverage=$(jq '.summary.lines.percent' coverage-summary.json)
          echo "::notice title=Code Coverage::Coverage: ${coverage}%"
          echo "Coverage report uploaded to Codecov for tracking"

  # Build check across platforms
  build:
    name: Build Check
    needs: change_detection
    if: (github.event_name != 'pull_request' || needs.change_detection.outputs.code == 'true' || needs.change_detection.outputs.repo == 'true') && (matrix.run_on == 'always' || github.event_name != 'pull_request')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            run_on: always
          - os: ubuntu-latest
            rust: beta
            run_on: push
          - os: macos-latest
            rust: stable
            run_on: push
          - os: macos-latest
            rust: beta
            run_on: push
          - os: windows-latest
            rust: stable
            run_on: push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}

      - name: Build
        run: cargo build --all-features --verbose

      - name: Build release
        run: cargo build --release --all-features --verbose

  # Integration tests (Docker operations)
  integration_tests:
    name: Integration Tests
    needs: change_detection
    if: github.event_name != 'pull_request' && (needs.change_detection.outputs.code == 'true' || needs.change_detection.outputs.repo == 'true')
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
        ports:
          - 2375:2375

    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Wait for Docker
        run: |
          for i in {1..30}; do
            if docker info > /dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker..."
            sleep 2
          done

      - name: Run integration tests
        run: cargo nextest run --tests --all-features --run-ignored ignored-only --no-fail-fast

  # Documentation check
  docs:
    name: Documentation
    needs: change_detection
    if: github.event_name != 'pull_request' || needs.change_detection.outputs.docs == 'true' || needs.change_detection.outputs.repo == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: '0.4.40'

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --document-private-items

      - name: Test documentation examples
        run: cargo test --doc --all-features

      - name: Build mdBook site
        run: mdbook build docs
