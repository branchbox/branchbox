name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  review_preflight:
    name: Review Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run review preflight checks
        run: scripts/review-preflight.sh
      - name: Run agent harness regressions
        run: python3 -B -I scripts/tests/test_agent_e2e.py -v

  quality_checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: review_preflight
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Security audit
        run: cargo audit

  unit_tests_linux:
    name: Unit Tests (linux)
    runs-on: ubuntu-latest
    needs: quality_checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run nextest suite
        run: cargo nextest run --all-features --no-fail-fast
      - name: Run doc tests
        run: cargo test --doc --all-features

  build_linux:
    name: Build (linux)
    runs-on: ubuntu-latest
    needs: quality_checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug
        run: cargo build --all-features --verbose
      - name: Build release
        run: cargo build --release --all-features --verbose

  agentify_runtime_artifact:
    name: Agentify Runtime Artifact
    runs-on: ubuntu-24.04
    needs: quality_checks
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build exact Branchbox runtime binary
        run: cargo build --release --locked --package branchbox-cli
      - name: Package commit-bound Agentify runtime artifact
        run: |
          scripts/package-agentify-runtime-artifact.sh \
            target/release/branchbox \
            dist/agentify-runtime \
            "${SOURCE_COMMIT}"
      - name: Upload commit-bound Agentify runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: branchbox-agentify-runtime-${{ env.SOURCE_COMMIT }}
          path: dist/agentify-runtime/*
          if-no-files-found: error
          retention-days: 7

  unit_tests_extra:
    name: Unit Tests (extra targets)
    runs-on: ${{ matrix.os }}
    needs: quality_checks
    strategy:
      matrix:
        include:
          - os: macos-latest
            rust: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run nextest suite
        run: cargo nextest run --all-features --no-fail-fast

  build_extra:
    name: Build (extra targets)
    runs-on: ${{ matrix.os }}
    needs: quality_checks
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust: beta
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Build debug
        run: cargo build --all-features --verbose
      - name: Build release
        run: cargo build --release --all-features --verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit_tests_linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Report coverage
        run: |
          cargo llvm-cov report --json --summary-only > coverage-summary.json
          coverage=$(jq -r '
            if .summary? then .summary.lines.percent
            elif .totals? then .totals.lines.percent
            elif (.data // []) | length > 0 then
              if .data[0].summary? then .data[0].summary.lines.percent
              elif .data[0].totals? then .data[0].totals.lines.percent
              else empty end
            else
              empty
            end
          ' coverage-summary.json)

          if [ -z "$coverage" ] || [ "$coverage" = "null" ]; then
            echo "::warning title=Code Coverage::Unable to determine coverage percentage from coverage-summary.json"
          else
            echo "::notice title=Code Coverage::Coverage: ${coverage}%"
          fi
      - name: Save coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence-${{ github.run_attempt }}
          path: |
            lcov.info
            coverage-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          disable_search: true
          fail_ci_if_error: false

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit_tests_linux]
    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
        ports:
          - 2375:2375
    env:
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Wait for Docker
        run: |
          for _ in {1..30}; do
            if docker info > /dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker..."
            sleep 2
          done
      - name: Preload Alpine conformance image
        # Test setup only; managed provider startup itself remains build-free and pull-free.
        run: docker pull alpine:3.22
      - name: Run integration suite
        # The bind proof needs the same filesystem as its daemon; DinD cannot see runner /tmp.
        run: cargo nextest run --tests --all-features --run-ignored ignored-only --no-fail-fast -E 'not test(managed_workspace_bind_reaches_the_reviewed_host_worktree)'
      - name: Verify managed workspace bind on runner Docker
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          docker info
          docker pull alpine:3.22
          cargo nextest run --lib --all-features --run-ignored ignored-only -E 'test(managed_workspace_bind_reaches_the_reviewed_host_worktree)'

  signed_v3_compose_cli_config:
    name: Signed v3 Compose CLI config
    runs-on: ubuntu-latest
    needs: quality_checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Dev Containers CLI
        run: npm install --global @devcontainers/cli@0.80.3
      - name: Verify Docker Compose is available
        run: docker compose version
      - name: Verify signed v3 private Compose inputs with both CLIs
        env:
          BRANCHBOX_VERIFY_DEVCONTAINER_CLI: 1
          BRANCHBOX_VERIFY_COMPOSE_CONFIG: 1
        run: cargo test -p worktree-core test_in_guest_workspace_consumer_uses_private_cli_inputs --all-features --locked

  signed_v3_compose_live:
    name: Signed v3 Compose live lifecycle
    runs-on: ubuntu-24.04
    needs: agentify_runtime_artifact
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Dev Containers CLI
        run: npm install --global @devcontainers/cli@0.80.3
      - name: Preload assigned image and verify Docker Compose
        run: |
          docker compose version
          docker pull node:24-slim
      - uses: actions/download-artifact@v4
        with:
          name: branchbox-agentify-runtime-${{ env.SOURCE_COMMIT }}
          path: dist/signed-v3-live
      - name: Verify and unpack exact-head runtime
        run: |
          cd dist/signed-v3-live
          sha256sum --check "branchbox-agentify-runtime-${SOURCE_COMMIT}-x86_64-unknown-linux-gnu.tar.gz.sha256"
          tar -xzf "branchbox-agentify-runtime-${SOURCE_COMMIT}-x86_64-unknown-linux-gnu.tar.gz"
          test "$(jq -r .source_commit branchbox.manifest.json)" = "${SOURCE_COMMIT}"
          test "$(sha256sum branchbox | cut -d' ' -f1)" = "$(jq -r .binary.sha256 branchbox.manifest.json)"
      - name: Start and tear down signed v3 devcontainer under distinct UID
        run: |
          sudo useradd --create-home --uid 2000 --user-group branchbox-live-runtime
          sudo env \
            "PATH=$PATH" \
            "BBX_BINARY=$PWD/dist/signed-v3-live/branchbox" \
            "BBX_BINARY_SHA256=$(jq -r .binary.sha256 dist/signed-v3-live/branchbox.manifest.json)" \
            "BBX_RUNTIME_UID=$(id -u branchbox-live-runtime)" \
            "BBX_RUNTIME_GID=$(id -g branchbox-live-runtime)" \
            "BBX_RUNTIME_HOME=/home/branchbox-live-runtime" \
            "BBX_DOCKER_GID=$(stat -c %g /var/run/docker.sock)" \
            "BRANCHBOX_DEVCONTAINER_PATH=$(command -v devcontainer)" \
            "BRANCHBOX_DOCKER_PATH=$(command -v docker)" \
            bash scripts/ci/signed-v3-compose-live.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: quality_checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --document-private-items
      - name: Doc tests
        run: cargo test --doc --all-features
      - name: Install Docusaurus dependencies
        run: cd docs && npm ci
      - name: Build Docusaurus
        run: cd docs && npm run build

  manual_cli_e2e:
    name: Manual CLI Harness (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: integration_tests
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stack: [rust, generic, rails, node]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: manual-cli-e2e
          save-if: ${{ matrix.stack == 'rust' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install --global @devcontainers/cli@0.80.3
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Build CLI
        run: cargo build -p branchbox-cli
      - name: Run manual CLI harness
        env:
          BRANCHBOX_SKIP_HOST_VALIDATION: 1
          STACK: ${{ matrix.stack }}
        run: scripts/manual-cli-e2e.sh
