name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality_checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Security audit
        run: cargo audit

  unit_tests_linux:
    name: Unit Tests (linux)
    runs-on: ubuntu-latest
    needs: quality_checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run nextest suite
        run: cargo nextest run --all-features --no-fail-fast
      - name: Run doc tests
        run: cargo test --doc --all-features

  build_linux:
    name: Build (linux)
    runs-on: ubuntu-latest
    needs: quality_checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug
        run: cargo build --all-features --verbose
      - name: Build release
        run: cargo build --release --all-features --verbose

  unit_tests_extra:
    name: Unit Tests (extra targets)
    runs-on: ${{ matrix.os }}
    needs: quality_checks
    strategy:
      matrix:
        include:
          - os: macos-latest
            rust: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run nextest suite
        run: cargo nextest run --all-features --no-fail-fast

  build_extra:
    name: Build (extra targets)
    runs-on: ${{ matrix.os }}
    needs: quality_checks
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust: beta
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Build debug
        run: cargo build --all-features --verbose
      - name: Build release
        run: cargo build --release --all-features --verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit_tests_linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          disable_search: true
          fail_ci_if_error: false
      - name: Report coverage
        run: |
          cargo llvm-cov report --json --summary-only > coverage-summary.json
          coverage=$(jq -r '
            if .summary? then .summary.lines.percent
            elif .totals? then .totals.lines.percent
            elif (.data // []) | length > 0 then
              if .data[0].summary? then .data[0].summary.lines.percent
              elif .data[0].totals? then .data[0].totals.lines.percent
              else empty end
            else
              empty
            end
          ' coverage-summary.json)

          if [ -z "$coverage" ] || [ "$coverage" = "null" ]; then
            echo "::warning title=Code Coverage::Unable to determine coverage percentage from coverage-summary.json"
          else
            echo "::notice title=Code Coverage::Coverage: ${coverage}%"
          fi

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit_tests_linux]
    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
        ports:
          - 2375:2375
    env:
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Wait for Docker
        run: |
          for i in {1..30}; do
            if docker info > /dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker..."
            sleep 2
          done
      - name: Run integration suite
        run: cargo nextest run --tests --all-features --run-ignored ignored-only --no-fail-fast

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: quality_checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --document-private-items
      - name: Doc tests
        run: cargo test --doc --all-features
      - name: Install Docusaurus dependencies
        run: cd docs && npm ci
      - name: Build Docusaurus
        run: cd docs && npm run build

  manual_cli_e2e:
    name: Manual CLI Harness (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: integration_tests
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stack: [rust, generic, rails, node]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Build CLI
        run: cargo build -p branchbox-cli
      - name: Run manual CLI harness
        env:
          BRANCHBOX_SKIP_HOST_VALIDATION: 1
          STACK: ${{ matrix.stack }}
        run: scripts/manual-cli-e2e.sh
