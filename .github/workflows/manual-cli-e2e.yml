name: Manual CLI E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  manual_cli_e2e:
    name: Manual CLI Harness (${{ matrix.stack }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stack: [rust, generic, rails, node]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install --global @devcontainers/cli@0.80.3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Set up Mr Boxington pilot
        id: mbx
        uses: jdx/mr-boxington-action@d0825fbaf3cc36ca2609aa38e71046265a1f1e37 # v1.7.1
        with:
          version: '1.22.0'
          backend: github
          github-cache-mode: target
          cache-generation: branchbox-manual-cli-v1
          cache-key-suffix: ${{ matrix.stack }}

      - name: Verify read-only cache policy
        if: steps.mbx.outputs.cache-save-eligible != 'false'
        run: |
          echo '::error::A reader job must not be eligible to save the cache.'
          exit 1

      - name: Build CLI
        run: mbx build -p branchbox-cli

      - name: Run manual CLI harness
        env:
          BRANCHBOX_SKIP_HOST_VALIDATION: 1
          STACK: ${{ matrix.stack }}
        run: |
          # This wrapper covers the unchanged harness's current cargo build command.
          cargo() { mbx "$@"; }
          export -f cargo
          scripts/manual-cli-e2e.sh
