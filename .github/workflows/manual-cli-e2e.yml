name: Manual CLI E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  manual_cli_e2e:
    name: Manual CLI Harness (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stack: [rust, generic, rails, node]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install --global @devcontainers/cli@0.80.3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build CLI
        run: cargo build -p branchbox-cli

      - name: Run manual CLI harness
        env:
          BRANCHBOX_SKIP_HOST_VALIDATION: 1
          STACK: ${{ matrix.stack }}
        run: scripts/manual-cli-e2e.sh
