name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Parse version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release detected"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Stable release"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: |
          cargo install git-cliff --locked

      - name: Generate changelog
        run: |
          if [[ "${{ steps.version.outputs.is_prerelease }}" == "true" ]]; then
            # For pre-releases, generate changelog from last tag
            git-cliff --tag v${{ steps.version.outputs.version }} --unreleased > RELEASE_CHANGELOG.md
          else
            # For stable releases, generate full changelog for this version
            git-cliff --tag v${{ steps.version.outputs.version }} --unreleased > RELEASE_CHANGELOG.md
          fi

          # Add installation instructions to release notes
          cat >> RELEASE_CHANGELOG.md <<'EOF'

          ## Installation

          See [installation instructions](https://github.com/${{ github.repository }}#installation).

          ### Download Binaries

          Download the appropriate binary for your platform from the assets below.

          ### Verify Downloads

          ```bash
          # Download checksums
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/checksums.txt -o checksums.txt

          # Verify archive (Linux/macOS)
          sha256sum -c checksums.txt --ignore-missing

          # Verify archive (Windows PowerShell)
          # Compare the hash with the one in checksums.txt
          Get-FileHash branchbox-${{ steps.version.outputs.version }}-windows-x86_64.zip -Algorithm SHA256
          ```

          EOF

          # Add full changelog link (finding previous tag)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "" >> RELEASE_CHANGELOG.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ steps.version.outputs.version }}" >> RELEASE_CHANGELOG.md
          fi

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_CHANGELOG.md \
            ${{ steps.version.outputs.is_prerelease == 'true' && '--prerelease' || '' }} \
            --draft

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: RELEASE_CHANGELOG.md
          retention-days: 1

  build-release:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-13
            archive_ext: tar.gz

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-14
            archive_ext: tar.gz

          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-release-

      - name: Build
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} --package branchbox-cli
          else
            cargo build --release --target ${{ matrix.target }} --package branchbox-cli
          fi
        shell: bash

      - name: Strip binary (Linux)
        if: runner.os == 'Linux' && matrix.use_cross != true
        run: strip target/${{ matrix.target }}/release/branchbox

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/branchbox

      - name: Prepare archive directory (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE_NAME="branchbox-${{ needs.create-release.outputs.version }}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"

          # Copy binary
          cp target/${{ matrix.target }}/release/branchbox "${ARCHIVE_NAME}/"

          # Copy documentation
          cp README.md LICENSE "${ARCHIVE_NAME}/"

          # Create version-specific changelog
          if [[ -f CHANGELOG.md ]]; then
            cp CHANGELOG.md "${ARCHIVE_NAME}/"
          fi

          echo "${ARCHIVE_NAME}" > archive_name.txt
        shell: bash

      - name: Prepare archive directory (Windows)
        if: runner.os == 'Windows'
        run: |
          $ARCHIVE_NAME = "branchbox-${{ needs.create-release.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $ARCHIVE_NAME

          # Copy binary
          Copy-Item target/${{ matrix.target }}/release/branchbox.exe "$ARCHIVE_NAME/"

          # Copy documentation
          Copy-Item README.md,LICENSE "$ARCHIVE_NAME/"

          # Create version-specific changelog
          if (Test-Path CHANGELOG.md) {
            Copy-Item CHANGELOG.md "$ARCHIVE_NAME/"
          }

          echo $ARCHIVE_NAME > archive_name.txt

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE_NAME=$(cat archive_name.txt)
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "${ARCHIVE_NAME}.tar.gz" > asset_path.txt
        shell: bash

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          $ARCHIVE_NAME = Get-Content archive_name.txt
          Compress-Archive -Path "$ARCHIVE_NAME/*" -DestinationPath "$ARCHIVE_NAME.zip"
          "$ARCHIVE_NAME.zip" | Out-File -FilePath asset_path.txt -Encoding ASCII -NoNewline

      - name: Generate checksum (Linux)
        if: runner.os == 'Linux'
        run: |
          ASSET_PATH=$(cat asset_path.txt)
          sha256sum "$ASSET_PATH" > "$ASSET_PATH.sha256"
          cat "$ASSET_PATH.sha256"
        shell: bash

      - name: Generate checksum (macOS)
        if: runner.os == 'macOS'
        run: |
          ASSET_PATH=$(cat asset_path.txt)
          shasum -a 256 "$ASSET_PATH" > "$ASSET_PATH.sha256"
          cat "$ASSET_PATH.sha256"
        shell: bash

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        run: |
          $ASSET_PATH = Get-Content asset_path.txt -Raw
          $ASSET_PATH = $ASSET_PATH.Trim()
          $hash = (Get-FileHash "$ASSET_PATH" -Algorithm SHA256).Hash.ToLower()
          $filename = Split-Path "$ASSET_PATH" -Leaf
          "$hash  $filename" | Out-File -FilePath "$ASSET_PATH.sha256" -Encoding ASCII
          Get-Content "$ASSET_PATH.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate checksums
        run: |
          # Collect all individual checksums into a single file
          find artifacts -name "*.sha256" -exec cat {} \; > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload all archives and the consolidated checksums file
          cd artifacts

          # Enable nullglob so non-matching patterns expand to nothing
          shopt -s nullglob

          for dir in binary-*; do
            if [[ -d "$dir" ]]; then
              cd "$dir"
              for file in *.tar.gz *.zip; do
                if [[ -f "$file" ]]; then
                  gh release upload "v${{ needs.create-release.outputs.version }}" \
                    "$file" \
                    --repo ${{ github.repository }}
                fi
              done
              cd ..
            fi
          done
          cd ..

          # Upload consolidated checksums
          gh release upload "v${{ needs.create-release.outputs.version }}" \
            checksums.txt \
            --repo ${{ github.repository }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mark release as published (remove draft status)
          gh release edit "v${{ needs.create-release.outputs.version }}" \
            --draft=false \
            --repo ${{ github.repository }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: [create-release, build-release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: needs.create-release.outputs.is_prerelease == 'false'

    env:
      HOMEBREW_TAP_REPO: branchbox/homebrew-tap

    steps:
      - name: Validate prerequisites
        run: |
          if [[ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]]; then
            echo "❌ Error: HOMEBREW_TAP_TOKEN secret is not set"
            echo "See docs/HOMEBREW_SETUP.md for setup instructions"
            exit 1
          fi
          echo "✓ Prerequisites validated"

      - name: Checkout homebrew-tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download checksums with retry
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/checksums.txt"

          echo "Downloading checksums from: $URL"
          for i in {1..5}; do
            if curl -fsSL "$URL" -o checksums.txt; then
              echo "✓ Downloaded checksums (attempt $i)"
              echo "Contents:"
              cat checksums.txt
              exit 0
            fi
            echo "⏳ Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          echo "❌ Failed to download checksums after 5 attempts"
          exit 1

      - name: Extract checksums for all platforms
        id: checksums
        run: |
          # Extract macOS checksums
          MACOS_INTEL=$(grep "branchbox-.*-x86_64-apple-darwin\.tar\.gz$" checksums.txt | awk '{print $1}')
          MACOS_ARM=$(grep "branchbox-.*-aarch64-apple-darwin\.tar\.gz$" checksums.txt | awk '{print $1}')

          # Extract Linux checksums
          LINUX_INTEL=$(grep "branchbox-.*-x86_64-unknown-linux-gnu\.tar\.gz$" checksums.txt | awk '{print $1}')
          LINUX_ARM=$(grep "branchbox-.*-aarch64-unknown-linux-gnu\.tar\.gz$" checksums.txt | awk '{print $1}')

          # Validate all checksums were found
          if [[ -z "$MACOS_INTEL" ]] || [[ -z "$MACOS_ARM" ]] || [[ -z "$LINUX_INTEL" ]] || [[ -z "$LINUX_ARM" ]]; then
            echo "❌ Error: Failed to extract all checksums"
            echo "macOS Intel: '$MACOS_INTEL'"
            echo "macOS ARM: '$MACOS_ARM'"
            echo "Linux Intel: '$LINUX_INTEL'"
            echo "Linux ARM: '$LINUX_ARM'"
            echo ""
            echo "Checksums file contents:"
            cat checksums.txt
            exit 1
          fi

          # Validate checksum format (64 hex characters for SHA256)
          for checksum in "$MACOS_INTEL" "$MACOS_ARM" "$LINUX_INTEL" "$LINUX_ARM"; do
            if ! [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]; then
              echo "❌ Error: Invalid checksum format: $checksum"
              exit 1
            fi
          done

          # Output all checksums
          echo "macos_intel=$MACOS_INTEL" >> $GITHUB_OUTPUT
          echo "macos_arm=$MACOS_ARM" >> $GITHUB_OUTPUT
          echo "linux_intel=$LINUX_INTEL" >> $GITHUB_OUTPUT
          echo "linux_arm=$LINUX_ARM" >> $GITHUB_OUTPUT

          echo "✓ Extracted checksums:"
          echo "  macOS Intel: $MACOS_INTEL"
          echo "  macOS ARM:   $MACOS_ARM"
          echo "  Linux Intel: $LINUX_INTEL"
          echo "  Linux ARM:   $LINUX_ARM"

      - name: Update formula
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cd homebrew-tap/Formula

          echo "Updating formula to version $VERSION..."

          # Update macOS Intel URL and checksum
          sed -i 's|url "https://github.com/branchbox/branchbox/releases/download/v.*/branchbox-.*-x86_64-apple-darwin.tar.gz"|url "https://github.com/branchbox/branchbox/releases/download/v'$VERSION'/branchbox-'$VERSION'-x86_64-apple-darwin.tar.gz"|' branchbox.rb
          sed -i '0,/x86_64-apple-darwin/{//!b};N;s/sha256 "[^"]*"/sha256 "'${{ steps.checksums.outputs.macos_intel }}'"/' branchbox.rb

          # Update macOS ARM URL and checksum
          sed -i 's|url "https://github.com/branchbox/branchbox/releases/download/v.*/branchbox-.*-aarch64-apple-darwin.tar.gz"|url "https://github.com/branchbox/branchbox/releases/download/v'$VERSION'/branchbox-'$VERSION'-aarch64-apple-darwin.tar.gz"|' branchbox.rb
          sed -i '0,/aarch64-apple-darwin/{//!b};N;s/sha256 "[^"]*"/sha256 "'${{ steps.checksums.outputs.macos_arm }}'"/' branchbox.rb

          # Update Linux Intel URL and checksum
          sed -i 's|url "https://github.com/branchbox/branchbox/releases/download/v.*/branchbox-.*-x86_64-unknown-linux-gnu.tar.gz"|url "https://github.com/branchbox/branchbox/releases/download/v'$VERSION'/branchbox-'$VERSION'-x86_64-unknown-linux-gnu.tar.gz"|' branchbox.rb
          sed -i '0,/x86_64-unknown-linux-gnu/{//!b};N;s/sha256 "[^"]*"/sha256 "'${{ steps.checksums.outputs.linux_intel }}'"/' branchbox.rb

          # Update Linux ARM URL and checksum
          sed -i 's|url "https://github.com/branchbox/branchbox/releases/download/v.*/branchbox-.*-aarch64-unknown-linux-gnu.tar.gz"|url "https://github.com/branchbox/branchbox/releases/download/v'$VERSION'/branchbox-'$VERSION'-aarch64-unknown-linux-gnu.tar.gz"|' branchbox.rb
          sed -i '0,/aarch64-unknown-linux-gnu/{//!b};N;s/sha256 "[^"]*"/sha256 "'${{ steps.checksums.outputs.linux_arm }}'"/' branchbox.rb

      - name: Verify formula updates
        run: |
          cd homebrew-tap/Formula

          # Verify all checksums were updated
          for checksum in "${{ steps.checksums.outputs.macos_intel }}" \
                          "${{ steps.checksums.outputs.macos_arm }}" \
                          "${{ steps.checksums.outputs.linux_intel }}" \
                          "${{ steps.checksums.outputs.linux_arm }}"; do
            if ! grep -q "$checksum" branchbox.rb; then
              echo "❌ Error: Failed to update checksum $checksum in formula"
              exit 1
            fi
          done

          echo "✓ Formula updates verified"
          echo ""
          echo "Changes made:"
          git diff branchbox.rb

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          git config user.name "branchbox-release-bot"
          git config user.email "noreply+release-bot@github.com"
          git add Formula/branchbox.rb

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit (formula already up to date)"
          else
            git commit -m "chore: update formula to v${{ needs.create-release.outputs.version }}"
            git push
            echo "✓ Successfully updated Homebrew formula to v${{ needs.create-release.outputs.version }}"
          fi
