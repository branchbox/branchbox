name: Local VM Firecracker E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'core/src/runtime/**'
      - 'scripts/local-vm/**'
      - 'scripts/manual-local-vm-e2e.sh'
      - '.github/workflows/local-vm-e2e.yml'

permissions:
  contents: read

jobs:
  firecracker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/setup-buildx-action@v3
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables jq rsync socat e2fsprogs
          sudo sysctl -w net.ipv4.ip_forward=1
      - name: Install pinned Firecracker and jailer
        env:
          FIRECRACKER_VERSION: v1.16.1
          FIRECRACKER_SHA256: 382a02a869e4d6d5cb14c40577f9545e8458021ea8b0b2d3fc10ec14d9c242e6
        run: |
          archive="firecracker-${FIRECRACKER_VERSION}-x86_64.tgz"
          curl -fsSLO "https://github.com/firecracker-microvm/firecracker/releases/download/${FIRECRACKER_VERSION}/${archive}"
          printf '%s  %s\n' "$FIRECRACKER_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive"
          sudo install -m 0755 "release-${FIRECRACKER_VERSION}-x86_64/firecracker-${FIRECRACKER_VERSION}-x86_64" /usr/local/bin/firecracker
          sudo install -m 0755 "release-${FIRECRACKER_VERSION}-x86_64/jailer-${FIRECRACKER_VERSION}-x86_64" /usr/local/bin/jailer
      - name: Build digest-addressed guest image
        env:
          BRANCHBOX_LOCAL_VM_GHA_CACHE: '1'
        run: scripts/local-vm/build-image.sh
      - name: Verify fail-closed guest kernel contract
        run: |
          manifest=target/local-vm-image/manifest.json
          config=target/local-vm-image/kernel.config
          requirements=scripts/local-vm/image/kernel-required.config
          test "$(jq -er '.format_version' "$manifest")" = 2
          test "$(jq -er '.schema_version' "$manifest")" = branchbox.local-vm-guest-base/2
          test "$(jq -er '.capabilities.guest_to_host_vsock' "$manifest")" = true
          test "$(jq -er '.capabilities.legacy_ipv4_xtables' "$manifest")" = 1
          test "$(jq -er '.kernel_config.name' "$manifest")" = kernel.config
          test "$(jq -er '.kernel_config.sha256' "$manifest")" = "$(sha256sum "$config" | awk '{print $1}')"
          test "$(jq -c '.kernel_config.required' "$manifest")" = \
            "$(jq -Rsc 'split("\n") | map(select(length > 0))' "$requirements")"
          while IFS= read -r requirement; do grep -Fqx "$requirement" "$config"; done < "$requirements"
      - name: Install guest image
        run: |
          sudo install -d -m 0755 /var/lib/branchbox/local-vm/images/current
          sudo install -m 0644 target/local-vm-image/vmlinux target/local-vm-image/kernel.config target/local-vm-image/rootfs.ext4 target/local-vm-image/manifest.json /var/lib/branchbox/local-vm/images/current/
      - name: Prove incomplete vsock artifacts fail preflight
        run: |
          invalid_image=$(mktemp -d)
          cp target/local-vm-image/vmlinux target/local-vm-image/rootfs.ext4 target/local-vm-image/manifest.json "$invalid_image/"
          if BRANCHBOX_LOCAL_VM_IMAGE_DIR="$invalid_image" scripts/local-vm/branchbox-local-vm validate 2>"$invalid_image/error.log"; then
            echo 'image without kernel.config unexpectedly passed validation' >&2
            exit 1
          fi
          grep -q 'approved kernel/rootfs artifacts are missing' "$invalid_image/error.log"
      - name: Prove self-declared kernel requirements cannot weaken the fixed contract
        run: |
          invalid_image=$(mktemp -d)
          cp target/local-vm-image/{vmlinux,kernel.config,rootfs.ext4,manifest.json} "$invalid_image/"
          sed -i 's/^CONFIG_NETFILTER_XT_MATCH_OWNER=y$/# CONFIG_NETFILTER_XT_MATCH_OWNER is not set/' \
            "$invalid_image/kernel.config"
          config_sha=$(sha256sum "$invalid_image/kernel.config" | awk '{print $1}')
          jq --arg config_sha "$config_sha" '.kernel_config.sha256 = $config_sha' \
            "$invalid_image/manifest.json" >"$invalid_image/manifest.next"
          mv "$invalid_image/manifest.next" "$invalid_image/manifest.json"
          if BRANCHBOX_LOCAL_VM_IMAGE_DIR="$invalid_image" scripts/local-vm/branchbox-local-vm validate \
            2>"$invalid_image/error.log"; then
            echo 'image without the UID-owner matcher unexpectedly passed validation' >&2
            exit 1
          fi
          grep -q 'approved kernel is missing CONFIG_NETFILTER_XT_MATCH_OWNER=y' \
            "$invalid_image/error.log"
      - name: Prove failed prepare leaves no host artifacts
        run: |
          state_dir=$(mktemp -d)
          workspace=$(mktemp -d)
          git -C "$workspace" init -b main
          if BRANCHBOX_LOCAL_VM_STATE_DIR="$state_dir" \
            BRANCHBOX_LOCAL_VM_TEST_FAIL_AFTER_NETWORK=1 \
            scripts/local-vm/branchbox-local-vm prepare cleanup-probe "$workspace" "$workspace" '[]'; then
            echo 'injected prepare failure unexpectedly succeeded' >&2
            exit 1
          fi
          test -z "$(find "$state_dir" -mindepth 1 -print -quit)"
          ! ip -o link show | grep -q 'bb[0-9a-f]\{10\}'
      - name: Run full Firecracker lifecycle proof
        run: scripts/manual-local-vm-e2e.sh
      - name: Prove no host artifacts remain
        if: always()
        run: |
          if pgrep -x firecracker; then
            echo 'orphaned Firecracker process remains' >&2
            exit 1
          fi
          if ip -o link show | grep -q 'bb[0-9a-f]\{10\}'; then
            echo 'orphaned BranchBox TAP device remains' >&2
            exit 1
          fi
      - name: Verify portable guest-base publication
        run: |
          manifest=target/local-vm-image/manifest.json
          kernel=target/local-vm-image/vmlinux
          config=target/local-vm-image/kernel.config
          archive=target/local-vm-image/rootfs.tar.gz
          requirements=scripts/local-vm/image/kernel-required.config
          test -f "$manifest"
          test -f "$kernel"
          test -f "$config"
          test -f "$archive"
          test "$(jq -er '.schema_version' "$manifest")" = branchbox.local-vm-guest-base/2
          test "$(jq -er '.source_repository' "$manifest")" = branchbox/branchbox
          test "$(jq -er '.source_commit' "$manifest")" = "$SOURCE_COMMIT"
          test "$(jq -er '.kernel_sha256' "$manifest")" = "$(sha256sum "$kernel" | awk '{print $1}')"
          test "$(jq -er '.kernel_config.name' "$manifest")" = kernel.config
          test "$(jq -er '.kernel_config.sha256' "$manifest")" = "$(sha256sum "$config" | awk '{print $1}')"
          test "$(jq -c '.kernel_config.required' "$manifest")" = \
            "$(jq -Rsc 'split("\n") | map(select(length > 0))' "$requirements")"
          while IFS= read -r requirement; do grep -Fqx "$requirement" "$config"; done < "$requirements"
          test "$(jq -er '.rootfs_archive.name' "$manifest")" = rootfs.tar.gz
          test "$(jq -er '.rootfs_archive.size_bytes' "$manifest")" = "$(stat -c '%s' "$archive")"
          test "$(jq -er '.rootfs_archive.sha256' "$manifest")" = "$(sha256sum "$archive" | awk '{print $1}')"
      - name: Publish exact-head local-vm guest base
        uses: actions/upload-artifact@v4
        with:
          name: branchbox-local-vm-guest-base-${{ env.SOURCE_COMMIT }}
          path: |
            target/local-vm-image/vmlinux
            target/local-vm-image/kernel.config
            target/local-vm-image/rootfs.tar.gz
            target/local-vm-image/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
