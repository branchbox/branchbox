name: Build Devcontainer Images

on:
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - 'core/src/bootstrap/templates/**/Dockerfile'
      - '.github/workflows/devcontainer-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - 'core/src/bootstrap/templates/**/Dockerfile'
      - '.github/workflows/devcontainer-build.yml'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push images even on PR'
        required: false
        default: 'false'
        type: boolean
      stack:
        description: 'Build specific stack only (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - rust
          - rails
          - nodejs
          - generic

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}/devcontainer

jobs:
  # Build BranchBox's own devcontainer (used for developing BranchBox itself)
  build-branchbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push' || inputs.force_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.force_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=branchbox
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:buildcache
          cache-to: type=gha,mode=max,scope=branchbox
          # Only build both platforms on push to main; PRs just validate amd64
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  # Build official stack images (used by projects running branchbox init)
  build-stacks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        stack: [rust, rails, nodejs, generic]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push' || inputs.force_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.stack }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/src/bootstrap/templates/${{ matrix.stack }}/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.force_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.stack }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.stack }}:buildcache
          cache-to: type=gha,mode=max,scope=${{ matrix.stack }}
          # Only build both platforms on push to main; PRs just validate amd64
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  # Generate summary after all builds complete
  summary:
    runs-on: ubuntu-latest
    needs: [build-branchbox, build-stacks]
    if: always()
    steps:
      - name: Generate build summary
        run: |
          echo "## Devcontainer Image Builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ inputs.force_push }}" == "true" ]]; then
            echo "### Published Images" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Stack | Image |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| branchbox | \`ghcr.io/${{ github.repository }}/devcontainer:latest\` |" >> $GITHUB_STEP_SUMMARY
            echo "| rust | \`ghcr.io/${{ github.repository }}/devcontainer-rust:latest\` |" >> $GITHUB_STEP_SUMMARY
            echo "| rails | \`ghcr.io/${{ github.repository }}/devcontainer-rails:latest\` |" >> $GITHUB_STEP_SUMMARY
            echo "| nodejs | \`ghcr.io/${{ github.repository }}/devcontainer-nodejs:latest\` |" >> $GITHUB_STEP_SUMMARY
            echo "| generic | \`ghcr.io/${{ github.repository }}/devcontainer-generic:latest\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Users can now run \`branchbox init --stack <stack>\` and get instant startup!" >> $GITHUB_STEP_SUMMARY
          else
            echo "Build validated (no push on PR)" >> $GITHUB_STEP_SUMMARY
          fi
