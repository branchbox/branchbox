<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular dark mode version for GitHub profile pictures -->
  <!-- 500x500 as recommended by GitHub, with circular background -->

  <!-- Dark background circle -->
  <circle cx="250" cy="250" r="250" fill="#1a1a2e"/>

  <!-- Logo content scaled and centered -->
  <!-- Original logo is 32x32, scale to ~280x280 and center at 250,250 -->
  <!-- translate to center: (500-280)/2 = 110, then scale by 280/32 = 8.75 -->
  <g transform="translate(110, 110) scale(8.75)">
    <!-- Outer box with brighter purple for dark mode -->
    <rect x="2" y="2" width="28" height="28" rx="4" stroke="#a78bfa" stroke-width="2"/>

    <!-- Branch lines -->
    <path d="M8 10h6" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 16h10" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 22h6" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>

    <!-- Dots - brighter colors for dark mode -->
    <circle cx="22" cy="10" r="2" fill="#4ade80"/>
    <circle cx="22" cy="16" r="2" fill="#a78bfa"/>
    <circle cx="22" cy="22" r="2" fill="#22d3ee"/>
  </g>
</svg>
