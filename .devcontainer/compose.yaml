name: "${DEVCONTAINER_NAME:-branchbox}"

services:
  rust-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    privileged: true

    container_name: ${DEVCONTAINER_NAME:-branchbox}

    volumes:
      - ../..:/workspaces:cached
      - dind-data:/var/lib/docker
      - ../.codex:/home/vscode/.codex

    # Overrides default command so things don't shut down after the process ends
    command: sleep infinity

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally
    env_file:
      - ../.env

    # Docker-in-Docker daemon runs inside the container (no host socket mount)
    # Persist Codex configuration/history outside the container lifecycle

    # Environment variables
    environment:
      DOCKER_CONTAINER: "true"
      RUST_BACKTRACE: "1"

volumes:
  dind-data:
