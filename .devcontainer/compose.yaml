name: ${DEVCONTAINER_NAME:-branchbox}
services:
  rust-dev:
    # Use pre-built image from GHCR (faster startup)
    # Falls back to local build if image unavailable
    image: ghcr.io/branchbox/branchbox/devcontainer:latest
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    pull_policy: ${DEVCONTAINER_PULL_POLICY:-missing}
    privileged: true
    init: true
    ipc: host
    container_name: ${DEVCONTAINER_NAME:-branchbox}
    volumes:
    - ../..:/workspaces:cached
    - dind-data:/var/lib/docker
    - ${SHARED_CONFIG_DIR:-../..}/.codex:/home/vscode/.codex
    - ${SHARED_CONFIG_DIR:-../..}/.claude:/home/vscode/.claude
    - ${SHARED_CONFIG_DIR:-../..}/.gh:/home/vscode/.config/gh
    ports:
    - "50515:50515"
    - "8787:8787"
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
      - path: .branchbox.env
        required: false
    environment:
      DOCKER_CONTAINER: 'true'
      RUST_BACKTRACE: '1'
volumes:
  dind-data: null
