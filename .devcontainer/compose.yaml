name: ${DEVCONTAINER_NAME:-branchbox}
services:
  rust-dev:
    # Use pre-built image from GHCR (faster startup)
    # Falls back to local build if image unavailable
    image: ${DEVCONTAINER_IMAGE:-ghcr.io/branchbox/branchbox/devcontainer:latest}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    pull_policy: ${DEVCONTAINER_PULL_POLICY:-missing}
    privileged: true
    init: true
    ipc: host
    container_name: ${DEVCONTAINER_NAME:-branchbox}
    volumes:
    - ../..:/workspaces:cached
    - dind-data:/var/lib/docker
    # SSH keys for GitHub authentication (read-only for security)
    - ~/.ssh:/home/vscode/.ssh:ro
    # AI agent configs (encapsulated under .ai-agents/ directory)
    - ${SHARED_CONFIG_DIR:-../..}/.ai-agents/codex:/home/vscode/.codex
    - ${SHARED_CONFIG_DIR:-../..}/.ai-agents/claude:/home/vscode/.claude
    - ${SHARED_CONFIG_DIR:-../..}/.ai-agents/claude.json:/home/vscode/.claude.json
    # Optional: gh CLI for PRs/issues (not required for git operations with SSH)
    - ${SHARED_CONFIG_DIR:-../..}/.ai-agents/gh:/home/vscode/.config/gh
    ports:
    - "50515:50515"
    - "8787:8787"
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
      - path: .branchbox.env
        required: false
    environment:
      DOCKER_CONTAINER: 'true'
      RUST_BACKTRACE: '1'
volumes:
  dind-data: null
