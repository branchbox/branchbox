name: ${DEVCONTAINER_NAME:-branchbox}

# Resource limits to prevent system freezes with multiple containers
x-rust-limits: &rust_limits
  cpus: '2'                # Hard cap per container
  mem_limit: 6g
  memswap_limit: 8g
  pids_limit: 512

services:
  rust-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    privileged: true
    container_name: ${DEVCONTAINER_NAME:-branchbox}
    <<: *rust_limits
    volumes:
    - ../..:/workspaces:cached
    - dind-data:/var/lib/docker
    - ${SHARED_CONFIG_DIR:-../..}/.codex:/home/vscode/.codex
    - ${SHARED_CONFIG_DIR:-../..}/.claude:/home/vscode/.claude
    - ${SHARED_CONFIG_DIR:-../..}/.gh:/home/vscode/.config/gh
    - rust-cargo-registry:/usr/local/cargo/registry
    - rust-cargo-git:/usr/local/cargo/git
    - rust-sccache-cache:/home/vscode/.cache/sccache
    command: sleep infinity
    env_file:
    - ../.env
    - .branchbox.env
    environment:
      DOCKER_CONTAINER: 'true'
      RUST_BACKTRACE: '1'
    healthcheck:
      test: ["CMD", "bash", "-lc", "cargo --version && rustc --version"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  dind-data: null
  rust-cargo-registry:
  rust-cargo-git:
  rust-sccache-cache:
