words: Takes most meaningful words\n/// 4. Removes filler words: \"the\", \"a\", \"and\", \"for\", \"with\", \"feature\", \"integration\", \"support\"\n/// 5. DNS-safe: Only `a-z0-9-` characters\n///\n/// # Examples\n///\n/// ```\n/// use worktree_core::naming::generate_work_feature;\n///\n/// assert_eq!(\n///     generate_work_feature(\"OpenAI Responses API Integration\"),\n///     \"openai-responses-api\"\n/// );\n///\n/// assert_eq!(\n///     generate_work_feature(\"OAuth Connected Apps Feature\"),\n///     \"oauth-connected-apps\"\n/// );\n///\n/// assert_eq!(\n///     generate_work_feature(\"Fix Critical Bug in Authentication\"),\n///     \"fix-critical-bug\"\n/// );\n///\n/// assert_eq!(\n///     generate_work_feature(\"Support for Multiple LLM Providers\"),\n///     \"multiple-llm-providers\"\n/// );\n/// ```\npub fn generate_work_feature(title: \u0026str) -\u003e String {\n    // Convert to lowercase and remove special characters\n    let cleaned = clean_title(title);\n\n    // Split into words\n    let words: Vec\u003c\u0026str\u003e = cleaned.split_whitespace().collect();\n\n    // Remove filler words\n    let meaningful_words: Vec\u003c\u0026str\u003e = words\n        .into_iter()\n        .filter(|word| !FILLER_WORDS.contains(word))\n        .collect();\n\n    // Take first MAX_WORDS words and join with hyphens\n    meaningful_words\n        .into_iter()\n        .take(MAX_WORDS)\n        .collect::\u003cVec\u003c_\u003e\u003e()\n        .join(\"-\")\n}\n\n/// Clean title: lowercase and remove special characters\nfn clean_title(title: \u0026str) -\u003e String {\n    let re = Regex::new(r\"[^a-z0-9 _-]\").unwrap();\n    let lowercase = title.to_lowercase();\n    let cleaned = re.replace_all(\u0026lowercase, \"\");\n\n    // Normalize multiple spaces to single space\n    let re_spaces = Regex::new(r\"\\s+\").unwrap();\n    re_spaces.replace_all(\u0026cleaned, \" \").trim().to_string()\n}\n\n/// Validate WORK_FEATURE name (DNS-safe)\n///\n/// Returns `true` if the name contains only lowercase letters, numbers, and hyphens.\n///\n/// # Examples\n///\n/// ```\n/// use worktree_core::naming::validate_work_feature;\n///\n/// assert!(validate_work_feature(\"oauth-integration\"));\n/// assert!(validate_work_feature(\"api-v2\"));\n/// assert!(validate_work_feature(\"bug-fix-123\"));\n///\n/// assert!(!validate_work_feature(\"OAuth-Integration\")); // uppercase\n/// assert!(!validate_work_feature(\"oauth_integration\")); // underscore\n/// assert!(!validate_work_feature(\"oauth integration\")); // space\n/// assert!(!validate_work_feature(\"oauth.integration\")); // dot\n/// ```\npub fn validate_work_feature(work_feature: \u0026str) -\u003e bool {\n    let re = Regex::new(r\"^[a-z0-9-]+$\").unwrap();\n    re.is_match(work_feature)\n}\n\n/// Generate feature URL from base URL and work_feature name\n///\n/// # Examples\n///\n/// ```\n/// use worktree_core::naming::generate_feature_url;\n///\n/// let url = generate_feature_url(\"rida-mbp-agentify.rida.me\", \"oauth-integration\");\n/// assert_eq!(url, \"rida-mbp-agentify-oauth-integration.rida.me\");\n/// ```\npub fn generate_feature_url(base_url: \u0026str, work_feature: \u0026str) -\u003e String {\n    // Split base URL into prefix and domain\n    let parts: Vec\u003c\u0026str\u003e = base_url.splitn(2, '.').collect();\n\n    if parts.len() == 2 {\n        format!(\"{}-{}.{}\", parts[0], work_feature, parts[1])\n    } else {\n        // Fallback if no domain found\n        format!(\"{}-{}\", base_url, work_feature)\n    }\n}\n\n/// Generate tunnel name from base prefix and work_feature name\n///\n/// # Examples\n///\n/// ```\n/// use worktree_core::naming::generate_tunnel_name;\n///\n/// let name = generate_tunnel_name(\"rida-mbp-agentify\", \"oauth-integration\");\n/// assert_eq!(name, \"rida-mbp-agentify-oauth-integration\");\n/// ```\npub fn generate_tunnel_name(base_prefix: \u0026str, work_feature: \u0026str) -\u003e String {\n    format!(\"{}-{}\", base_prefix, work_feature)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_generate_work_feature() {\n        // Test cases from bash implementation\n        assert_eq!(\n            generate_work_feature(\"OpenAI Responses API Integration\"),\n            \"openai-responses-api\" // Keeps leading non-filler words\n        );\n\n        assert_eq!(\n            generate_work_feature(\"OAuth Connected Apps Feature\"),\n            \"oauth-connected-apps\"\n        );\n\n        assert_eq!(\n            generate_work_feature(\"Fix Critical Bug in Authentication\"),\n            \"fix-critical-bug\" // \"in\" is removed as filler\n        );\n\n        assert_eq!(\n            generate_work_feature(\"Support for Multiple LLM Providers\"),\n            \"multiple-llm-providers\" // \"Support for\" removed\n        );\n    }\n\n    #[test]\n    fn test_clean_title() {\n        assert_eq!(clean_title(\"OAuth-Integration\"), \"oauth-integration\");\n        assert_eq!(clean_title(\"API_v2\"), \"api_v2\");\n        assert_eq!(clean_title(\"Multiple   Spaces\"), \"multiple spaces\");\n        assert_eq!(clean_title(\"Special!@#$%Chars\"), \"specialchars\");\n    }\n\n    #[test]\n    fn test_validate_work_feature() {\n        // Valid names\n        assert!(validate_work_feature(\"oauth-integration\"));\n        assert!(validate_work_feature(\"api-v2\"));\n        assert!(validate_work_feature(\"bug-fix-123\"));\n        assert!(validate_work_feature(\"simple\"));\n\n        // Invalid names\n        assert!(!validate_work_feature(\"OAuth-Integration\")); // uppercase\n        assert!(!validate_work_feature(\"oauth_integration\")); // underscore\n        assert!(!validate_work_feature(\"oauth integration\")); // space\n        assert!(!validate_work_feature(\"oauth.integration\")); // dot\n        assert!(!validate_work_feature(\"\")); // empty\n    }\n\n    #[test]\n    fn test_generate_feature_url() {\n        assert_eq!(\n            generate_feature_url(\"rida-mbp-agentify.rida.me\", \"oauth-integration\"),\n            \"rida-mbp-agentify-oauth-integration.rida.me\"\n        );\n\n        assert_eq!(\n            generate_feature_url(\"dev.example.com\", \"test-feature\"),\n            \"dev-test-feature.example.com\"\n        );\n    }\n\n    #[test]\n    fn test_generate_tunnel_name() {\n        assert_eq!(\n            generate_tunnel_name(\"rida-mbp-agentify\", \"oauth-integration\"),\n            \"rida-mbp-agentify-oauth-integration\"\n        );\n    }\n\n    #[test]\n    fn test_max_words() {\n        let long_title =\n            \"This is a very long feature name with many words that should be truncated\";\n        let result = generate_work_feature(long_title);\n\n        // Should have at most MAX_WORDS parts\n        assert_eq!(result.split('-').count(), MAX_WORDS);\n    }\n\n    #[test]\n    fn test_all_filler_words() {\n        let result = generate_work_feature(\"the a an and or for with using\");\n        // All filler words removed, should be empty\n        assert_eq!(result, \"\");\n    }\n}\n","traces":[{"line":79,"address":[],"length":0,"stats":{"Line":14}},{"line":81,"address":[],"length":0,"stats":{"Line":42}},{"line":84,"address":[],"length":0,"stats":{"Line":56}},{"line":87,"address":[],"length":0,"stats":{"Line":42}},{"line":89,"address":[],"length":0,"stats":{"Line":158}},{"line":93,"address":[],"length":0,"stats":{"Line":42}},{"line":95,"address":[],"length":0,"stats":{"Line":28}},{"line":101,"address":[],"length":0,"stats":{"Line":18}},{"line":102,"address":[],"length":0,"stats":{"Line":72}},{"line":103,"address":[],"length":0,"stats":{"Line":54}},{"line":104,"address":[],"length":0,"stats":{"Line":72}},{"line":107,"address":[],"length":0,"stats":{"Line":72}},{"line":108,"address":[],"length":0,"stats":{"Line":54}},{"line":129,"address":[],"length":0,"stats":{"Line":24}},{"line":130,"address":[],"length":0,"stats":{"Line":96}},{"line":131,"address":[],"length":0,"stats":{"Line":72}},{"line":144,"address":[],"length":0,"stats":{"Line":24}},{"line":146,"address":[],"length":0,"stats":{"Line":120}},{"line":148,"address":[],"length":0,"stats":{"Line":24}},{"line":149,"address":[],"length":0,"stats":{"Line":96}},{"line":152,"address":[],"length":0,"stats":{"Line":0}},{"line":166,"address":[],"length":0,"stats":{"Line":16}},{"line":167,"address":[],"length":0,"stats":{"Line":32}}],"covered":22,"coverable":23},{"path":["/","workspaces","main","core","src","validation.rs"],"content":"//! Environment validation utilities for git worktree workflow\n//!\n//! Validates prerequisites and environment setup.\n\nuse crate::{Error, Result};\nuse std::collections::HashMap;\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\n/// Validate that a directory is a valid git worktree\n///\n/// Checks if .git exists (either as directory for main worktree or file for feature worktree)\n///\n/// # Examples\n///\n/// ```no_run\n/// use worktree_core::validation::validate_git_worktree;\n/// use std::path::Path;\n///\n/// let path = Path::new(\"/path/to/worktree\");\n/// if validate_git_worktree(path).is_ok() {\n///     println!(\"Valid git worktree\");\n/// }\n/// ```\npub fn validate_git_worktree(worktree_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n    let git_path = worktree_dir.join(\".git\");\n\n    if !git_path.exists() {\n        return Err(Error::validation(format!(\n            \"Not a git worktree: {} (no .git found)\",\n            worktree_dir.display()\n        )));\n    }\n\n    // Main worktree: .git is a directory with config file\n    if git_path.is_dir() {\n        let config_path = git_path.join(\"config\");\n        if config_path.exists() {\n            return Ok(());\n        }\n    }\n\n    // Feature worktree: .git is a file containing gitdir reference\n    if git_path.is_file() {\n        // Read the gitdir reference\n        let content = fs::read_to_string(\u0026git_path)\n            .map_err(|e| Error::validation(format!(\"Failed to read .git file: {}\", e)))?;\n\n        // Verify it has the gitdir reference\n        if content.starts_with(\"gitdir:\") {\n            // Try to verify the worktree is valid by checking if the referenced path exists\n            let gitdir = content.trim_start_matches(\"gitdir:\").trim();\n            let gitdir_path = if gitdir.starts_with('/') {\n                PathBuf::from(gitdir)\n            } else {\n                worktree_dir.join(gitdir)\n            };\n\n            if gitdir_path.exists() {\n                return Ok(());\n            } else {\n                return Err(Error::validation(format!(\n                    \"Git worktree path mismatch: referenced path does not exist: {}\",\n                    gitdir_path.display()\n                )));\n            }\n        }\n    }\n\n    Err(Error::validation(format!(\n        \"Invalid git worktree: {}\",\n        worktree_dir.display()\n    )))\n}\n\n/// Check if running on host (not in container)\n///\n/// Returns `Ok(())` if running on host, `Err` if in container.\npub fn validate_host_environment() -\u003e Result\u003c()\u003e {\n    // Check for Docker environment\n    if Path::new(\"/.dockerenv\").exists() {\n        return Err(Error::validation(\n            \"Running in Docker container. This command must be run on the host machine.\"\n                .to_string(),\n        ));\n    }\n\n    // Check for Docker environment variable\n    if std::env::var(\"DOCKER_CONTAINER\").is_ok() {\n        return Err(Error::validation(\n            \"Running in Docker container. This command must be run on the host machine.\"\n                .to_string(),\n        ));\n    }\n\n    Ok(())\n}\n\n/// Validate .env file exists and has required variables\n///\n/// # Examples\n///\n/// ```no_run\n/// use worktree_core::validation::validate_env_file;\n/// use std::path::Path;\n///\n/// let env_file = Path::new(\".env\");\n/// let required_vars = vec![\"APP_URL\", \"DATABASE_URL\"];\n///\n/// if validate_env_file(env_file, \u0026required_vars).is_ok() {\n///     println!(\"Environment file is valid\");\n/// }\n/// ```\npub fn validate_env_file(env_file: \u0026Path, required_vars: \u0026[\u0026str]) -\u003e Result\u003c()\u003e {\n    if !env_file.exists() {\n        return Err(Error::validation(format!(\n            \"Environment file not found: {}\",\n            env_file.display()\n        )));\n    }\n\n    let content = fs::read_to_string(env_file)\n        .map_err(|e| Error::validation(format!(\"Failed to read .env file: {}\", e)))?;\n\n    // Check for required variables\n    for var in required_vars {\n        let pattern = format!(\"{}=\", var);\n        if !content.lines().any(|line| line.starts_with(\u0026pattern)) {\n            return Err(Error::validation(format!(\n                \"Required environment variable not found in {}: {}\",\n                env_file.display(),\n                var\n            )));\n        }\n    }\n\n    Ok(())\n}\n\n/// Parse .env file and extract all variables\n///\n/// Returns a HashMap of variable names to values.\n///\n/// # Examples\n///\n/// ```no_run\n/// use worktree_core::validation::parse_env_file;\n/// use std::path::Path;\n///\n/// let env_file = Path::new(\".env\");\n/// let vars = parse_env_file(env_file).unwrap();\n///\n/// if let Some(app_url) = vars.get(\"APP_URL\") {\n///     println!(\"APP_URL: {}\", app_url);\n/// }\n/// ```\npub fn parse_env_file(env_file: \u0026Path) -\u003e Result\u003cHashMap\u003cString, String\u003e\u003e {\n    let content = fs::read_to_string(env_file)\n        .map_err(|e| Error::validation(format!(\"Failed to read .env file: {}\", e)))?;\n\n    let mut vars = HashMap::new();\n\n    for line in content.lines() {\n        let line = line.trim();\n\n        // Skip empty lines and comments\n        if line.is_empty() || line.starts_with('#') {\n            continue;\n        }\n\n        // Parse KEY=VALUE\n        if let Some((key, value)) = line.split_once('=') {\n            let key = key.trim().to_string();\n            let value = value\n                .trim()\n                .trim_matches('\"')\n                .trim_matches('\\'')\n                .to_string();\n\n            vars.insert(key, value);\n        }\n    }\n\n    Ok(vars)\n}\n\n/// App URL components\n#[derive(Debug, Clone, PartialEq)]\npub struct AppUrl {\n    /// Full URL (without protocol)\n    pub url: String,\n    /// Base prefix (subdomain part before first dot)\n    pub base_prefix: String,\n    /// Base domain (everything after first dot)\n    pub base_domain: String,\n}\n\nimpl AppUrl {\n    /// Parse APP_URL from a string\n    ///\n    /// Strips protocol (http:// or https://) and splits into prefix and domain.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use worktree_core::validation::AppUrl;\n    ///\n    /// let app_url = AppUrl::parse(\"https://rida-mbp-agentify.rida.me\").unwrap();\n    /// assert_eq!(app_url.base_prefix, \"rida-mbp-agentify\");\n    /// assert_eq!(app_url.base_domain, \"rida.me\");\n    /// assert_eq!(app_url.url, \"rida-mbp-agentify.rida.me\");\n    /// ```\n    pub fn parse(url: \u0026str) -\u003e Result\u003cSelf\u003e {\n        // Strip protocol\n        let url = url\n            .trim()\n            .trim_start_matches(\"https://\")\n            .trim_start_matches(\"http://\");\n\n        if url.is_empty() {\n            return Err(Error::validation(\"APP_URL cannot be empty\".to_string()));\n        }\n\n        // Split into prefix and domain\n        let parts: Vec\u003c\u0026str\u003e = url.splitn(2, '.').collect();\n\n        if parts.len() \u003c 2 {\n            return Err(Error::validation(format!(\n                \"Invalid APP_URL format (expected subdomain.domain): {}\",\n                url\n            )));\n        }\n\n        Ok(Self {\n            url: url.to_string(),\n            base_prefix: parts[0].to_string(),\n            base_domain: parts[1].to_string(),\n        })\n    }\n\n    /// Parse APP_URL from .env file\n    ///\n    /// # Examples\n    ///\n    /// ```no_run\n    /// use worktree_core::validation::AppUrl;\n    /// use std::path::Path;\n    ///\n    /// let env_file = Path::new(\".env\");\n    /// let app_url = AppUrl::from_env_file(env_file).unwrap();\n    /// println!(\"Base prefix: {}\", app_url.base_prefix);\n    /// ```\n    pub fn from_env_file(env_file: \u0026Path) -\u003e Result\u003cSelf\u003e {\n        let vars = parse_env_file(env_file)?;\n\n        let url = vars\n            .get(\"APP_URL\")\n            .ok_or_else(|| Error::validation(\"APP_URL not found in .env file\".to_string()))?;\n\n        Self::parse(url)\n    }\n}\n\n/// Cloudflare credentials\n#[derive(Debug, Clone)]\npub struct CloudflareCredentials {\n    pub api_key: Option\u003cString\u003e,\n    pub account_id: Option\u003cString\u003e,\n}\n\nimpl CloudflareCredentials {\n    /// Read Cloudflare credentials from .env file\n    ///\n    /// Returns `None` values if credentials are not found (not an error).\n    pub fn from_env_file(env_file: \u0026Path) -\u003e Result\u003cSelf\u003e {\n        let vars = parse_env_file(env_file)?;\n\n        Ok(Self {\n            api_key: vars.get(\"CLOUDFLARE_API_KEY\").cloned(),\n            account_id: vars.get(\"CLOUDFLARE_ACCOUNT_ID\").cloned(),\n        })\n    }\n\n    /// Check if credentials are complete\n    pub fn is_complete(\u0026self) -\u003e bool {\n        self.api_key.is_some() \u0026\u0026 self.account_id.is_some()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::io::Write;\n    use tempfile::NamedTempFile;\n\n    #[test]\n    fn test_parse_app_url() {\n        let url = AppUrl::parse(\"https://rida-mbp-agentify.rida.me\").unwrap();\n        assert_eq!(url.base_prefix, \"rida-mbp-agentify\");\n        assert_eq!(url.base_domain, \"rida.me\");\n        assert_eq!(url.url, \"rida-mbp-agentify.rida.me\");\n\n        let url = AppUrl::parse(\"dev.example.com\").unwrap();\n        assert_eq!(url.base_prefix, \"dev\");\n        assert_eq!(url.base_domain, \"example.com\");\n    }\n\n    #[test]\n    fn test_parse_app_url_invalid() {\n        assert!(AppUrl::parse(\"\").is_err());\n        assert!(AppUrl::parse(\"nodomain\").is_err());\n    }\n\n    #[test]\n    fn test_parse_env_file() {\n        let mut temp_file = NamedTempFile::new().unwrap();\n        writeln!(temp_file, \"APP_URL=rida-mbp-agentify.rida.me\").unwrap();\n        writeln!(temp_file, \"DATABASE_URL=\\\"postgres://localhost/db\\\"\").unwrap();\n        writeln!(temp_file, \"# Comment line\").unwrap();\n        writeln!(temp_file).unwrap();\n        writeln!(temp_file, \"REDIS_URL='redis://localhost'\").unwrap();\n        temp_file.flush().unwrap();\n\n        let vars = parse_env_file(temp_file.path()).unwrap();\n\n        assert_eq!(vars.get(\"APP_URL\").unwrap(), \"rida-mbp-agentify.rida.me\");\n        assert_eq!(vars.get(\"DATABASE_URL\").unwrap(), \"postgres://localhost/db\");\n        assert_eq!(vars.get(\"REDIS_URL\").unwrap(), \"redis://localhost\");\n        assert_eq!(vars.len(), 3);\n    }\n\n    #[test]\n    fn test_validate_env_file() {\n        let mut temp_file = NamedTempFile::new().unwrap();\n        writeln!(temp_file, \"APP_URL=test.com\").unwrap();\n        writeln!(temp_file, \"DATABASE_URL=postgres://localhost\").unwrap();\n        temp_file.flush().unwrap();\n\n        // Valid\n        assert!(validate_env_file(temp_file.path(), \u0026[\"APP_URL\"]).is_ok());\n        assert!(validate_env_file(temp_file.path(), \u0026[\"APP_URL\", \"DATABASE_URL\"]).is_ok());\n\n        // Missing variable\n        assert!(validate_env_file(temp_file.path(), \u0026[\"MISSING_VAR\"]).is_err());\n    }\n\n    #[test]\n    fn test_cloudflare_credentials() {\n        let mut temp_file = NamedTempFile::new().unwrap();\n        writeln!(temp_file, \"CLOUDFLARE_API_KEY=secret\").unwrap();\n        writeln!(temp_file, \"CLOUDFLARE_ACCOUNT_ID=account123\").unwrap();\n        temp_file.flush().unwrap();\n\n        let creds = CloudflareCredentials::from_env_file(temp_file.path()).unwrap();\n        assert_eq!(creds.api_key.as_deref(), Some(\"secret\"));\n        assert_eq!(creds.account_id.as_deref(), Some(\"account123\"));\n        assert!(creds.is_complete());\n    }\n\n    #[test]\n    fn test_cloudflare_credentials_incomplete() {\n        let mut temp_file = NamedTempFile::new().unwrap();\n        writeln!(temp_file, \"CLOUDFLARE_API_KEY=secret\").unwrap();\n        temp_file.flush().unwrap();\n\n        let creds = CloudflareCredentials::from_env_file(temp_file.path()).unwrap();\n        assert!(creds.api_key.is_some());\n        assert!(creds.account_id.is_none());\n        assert!(!creds.is_complete());\n    }\n\n    #[test]\n    fn test_validate_host_environment() {\n        // This will pass on host, fail in container\n        // Can't reliably test both scenarios without actual container\n        let result = validate_host_environment();\n        // Just ensure it doesn't panic\n        let _ = result;\n    }\n}\n","traces":[{"line":25,"address":[],"length":0,"stats":{"Line":11}},{"line":26,"address":[],"length":0,"stats":{"Line":33}},{"line":28,"address":[],"length":0,"stats":{"Line":11}},{"line":29,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":11}},{"line":37,"address":[],"length":0,"stats":{"Line":22}},{"line":38,"address":[],"length":0,"stats":{"Line":11}},{"line":39,"address":[],"length":0,"stats":{"Line":11}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"a
