<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 10px;
}
.code-line {
  margin: 0;
  padding: 0.3em;
  height: 1em;
  counter-increment: line;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

erive(Subcommand)]\nenum Commands {\n    /// Initialize project with devcontainer (alias: bootstrap)\n    #[command(alias = \"bootstrap\")]\n    Init {\n        /// Project directory (defaults to current directory)\n        #[arg(short, long)]\n        path: Option\u003cPathBuf\u003e,\n\n        /// Force specific stack (rails, nodejs, rust, generic)\n        #[arg(short, long)]\n        stack: Option\u003cString\u003e,\n    },\n\n    /// Detect project configuration\n    Detect {\n        /// Project directory (defaults to current directory)\n        #[arg(short, long)]\n        path: Option\u003cPathBuf\u003e,\n    },\n\n    /// Feature name utilities\n    #[command(subcommand)]\n    Name(NameCommands),\n\n    /// Manage feature worktrees\n    #[command(subcommand)]\n    Feature(FeatureCommands),\n}\n\n#[derive(Subcommand)]\nenum NameCommands {\n    /// Generate feature name from title\n    Generate {\n        /// Feature title (e.g., \"OAuth Integration\")\n        title: String,\n    },\n\n    /// Validate feature name\n    Validate {\n        /// Feature name to validate (e.g., \"oauth-integration\")\n        name: String,\n    },\n}\n\nfn main() -\u003e Result\u003c()\u003e {\n    // Initialize logging\n    tracing_subscriber::fmt()\n        .with_env_filter(\n            tracing_subscriber::EnvFilter::try_from_default_env()\n                .unwrap_or_else(|_| tracing_subscriber::EnvFilter::new(\"info\")),\n        )\n        .init();\n\n    let cli = Cli::parse();\n\n    match cli.command {\n        Commands::Init { path, stack } =\u003e {\n            let project_path = path.unwrap_or_else(|| PathBuf::from(\".\"));\n            let bootstrap = Bootstrap::new(\u0026project_path);\n\n            let stack = if let Some(stack_str) = stack {\n                match stack_str.to_lowercase().as_str() {\n                    \"rails\" =\u003e Stack::Rails,\n                    \"nodejs\" =\u003e Stack::NodeJs,\n                    \"rust\" =\u003e Stack::Rust,\n OX_SKIP_HOST_VALIDATION\", \"1\")\n        .args([\"feature\", \"list\"])\n        .assert()\n        .success()\n        .stdout(predicate::str::contains(work_feature));\n\n    // Teardown feature\n    Command::cargo_bin(\"branchbox\")\n        .expect(\"binary exists\")\n        .current_dir(repo_path)\n        .env(\"BRANCHBOX_SKIP_HOST_VALIDATION\", \"1\")\n        .args([\n            \"feature\",\n            \"teardown\",\n            \"--name\",\n            work_feature,\n            \"--delete-branch\",\n            \"--force\",\n            \"--complete-spec\",\n        ])\n        .assert()\n        .success()\n        .stdout(predicate::str::contains(\"Feature teardown finished\"));\n\n    assert!(\n        !worktree_path.exists(),\n        \"expected worktree directory to be removed after teardown\"\n    );\n\n    // Listing after teardown still reports historical entry as removed\n    Command::cargo_bin(\"branchbox\")\n        .expect(\"binary exists\")\n        .current_dir(repo_path)\n        .env(\"BRANCHBOX_SKIP_HOST_VALIDATION\", \"1\")\n        .args([\"feature\", \"list\", \"--status\", \"removed\"])\n        .assert()\n        .success()\n        .stdout(predicate::str::contains(work_feature));\n\n    let completed_spec = repo_path\n        .join(\"docs\")\n        .join(\"features\")\n        .join(\"completed\")\n        .join(format!(\"{work_feature}.md\"));\n    assert!(\n        completed_spec.exists(),\n        \"expected spec to move to completed\"\n    );\n}\n","traces":[{"line":8,"address":[],"length":0,"stats":{"Line":5}},{"line":9,"address":[],"length":0,"stats":{"Line":20}},{"line":10,"address":[],"length":0,"stats":{"Line":10}},{"line":11,"address":[],"length":0,"stats":{"Line":5}},{"line":13,"address":[],"length":0,"stats":{"Line":5}},{"line":14,"address":[],"length":0,"stats":{"Line":5}},{"line":15,"address":[],"length":0,"stats":{"Line":10}},{"line":16,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"address":[],"length" g::info!(\"Copied {}\", file);\n                copied = true;\n            }\n        }\n\n        if !copied {\n            tracing::info!(\"No secret files found to copy\");\n        }\n\n        Ok(())\n    }\n\n    fn cleanup(\u0026self, worktree_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        // Clean up common temporary files and directories\n        let paths_to_clean = vec![\".cache\", \"tmp\", \"temp\", \".tmp\"];\n\n        for path in paths_to_clean {\n            let full_path = worktree_dir.join(path);\n            if full_path.exists() \u0026\u0026 full_path.is_dir() {\n                let _ = fs::remove_dir_all(\u0026full_path);\n                tracing::debug!(\"Cleaned up {}\", path);\n            }\n        }\n\n        tracing::info!(\"Cleaned up temporary files\");\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_always_detects() {\n        let temp_dir = TempDir::new().unwrap();\n\n        let adapter = GenericAdapter;\n        assert_eq!(adapter.detect(temp_dir.path()), 10);\n    }\n\n    #[test]\n    fn test_service_url() {\n        let adapter = GenericAdapter;\n        assert_eq!(adapter.service_url(), \"http://dev:3000\");\n    }\n}\n","traces":[{"line":12,"address":[],"length":0,"stats":{"Line":9}},{"line":13,"address":[],"length":0,"stats":{"Line":9}},{"line":16,"address":[],"length":0,"stats":{"Line":19}},{"line":19,"address":[],"length":0,"stats":{"Line":19}},{"line":22,"address":[],"length":0,"stats":{"Line":9}},{"line":23,"address":[],"length":0,"stats":{"Line":18}},{"line":26,"address":[],"length":0,"stats":{"Line":6}},{"line":28,"address":[],"length":0,"stats":{"Line":30}},{"line":30,"address":[],"length":0,"stats":{"Line":12}},{"line":32,"address":[],"length":0,"stats":{"Line":54}},{"line":33,"address":[],"length":0,"stats":{"Line":96}},{"line":34,"address":[],"length":0,"stats":{"Line":30}},{"line":35,"address":[],"length":0,"stats":{"Line": eck(\u0026self, _worktree_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        // Default: always healthy\n        Ok(())\n    }\n\n    /// Cleanup temporary files\n    fn cleanup(\u0026self, _worktree_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        // Default: no cleanup\n        Ok(())\n    }\n}\n\n/// Detect and load the best adapter for a project\n///\n/// Tries all adapters and returns the one with highest confidence.\n/// Generic adapter always matches with confidence 10, so this never fails.\n///\n/// # Example\n///\n/// ```no_run\n/// use worktree_core::adapters::detect_adapter;\n/// use std::path::Path;\n///\n/// let project = Path::new(\"/path/to/project\");\n/// let adapter = detect_adapter(project).unwrap();\n/// println!(\"Detected stack: {}\", adapter.name());\n/// ```\npub fn detect_adapter(project_dir: \u0026Path) -\u003e Result\u003cBox\u003cdyn Adapter\u003e\u003e {\n    let adapters: Vec\u003cBox\u003cdyn Adapter\u003e\u003e = vec![\n        Box::new(rails::RailsAdapter),\n        Box::new(nodejs::NodeJsAdapter),\n        Box::new(generic::GenericAdapter),\n    ];\n\n    let mut best_adapter: Option\u003cBox\u003cdyn Adapter\u003e\u003e = None;\n    let mut best_confidence = 0;\n\n    for adapter in adapters {\n        let confidence = adapter.detect(project_dir);\n\n        if confidence \u003e best_confidence {\n            best_confidence = confidence;\n            best_adapter = Some(adapter);\n        }\n    }\n\n    // Generic adapter always has confidence 10, so we should always have a match\n    best_adapter.ok_or(Error::AdapterNotFound)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use std::io::Write;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_detect_rails_adapter() {\n        let temp_dir = TempDir::new().unwrap();\n        let mut gemfile = fs::File::create(temp_dir.path().join(\"Gemfile\")).unwrap();\n        writeln!(gemfile, \"gem \\\"rails\\\"\").unwrap();\n\n        let adapter "content":"//! Rails stack adapter\n\nuse super::Adapter;\nuse crate::Result;\nuse std::fs;\nuse std::path::Path;\n\n/// Rails stack adapter\npub struct RailsAdapter;\n\nimpl Adapter for RailsAdapter {\n    fn name(\u0026self) -\u003e \u0026str {\n        \"Rails\"\n    }\n\n    fn detect(\u0026self, project_dir: \u0026Path) -\u003e u8 {\n        let gemfile = project_dir.join(\"Gemfile\");\n\n        if !gemfile.exists() {\n            return 0;\n        }\n\n        // Read Gemfile and look for 'gem \"rails\"' or \"gem 'rails'\"\n        if let Ok(content) = fs::read_to_string(\u0026gemfile) {\n            if content.contains(\"gem \\\"rails\\\"\") || content.contains(\"gem 'rails'\") {\n                return 95;\n            }\n        }\n\n        0\n    }\n\n    fn service_url(\u0026self) -\u003e String {\n        \"http://rails-app:3000\".to_string()\n    }\n\n    fn copy_secrets(\u0026self, src: \u0026Path, dest: \u0026Path) -\u003e Result\u003c()\u003e {\n        let mut copied = false;\n\n        // Copy config/master.key\n        let master_key_src = src.join(\"config/master.key\");\n        if master_key_src.exists() {\n            let master_key_dest = dest.join(\"config/master.key\");\n            fs::create_dir_all(master_key_dest.parent().unwrap())?;\n            fs::copy(\u0026master_key_src, \u0026master_key_dest)?;\n            tracing::info!(\"Copied config/master.key\");\n            copied = true;\n        }\n\n        // Copy config/credentials/*.key\n        let credentials_dir = src.join(\"config/credentials\");\n        if credentials_dir.exists() \u0026\u0026 credentials_dir.is_dir() {\n            let dest_credentials_dir = dest.join(\"config/credentials\");\n            fs::create_dir_all(\u0026dest_credentials_dir)?;\n\n            for entry in fs::read_dir(\u0026credentials_dir)? {\n                let entry = entry?;\n                let path = entry.path();\n\n                if path.extension().and_then(|s| s.to_str()) == Some(\"key\") {\n                    let filename = path.file_name().unwrap();\n                    let dest_path = dest_credentials_dir.join(filename);\n                    fs::copy(\u0026path, \u0026dest_path)?;\n                    tracing::info!(\"Copied {:?}\", filename);\n                    copied = true;\n                }\n            }\n        }\n\n        if !copied {\n            tracing::info!(\"No Rails secret files found to copy\");\n        }\n\n        Ok(())\n    }\n\n    fn cleanup(\u0026self, worktree_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        // Remove Rails temporary files\n        let tmp_dir = worktree_dir.join(\"tmp\");\n\n        if tmp_dir.exists() {\n            for subdir in \u0026[\"cache\", \"pids\", \"sockets\"] {\n                let path = tmp_dir.join(subdir);\n                if path.exists() {\n                    let _ = fs::remove_dir_all(\u0026path);\n                }\n            }\n            tracing::info!(\"Cleaned up Rails tmp/ directory\");\n        }\n\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::io::Write;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_detect_rails() {\n        let temp_dir = TempDir::new().unwrap();\n        let mut gemfile = fs::File::create(temp_dir.path().join(\"Gemfile\")).unwrap();\n        writeln!(gemfile, \"gem \\\"rails\\\"\").unwrap();\n\n        let adapter = RailsAdapter;\n        assert_eq!(adapter.detect(temp_dir.path()), 95);\n    }\n\n    #[test]\n    fn test_detect_not_rails() {\n        let temp_dir = TempDir::new().unwrap();\n\n        let adapter = RailsAdapter;\n        assert_eq!(adapter.detect(temp_dir.path()), 0);\n    }\n}\n","traces":[{"line":12,"address":[],"length":0,"stats":{"Line":2}},{"line":13,"address":[],"length":0,"stats":{"Line":2}},{"line":16,"address":[],"length":0,"stats":{"Line":20}},{"line":17,"address":[],"length":0,"stats":{"Line":60}},{"line":19,"address":[],"length":0,"stats":{"Line":20}},{"line":20 th":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":88,"address":[],"length":0,"stats":{"Line":0}},{"line":91,"address":[],"length":0,"stats":{"Line":0}}],"covered":9,"coverable":46},{"path":["/","workspaces","main","core","src","bootstrap","mod.rs"],"content":"//! Bootstrap system for generating devcontainer configurations\n//!\n//! This module implements the \"meta\" feature - a tool that can set up development\n//! environments for any project, including itself.\n//!\n//! # Concept\n//!\n//! The branchbox can bootstrap complete devcontainer setups for:\n//! - Rails projects\n//! - Node.js projects\n//! - Rust projects (including itself!)\n//! - Generic projects\n//!\n//! # Usage\n//!\n//! ```no_run\n//! use worktree_core::bootstrap::{Bootstrap, Stack};\n//! use std::path::Path;\n//!\n//! let project_path = Path::new(\"/path/to/project\");\n//! let bootstrap = Bootstrap::new(project_path);\n//!\n//! // Auto-detect stack\n//! let stack = bootstrap.detect_stack().unwrap();\n//!\n//! // Generate devcontainer configuration\n//! bootstrap.generate(stack).unwrap();\n//! ```\n//!\n//! # What It Generates\n//!\n//! - `.devcontainer/devcontainer.json` - VS Code/Cursor configuration\n//! - `.devcontainer/compose.yaml` - Docker Compose services\n//! - `.devcontainer/Dockerfile` - Custom development image\n//! - `.env.sample` - Environment variable template\n//! - Stack-specific scripts and configurations\n\nuse crate::Result;\nuse std::path::PathBuf;\n\npub mod templates;\n\n/// Supported stack types\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Stack {\n    /// Ruby on Rails\n    Rails,\n    /// Node.js / JavaScript\n    NodeJs,\n    /// Rust\n    Rust,\n    /// Generic/Unknown\n    Generic,\n}\n\nimpl Stack {\n    /// Get stack name as string\n    pub fn as_str(\u0026self) -\u003e \u0026'static str {\n        match self {\n            Stack::Rails =\u003e \"rails\",\n            Stack::NodeJs =\u003e \"nodejs\",\n            Stack::Rust =\u003e \"rust\",\n            Stack::Generic =\u003e \"generic\",\n        }\n    }\n}\n\n/// Bootstrap configuration builder\npub struct Bootstrap {\n    project_path: PathBuf,\n}\n\nimpl Bootstrap {\n    /// Create a new Bootstrap instance\n    pub fn new(project_path: impl Into\u003cPathBuf\u003e) -\u003e Self {\n        Self {\n            project_path: project_path.into(),\n        }\n    }\n\n    /// Auto-detect project stack\n    ///\n    /// Uses the adapter system to detect the project type.\n    pub fn detect_stack(\u0026self) -\u003e Result\u003cStack\u003e {\n        // Check for Rust project\n        if self.project_path.join(\"Cargo.toml\").exists() {\n            return Ok(Stack::Rust);\n        }\n\n        // Check for Rails project\n        if self.project_path.join(\"Gemfile\").exists() {\n            if let Ok(content) = std::fs::read_to_string(self.project_path.join(\"Gemfile\")) {\n                if content.contains(\"gem \\\"rails\\\"\") || content.contains(\"gem 'rails'\") {\n                    return Ok(Stack::Rails);\n                }\n            }\n        }\n\n        // Check for Node.js project\n        if self.project_path.join(\"package.json\").exists() {\n            return Ok(Stack::NodeJs);\n        }\n\n        // Fallback to generic\n        Ok(Stack::Generic)\n    }\n\n    /// Generate devcontainer configuration\n    ///\n    /// Creates all necessary files for a complete devcontainer setup.\n    ///\n    /// # Example\n    ///\n    /// ```no_run\n    /// use worktree_core::bootstrap::{Bootstrap, Stack};\n    /// use std::path::Path;\n    ///\n    /// let project = Path::new(\"/path/to/rust-project\");\n    /// let bootstrap = Bootstrap::new(project);\n    /// bootstrap.generate(Stack::Rust).unwrap();\n    /// ```\n    pub fn generate(\u0026self, stack: Stack) -\u003e Result\u003c()\u003e {\n        use std::fs;\n\n        tracing::info!(\"Generating devcontainer for {} stack\", stack.as_str());\n\n        // Create .devcontainer directory\n        let devcontainer_dir = self.project_path.join(\".devcontainer\");\n        fs::create_dir_all(\u0026devcontainer_dir)?;\n        tracing::debug!(\"Created directory: {}\", devcontainer_dir.display());\n\n        // Generate and write devcontainer.json\n        let devcontainer_json = self.generate_devcontainer_json(stack)?;\n        let devcontainer_json_path = devcontainer_dir.join(\"devcontainer.json\");\n        fs::write(\u0026devcontainer_json_path, devcontainer_json)?;\n        tracing::info!(\"Created: {}\", devcontainer_json_path.display());\n\n        // Generate and write compose.yaml\n        let compose_yaml = self.generate_compose_yaml(stack)?;\n        let compose_yaml_path = devcontainer_dir.join(\"compose.yaml\");\n        fs::write(\u0026compose_yaml_path, compose_yaml)?;\n        tracing::info!(\"Created: {}\", compose_yaml_path.display());\n\n        // Generate and write Dockerfile\n        let dockerfile = self.generate_dockerfile(stack)?;\n        let dockerfile_path = devcontainer_dir.join(\"Dockerfile\");\n        fs::write(\u0026dockerfile_path, dockerfile)?;\n        tracing::info!(\"Created: {}\", dockerfile_path.display());\n\n        // Generate and write .env.sample (in project root, not .devcontainer)\n        let env_sample = self.generate_env_sample(stack)?;\n        let env_sample_path = self.project_path.join(\".env.sample\");\n\n        // Only create if it doesn't exist (don't overwrite)\n        if !env_sample_path.exists() {\n            fs::write(\u0026env_sample_path, env_sample)?;\n            tracing::info!(\"Created: {}\", env_sample_path.display());\n        } else {\n            tracing::info!(\"Skipped (already exists): {}\", env_sample_path.display());\n        }\n\n        tracing::info!(\"✓ Bootstrap complete for {} stack\", stack.as_str());\n        tracing::info!(\"  Next steps:\");\n        tracing::info!(\"  1. Open project in VS Code/Cursor\");\n        tracing::info!(\"  2. Reopen in Container\");\n        tracing::info!(\"  3. Start developing!\");\n\n        Ok(())\n    }\n\n    /// Generate devcontainer.json\n    fn generate_devcontainer_json(\u0026self, stack: Stack) -\u003e Result\u003cString\u003e {\n        templates::devcontainer_json(stack)\n    }\n\n    /// Generate compose.yaml\n    fn generate_compose_yaml(\u0026self, stack: Stack) -\u003e Result\u003cString\u003e {\n        templates::compose_yaml(stack)\n    }\n\n    /// Generate Dockerfile\n    fn generate_dockerfile(\u0026self, stack: Stack) -\u003e Result\u003cString\u003e {\n        templates::dockerfile(stack)\n    }\n\n    /// Generate .env.sample\n    fn generate_env_sample(\u0026self, stack: Stack) -\u003e Result\u003cString\u003e {\n        templates::env_sample(stack)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use std::io::Write;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_detect_rust_stack() {\n        let temp_dir = TempDir::new().unwrap();\n        let mut cargo_toml = fs::File::create(temp_dir.path().join(\"Cargo.toml\")).unwrap();\n        writeln!(cargo_toml, \"[package]\\nname = \\\"test\\\"\").unwrap();\n\n        let bootstrap = Bootstrap::new(temp_dir.path());\n        assert_eq!(bootstrap.detect_stack().unwrap(), Stack::Rust);\n    }\n\n    #[test]\n    fn test_detect_rails_stack() {\n        let temp_dir = TempDir::new().unwrap();\n        let mut gemfile = fs::File::create(temp_dir.path().join(\"Gemfile\")).unwrap();\n        writeln!(gemfile, \"gem \\\"rails\\\"\").unwrap();\n\n        let bootstrap = Bootstrap::new(temp_dir.path());\n        assert_eq!(bootstrap.detect_stack().unwrap(), Stack::Rails);\n    }\n\n    #[test]\n    fn test_detect_nodejs_stack() {\n        let temp_dir = TempDir::new().unwrap();\n        let mut package_json = fs::File::create(temp_dir.path().join(\"package.json\")).unwrap();\n        writeln!(package_json, \"{{}}\").unwrap();\n\n        let bootstrap = Bootstrap::new(temp_dir.path());\n        assert_eq!(bootstrap.detect_stack().unwrap(), Stack::NodeJs);\n    }\n\n    #[test]\n    fn test_detect_generic_stack() {\n        let temp_dir = TempDir::new().unwrap();\n\n        let bootstrap = Bootstrap::new(temp_dir.path());\n        assert_eq!(bootstrap.detect_stack().unwrap(), Stack::Generic);\n    }\n\n    #[test]\n    fn test_generate_creates_files() {\n        let temp_dir = TempDir::new().unwrap();\n\n        let bootstrap = Bootstrap::new(temp_dir.path());\n        bootstrap.generate(Stack::Rust).unwrap();\n\n        // Check that all files were created\n        assert!(temp_dir\n            .path()\n            .join(\".devcontainer/devcontainer.json\")\n            .exists());\n        assert!(temp_dir.path().join(\".devcontainer/compose.yaml\").exists());\n        assert!(temp_dir.path().join(\".devcontainer/Dockerfile\").exists());\n        assert!(temp_dir.path().join(\".env.sample\").exists());\n\n        // Check that files have content\n        let devcontainer_json =\n            fs::read_to_string(temp_dir.path().join(\".devcontainer/devcontainer.json\")).unwrap();\n        assert!(devcontainer_json.contains(\"Rust\"));\n\n        let compose_yaml =\n            fs::read_to_string(temp_dir.path().join(\".devcontainer/compose.yaml\")).unwrap();\n        assert!(compose_yaml.contains(\"rust-dev\"));\n\n        let dockerfile =\n            fs::read_to_string(temp_dir.path().join(\".devcontainer/Dockerfile\")).unwrap();\n        assert!(dockerfile.contains(\"rust\"));\n    }\n\n    #[test]\n    fn test_generate_doesnt_overwrite_env_sample() {\n        let temp_dir = TempDir::new().unwrap();\n\n        // Create existing .env.sample\n        let existing_content = \"EXISTING=value\\n\";\n        fs::write(temp_dir.path().join(\".env.sample\"), existing_content).unwrap();\n\n        let bootstrap = Bootstrap::new(temp_dir.path());\n        bootstrap.generate(Stack::Rust).unwrap();\n\n        // Check that .env.sample wasn't overwritten\n        let content = fs::read_to_string(temp_dir.path().join(\".env.sample\")).unwrap();\n        assert_eq!(content, existing_content);\n    }\n\n    #[test]\n    fn test_generate_all_stacks() {\n        for stack in [Stack::Rust, Stack::Rails, Stack::NodeJs, Stack::Generic] {\n            let temp_dir = TempDir::new().unwrap();\n            let bootstrap = Bootstrap::new(temp_dir.path());\n\n            bootstrap.generate(stack).unwrap();\n\n            // Verify all files created\n            assert!(\n                temp_dir\n                    .path()\n                    .join(\".devcontainer/devcontainer.json\")\n                    .exists(),\n                \"{} stack should create devcontainer.json\",\n                stack.as_str()\n            );\n            assert!(\n                temp_dir.path().join(\".devcontainer/compose.yaml\").exists(),\n                \"{} stack should create compose.yaml\",\n                stack.as_str()\n            );\n            assert!(\n                temp_dir.path().join(\".devcontainer/Dockerfile\").exists(),\n                \"{} stack should create Dockerfile\",\n                stack.as_str()\n            );\n        }\n    }\n}\n","traces":[{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":62,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":10}},{"line":77,"address":[],"length":0,"stats":{"Line":10}},{"line":84,"address":[],"length":0,"stats":{"Line":4}},{"line":86,"address":[],"length":0,"stats":{"Line":4}},{"line":87,"address":[],"length":0,"stats":{"Line":1}},{"line":91,"address":[],"length":0,"stats":{"Line":3}},{"line":92,"address":[],"length":0,"stats":{"Line s =\u003e include_str!(\"templates/nodejs/Dockerfile\"),\n        Stack::Generic =\u003e include_str!(\"templates/generic/Dockerfile\"),\n    };\n\n    Ok(template.to_string())\n}\n\n/// Generate .env.sample template\npub fn env_sample(stack: Stack) -\u003e Result\u003cString\u003e {\n    let template = match stack {\n        Stack::Rust =\u003e include_str!(\"templates/rust/env.sample\"),\n        Stack::Rails =\u003e include_str!(\"templates/rails/env.sample\"),\n        Stack::NodeJs =\u003e include_str!(\"templates/nodejs/env.sample\"),\n        Stack::Generic =\u003e include_str!(\"templates/generic/env.sample\"),\n    };\n\n    Ok(template.to_string())\n}\n","traces":[{"line":9,"address":[],"length":0,"stats":{"Line":6}},{"line":10,"address":[],"length":0,"stats":{"Line":12}},{"line":11,"address":[],"length":0,"stats":{"Line":3}},{"line":12,"address":[],"length":0,"stats":{"Line":1}},{"line":13,"address":[],"length":0,"stats":{"Line":1}},{"line":14,"address":[],"length":0,"stats":{"Line":1}},{"line":17,"address":[],"length":0,"stats":{"Line":6}},{"line":21,"address":[],"length":0,"stats":{"Line":6}},{"line":22,"address":[],"length":0,"stats":{"Line":12}},{"line":23,"address":[],"length":0,"stats":{"Line":3}},{"line":24,"address":[],"length":0,"stats":{"Line":1}},{"line":25,"address":[],"length":0,"stats":{"Line":1}},{"line":26,"address":[],"length":0,"stats":{"Line":1}},{"line":29,"address":[],"length":0,"stats":{"Line":6}},{"line":33,"address":[],"length":0,"stats":{"Line":6}},{"line":34,"address":[],"length":0,"stats":{"Line":12}},{"line":35,"address":[],"length":0,"stats":{"Line":3}},{"line":36,"address":[],"length":0,"stats":{"Line":1}},{"line":37,"address":[],"length":0,"stats":{"Line":1}},{"line":38,"address":[],"length":0,"stats":{"Line":1}},{"line":41,"address":[],"length":0,"stats":{"Line":6}},{"line":45,"address":[],"length":0,"stats":{"Line":6}},{"line":46,"address":[],"length":0,"stats":{"Line":12}},{"line":47,"address":[],"length":0,"stats":{"Line :from_static(\"application/json\"));\n        headers.insert(USER_AGENT, HeaderValue::from_static(USER_AGENT_VALUE));\n\n        let http = Client::builder()\n            .default_headers(headers)\n            .build()\n            .map_err(|err| Error::other(format!(\"Failed to build Cloudflare client: {}\", err)))?;\n\n        Ok(Self { http, account_id })\n    }\n\n    /// Attempt to find an active tunnel by name.\n    pub fn find_tunnel_by_name(\u0026self, name: \u0026str) -\u003e Result\u003cOption\u003cTunnelSummary\u003e\u003e {\n        let url = format!(\"{API_BASE}/accounts/{}/cfd_tunnel\", self.account_id);\n        let resp: ApiListResponse\u003cTunnelSummaryInternal\u003e =\n            self.http.get(url).query(\u0026[(\"name\", name)]).send()?.json()?;\n\n        let tunnels = resp.into_result()?;\n        Ok(tunnels\n            .into_iter()\n            .find(|tunnel| tunnel.deleted_at.is_none())\n            .map(TunnelSummary::from))\n    }\n\n    /// Provision a new tunnel and return its id + token.\n    pub fn create_tunnel(\u0026self, name: \u0026str) -\u003e Result\u003cTunnelProvision\u003e {\n        let url = format!(\"{API_BASE}/accounts/{}/cfd_tunnel\", self.account_id);\n        let resp: ApiResponse\u003cTunnelCreate\u003e = self\n            .http\n            .post(url)\n            .json(\u0026json!({\n                \"name\": name,\n                \"config_src\": \"cloudflare\"\n            }))\n            .send()?\n            .json()?;\n\n        let result = resp.into_result()?;\n        let token = result\n            .token\n            .ok_or_else(|| Error::validation(\"Cloudflare API response missing tunnel token\"))?;\n\n        Ok(TunnelProvision {\n            id: result.id,\n            name: result.name,\n            token,\n        })\n    }\n\n    /// Configure the tunnel ingress routing.\n    pub fn configure_tunnel(\n        \u0026self,\n        tunnel_id: \u0026str,\n        hostname: \u0026str,\n        service_url: \u0026str,\n    ) -\u003e Result\u003c()\u003e {\n        let url = format!(\n            \"{API_BASE}/accounts/{}/cfd_tunnel/{}/configurations\",\n            self.account_id, tunnel_id\n        );\n\n        let payload = json!({\n            \"config\": {\n                \"ingress\": [\n                    {\n                        \"hostname\": hostname,\n                        \"service\": service_url\n                    },\n                    {\n                        \"service\": \"http_status:404\"\n                    }\n                ]\n            }\n        });\n\n        let resp: ApiResponse\u003cserde_json::Value\u003e =\n            self.http.put(url).json(\u0026payload).send()?.json()?;\n        resp.into_result().map(|_| ())\n    }\n\n    /// Ensure a proxied CNAME exists pointing the hostname to the tunnel id.\n    pub fn ensure_cname_record(\n        \u0026self,\n        hostname: \u0026str,\n        base_domain: \u0026str,\n        tunnel_id: \u0026str,\n    ) -\u003e Result\u003c()\u003e {\n        if let Some(zone_id) = self.lookup_zone_id(base_domain)? {\n            let target = format!(\"{tunnel_id}.cfargotunnel.com\");\n            if let Some(existing) = self.get_dns_record(\u0026zone_id, hostname)? {\n                if existing.content == target {\n                    return Ok(());\n                }\n\n                self.update_dns_record(\u0026zone_id, \u0026existing.id, hostname, \u0026target)?;\n            } else {\n                self.create_dns_record(\u0026zone_id, hostname, \u0026target)?;\n            }\n        } else {\n            return Err(Error::validation(format!(\n                \"Cloudflare zone not found for {}\",\n                base_domain\n            )));\n        }\n\n        Ok(())\n    }\n\n    /// Delete a tunnel by id.\n    pub fn delete_tunnel(\u0026self, tunnel_id: \u0026str) -\u003e Result\u003c()\u003e {\n        let url = format!(\n            \"{API_BASE}/accounts/{}/cfd_tunnel/{}\",\n            self.account_id, tunnel_id\n        );\n        let resp: ApiResponse\u003cserde_json::Value\u003e = self.http.delete(url).send()?.json()?;\n        resp.into_result().map(|_| ())\n    }\n\n    /// Delete DNS records matching the hostname. Returns true if a record was deleted.\n    pub fn delete_dns_record(\u0026self, hostname: \u0026str, base_domain: \u0026str) -\u003e Result\u003cbool\u003e {\n        let Some(zone_id) = self.lookup_zone_id(base_domain)? else {\n            return Ok(false);\n        };\n\n        let records = self.get_dns_records(\u0026zone_id, hostname)?;\n        let mut deleted = false;\n\n        for record in records {\n            let url = format!(\"{API_BASE}/zones/{}/dns_records/{}\", zone_id, record.id);\n            let resp: ApiResponse\u003cserde_json::Value\u003e = self.http.delete(url).send()?.json()?;\n            resp.into_result()?;\n            deleted = true;\n        }\n\n        Ok(deleted)\n    }\n\n    fn lookup_zone_id(\u0026self, base_domain: \u0026str) -\u003e Result\u003cOption\u003cString\u003e\u003e {\n        let url = format!(\"{API_BASE}/zones\");\n        let resp: ApiListResponse\u003cZoneResult\u003e = self\n            .http\n            .get(url)\n            .query(\u0026[(\"name\", base_domain)])\n            .send()?\n            .json()?;\n\n        let zones = resp.into_result()?;\n        Ok(zones.into_iter().next().map(|zone| zone.id))\n    }\n\n    fn get_dns_records(\u0026self, zone_id: \u0026str, hostname: \u0026str) -\u003e Result\u003cVec\u003cDnsRecord\u003e\u003e {\n        let url = format!(\"{API_BASE}/zones/{}/dns_records\", zone_id);\n        let resp: ApiListResponse\u003cDnsRecord\u003e = self\n            .http\n            .get(url)\n            .query(\u0026[(\"name\", hostname)])\n            .send()?\n            .json()?;\n\n        resp.into_result()\n    }\n\n    fn get_dns_record(\u0026self, zone_id: \u0026str, hostname: \u0026str) -\u003e Result\u003cOption\u003cDnsRecord\u003e\u003e {\n        let mut records = self.get_dns_records(zone_id, hostname)?;\n        Ok(records.pop())\n    }\n\n    fn create_dns_record(\u0026self, zone_id: \u0026str, hostname: \u0026str, target: \u0026str) -\u003e Result\u003c()\u003e {\n        let url = format!(\"{API_BASE}/zones/{}/dns_records\", zone_id);\n        let payload = json!({\n            \"type\": \"CNAME\",\n            \"name\": hostname,\n            \"content\": target,\n            \"proxied\": true\n        });\n\n        let resp: ApiResponse\u003cDnsRecord\u003e = self.http.post(url).json(\u0026payload).send()?.json()?;\n        resp.into_result().map(|_| ())\n    }\n\n    fn update_dns_record(\n        \u0026self,\n        zone_id: \u0026str,\n        record_id: \u0026str,\n        hostname: \u0026str,\n        target: \u0026str,\n    ) -\u003e Result\u003c()\u003e {\n        let url = format!(\"{API_BASE}/zones/{}/dns_records/{}\", zone_id, record_id);\n        let payload = json!({\n            \"type\": \"CNAME\",\n            \"name\": hostname,\n            \"content\": target,\n            \"proxied\": true\n        });\n\n        let resp: ApiResponse\u003cDnsRecord\u003e = self.http.put(url).json(\u0026payload).send()?.json()?;\n        resp.into_result().map(|_| ())\n    }\n}\n\n/// Provisioned tunnel information.\n#[derive(Debug, Clone)]\npub struct TunnelProvision {\n    pub id: String,\n    pub name: String,\n    pub token: String,\n}\n\n/// Lightweight tunnel summary.\n#[derive(Debug, Clone)]\npub struct TunnelSummary {\n    pub id: String,\n    pub name: String,\n}\n\nimpl From\u003cTunnelSummaryInternal\u003e for TunnelSummary {\n    fn from(value: TunnelSummaryInternal) -\u003e Self {\n        Self {\n            id: value.id,\n            name: value.name,\n        }\n    }\n}\n\n#[derive(Debug, Deserialize)]\nstruct ApiResponse\u003cT\u003e {\n    success: bool,\n    errors: Vec\u003cApiError\u003e,\n    #[serde(bound(deserialize = \"T: DeserializeOwned\"))]\n    result: T,\n}\n\n#[derive(Debug, Deserialize)]\nstruct ApiListResponse\u003cT\u003e {\n    success: bool,\n    errors: Vec\u003cApiError\u003e,\n    #[serde(bound(deserialize = \"T: DeserializeOwned\"))]\n    result: Vec\u003cT\u003e,\n}\n\nimpl\u003cT\u003e ApiResponse\u003cT\u003e {\n    fn into_result(self) -\u003e Result\u003cT\u003e {\n        if self.success {\n            Ok(self.result)\n        } else {\n            Err(Error::validation(format_api_errors(self.errors)))\n        }\n    }\n}\n\nimpl\u003cT\u003e ApiListResponse\u003cT\u003e {\n    fn into_result(self) -\u003e Result\u003cVec\u003cT\u003e\u003e {\n        if self.success {\n            Ok(self.result)\n        } else {\n            Err(Error::validation(format_api_errors(self.errors)))\n        }\n    }\n}\n\n#[derive(Debug, Deserialize)]\nstruct ApiError {\n    #[serde(default)]\n    code: Option\u003ci64\u003e,\n    message: String,\n}\n\n#[derive(Debug, Deserialize)]\nstruct TunnelSummaryInternal {\n    id: String,\n    name: String,\n    #[serde(default)]\n    deleted_at: Option\u003cString\u003e,\n}\n\n#[derive(Debug, Deserialize)]\nstruct TunnelCreate {\n    id: String,\n    name: String,\n    #[serde(default)]\n    token: Option\u003cString\u003e,\n}\n\n#[derive(Debug, Deserialize)]\nstruct ZoneResult {\n    id: String,\n}\n\n#[derive(Debug, Deserialize, Clone)]\nstruct DnsRecord {\n    id: String,\n    content: String,\n}\n\nfn format_api_errors(errors: Vec\u003cApiError\u003e) -\u003e String {\n    if errors.is_empty() {\n        \"Cloudflare API error (unknown)\".to_string()\n    } else {\n        errors\n            .into_iter()\n            .map(|error| match error.code {\n                Some(code) =\u003e format!(\"[{}] {}\", code, error.message),\n                None =\u003e error.message,\n            })\n            .collect::\u003cVec\u003c_\u003e\u003e()\n            .join(\"; \")\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn forma "/","workspaces","main","core","src","git.rs"],"content":"//! Git worktree operations\n//!\n//! Provides functionality for creating, managing, and removing git worktrees.\n\nuse crate::{Error, Result};\nuse std::path::{Path, PathBuf};\nuse std::process::Command;\n\n/// Git worktree manager\n#[derive(Debug)]\npub struct GitWorktree {\n    repo_path: PathBuf,\n}\n\nimpl GitWorktree {\n    /// Create a new GitWorktree instance\n    pub fn new(repo_path: impl Into\u003cPathBuf\u003e) -\u003e Result\u003cSelf\u003e {\n        let repo_path = repo_path.into();\n\n        if !repo_path.exists() {\n            return Err(Error::validation(format!(\n                \"Repository path does not exist: {}\",\n                repo_path.display()\n            )));\n        }\n\n        // Verify it's a git repository\n        let git_dir = repo_path.join(\".git\");\n        if !git_dir.exists() {\n            return Err(Error::validation(format!(\n                \"Not a git repository: {}\",\n                repo_path.display()\n            )));\n        }\n\n        Ok(Self { repo_path })\n    }\n\n    /// Create a new worktree\n    ///\n    /// # Arguments\n    ///\n    /// * `path` - Path where the worktree should be created\n    /// * `branch` - Branch name for the worktree\n    /// * `base_branch` - Optional base branch to fork from (defaults to current branch)\n    ///\n    /// # Example\n    ///\n    /// ```no_run\n    /// use worktree_core::git::GitWorktree;\n    /// use std::path::Path;\n    ///\n    /// let git = GitWorktree::new(\"/path/to/repo\").unwrap();\n    /// git.create(\n    ///     Path::new(\"/path/to/worktree\"),\n    ///     \"feature/new-feature\",\n    ///     Some(\"main\")\n    /// ).unwrap();\n    /// ```\n    pub fn create(\u0026self, path: \u0026Path, branch: \u0026str, base_branch: Option\u003c\u0026str\u003e) -\u003e Result\u003c()\u003e {\n        if path.exists() {\n            return Err(Error::WorktreeExists(path.to_path_buf()));\n        }\n\n        let mut cmd = Command::new(\"git\");\n        cmd.current_dir(\u0026self.repo_path);\n        cmd.arg(\"worktree\").arg(\"add\");\n\n        // Add -B flag to create/reset branch\n        cmd.arg(\"-B\").arg(branch);\n\n        // Add worktree path\n        cmd.arg(path);\n\n        // Add base branch if specified\n        if let Some(base) = base_branch {\n            cmd.arg(base);\n        }\n\n        tracing::debug!(\"Running: {:?}\", cmd);\n\n        let output = cmd\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to execute git worktree add: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            return Err(Error::git(format!(\"Git worktree add failed: {}\", stderr)));\n        }\n\n        tracing::info!(\"Created worktree at {}\", path.display());\n        Ok(())\n    }\n\n    /// Attach an existing branch to a worktree path without resetting it.\n    pub fn attach_existing_branch(\u0026self, path: \u0026Path, branch: \u0026str) -\u003e Result\u003c()\u003e {\n        if path.exists() {\n            return Err(Error::WorktreeExists(path.to_path_buf()));\n        }\n\n        // Ensure any stale worktree registrations are removed before attempting to attach.\n        if let Err(err) = self.prune() {\n            tracing::debug!(\"Skipping worktree prune before attach: {}\", err);\n        }\n\n        let mut cmd = Command::new(\"git\");\n        cmd.current_dir(\u0026self.repo_path);\n        cmd.arg(\"worktree\").arg(\"add\");\n        cmd.arg(path);\n        cmd.arg(branch);\n\n        tracing::debug!(\"Running: {:?}\", cmd);\n\n        let output = cmd\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to execute git worktree add: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            return Err(Error::git(format!(\"Git worktree add failed: {}\", stderr)));\n        }\n\n        tracing::info!(\n            \"Attached existing branch '{}' at {}\",\n            branch,\n            path.display()\n        );\n        Ok(())\n    }\n\n    /// Remove a worktree\n    ///\n    /// # Arguments\n    ///\n    /// * `path` - Path to the worktree to remove\n    /// * `force` - Force removal even if worktree has uncommitted changes\n    pub fn remove(\u0026self, path: \u0026Path, force: bool) -\u003e Result\u003c()\u003e {\n        let mut cmd = Command::new(\"git\");\n        cmd.current_dir(\u0026self.repo_path);\n        cmd.arg(\"worktree\").arg(\"remove\");\n\n        if force {\n            cmd.arg(\"--force\");\n        }\n\n        cmd.arg(path);\n\n        tracing::debug!(\"Running: {:?}\", cmd);\n\n        let output = cmd\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to execute git worktree remove: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            return Err(Error::git(format!(\n                \"Git worktree remove failed: {}\",\n                stderr\n            )));\n        }\n\n        tracing::info!(\"Removed worktree at {}\", path.display());\n        Ok(())\n    }\n\n    /// Prune stale worktree registrations.\n    pub fn prune(\u0026self) -\u003e Result\u003c()\u003e {\n        let mut cmd = Command::new(\"git\");\n        cmd.current_dir(\u0026self.repo_path);\n        cmd.arg(\"worktree\").arg(\"prune\");\n\n        tracing::debug!(\"Running: {:?}\", cmd);\n\n        let output = cmd\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to execute git worktree prune: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            return Err(Error::git(format!(\"Git worktree prune failed: {}\", stderr)));\n        }\n\n        Ok(())\n    }\n\n    /// List all worktrees\n    ///\n    /// Returns information about all worktrees in the repository.\n    pub fn list(\u0026self) -\u003e Result\u003cVec\u003cWorktreeInfo\u003e\u003e {\n        let mut cmd = Command::new(\"git\");\n        cmd.current_dir(\u0026self.repo_path);\n        cmd.arg(\"worktree\").arg(\"list\").arg(\"--porcelain\");\n\n        tracing::debug!(\"Running: {:?}\", cmd);\n\n        let output = cmd\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to execute git worktree list: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            return Err(Error::git(format!(\"Git worktree list failed: {}\", stderr)));\n        }\n\n        let stdout = String::from_utf8_lossy(\u0026output.stdout);\n        parse_worktree_list(\u0026stdout)\n    }\n\n    /// Check if a branch exists\n    pub fn branch_exists(\u0026self, branch: \u0026str) -\u003e Result\u003cbool\u003e {\n        let output = Command::new(\"git\")\n            .current_dir(\u0026self.repo_path)\n            .args([\"branch\", \"--list\", branch])\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to check branch: {}\", e)))?;\n\n        if !output.status.success() {\n            return Err(Error::git(\"Git branch list failed\".to_string()));\n        }\n\n        let stdout = String::from_utf8_lossy(\u0026output.stdout);\n        Ok(!stdout.trim().is_empty())\n    }\n\n    /// Check if a remote branch exists.\n    pub fn remote_branch_exists(\u0026self, remote: \u0026str, branch: \u0026str) -\u003e Result\u003cbool\u003e {\n        let output = Command::new(\"git\")\n            .current_dir(\u0026self.repo_path)\n            .args([\"ls-remote\", \"--heads\", remote, branch])\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to query remote branches: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            tracing::debug!(\n                \"git ls-remote for {}/{} failed, assuming branch absent: {}\",\n                remote,\n                branch,\n                stderr\n            );\n            return Ok(false);\n        }\n\n        Ok(!output.stdout.is_empty())\n    }\n\n    /// List configured git remotes.\n    pub fn list_remotes(\u0026self) -\u003e Result\u003cVec\u003cString\u003e\u003e {\n        let output = Command::new(\"git\")\n            .current_dir(\u0026self.repo_path)\n            .arg(\"remote\")\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to list remotes: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            return Err(Error::git(format!(\"Git remote failed: {}\", stderr)));\n        }\n\n        let remotes = String::from_utf8_lossy(\u0026output.stdout)\n            .lines()\n            .map(|line| line.trim().to_string())\n            .filter(|line| !line.is_empty())\n            .collect();\n        Ok(remotes)\n    }\n\n    /// Create a local branch pointing at a remote branch tip.\n    pub fn create_branch_from_remote(\u0026self, branch: \u0026str, remote: \u0026str) -\u003e Result\u003c()\u003e {\n        let remote_ref = format!(\"{}/{}\", remote, branch);\n        let mut cmd = Command::new(\"git\");\n        cmd.current_dir(\u0026self.repo_path);\n        cmd.args([\"branch\", branch, \u0026remote_ref]);\n\n        tracing::debug!(\"Running: {:?}\", cmd);\n\n        let output = cmd\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to create branch from remote: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            return Err(Error::git(format!(\n                \"Git branch creation from remote failed: {}\",\n                stderr\n            )));\n        }\n\n        Ok(())\n    }\n\n    /// Delete a branch\n    pub fn delete_branch(\u0026self, branch: \u0026str, force: bool) -\u003e Result\u003c()\u003e {\n        let mut cmd = Command::new(\"git\");\n        cmd.current_dir(\u0026self.repo_path);\n        cmd.arg(\"branch\");\n\n        if force {\n            cmd.arg(\"-D\");\n        } else {\n            cmd.arg(\"-d\");\n        }\n\n        cmd.arg(branch);\n\n        let output = cmd\n            .output()\n            .map_err(|e| Error::git(format!(\"Failed to delete branch: {}\", e)))?;\n\n        if !output.status.success() {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            return Err(Error::git(format!(\"Git branch delete failed: {}\", stderr)));\n        }\n\n        tracing::info!(\"Deleted branch {}\", branch);\n        Ok(())\n    }\n}\n\n/// Parse git worktree list --porcelain output\nfn parse_worktree_list(output: \u0026str) -\u003e Result\u003cVec\u003cWorktreeInfo\u003e\u003e {\n    let mut worktrees = Vec::new();\n    let mut current_worktree: Option\u003cWorktreeInfo\u003e = None;\n\n    for line in output.lines() {\n        if line.starts_with(\"worktree \") {\n            // Save previous worktree if exists\n            if let Some(wt) = current_worktree.take() {\n                worktrees.push(wt);\n            }\n\n            // Start new worktree\n            let path = line.strip_prefix(\"worktree \").unwrap_or(\"\");\n            current_worktree = Some(WorktreeInfo {\n                path: PathBuf::from(path),\n                branch: String::new(),\n                is_bare: false,\n                is_detached: false,\n            });\n        } else if line.starts_with(\"branch \") {\n            if let Some(ref mut wt) = current_worktree {\n                let branch = line\n                    .strip_prefix(\"branch \")\n                    .unwrap_or(\"\")\n                    .trim_start_matches(\"refs/heads/\");\n                wt.branch = branch.to_string();\n            }\n        } else if line == \"bare\" {\n            if let Some(ref mut wt) = current_worktree {\n                wt.is_bare = true;\n            }\n        } else if line == \"detached\" {\n            if let Some(ref mut wt) = current_worktree {\n                wt.is_detached = true;\n            }\n        }\n    }\n\n    // Add last worktree\n    if let Some(wt) = current_worktree {\n        worktrees.push(wt);\n    }\n\n    Ok(worktrees)\n}\n\n/// Information about a git worktree\n#[derive(Debug, Clone, PartialEq)]\npub struct WorktreeInfo {\n    pub path: PathBuf,\n    pub branch: String,\n    pub is_bare: bool,\n    pub is_detached: bool,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use std::process::Command;\n    use tempfile::TempDir;\n\n    /// Helper to create a test git repository\n    fn setup_test_repo() -\u003e TempDir {\n        let temp_dir = TempDir::new().unwrap();\n        let repo_path = temp_dir.path();\n\n        // Initialize git repo\n        Command::new(\"git\")\n            .args([\"init\", \"-b\", \"main\"])\n            .current_dir(repo_path)\n            .output()\n            .unwrap();\n\n        // Configure git user (required for commits)\n        Command::new(\"git\")\n            .args([\"config\", \"user.email\", \"test@example.com\"])\n            .current_dir(repo_path)\n            .output()\n            .unwrap();\n\n        Command::new(\"git\")\n            .args([\"config\", \"user.name\", \"Test User\"])\n            .current_dir(repo_path)\n            .output()\n            .unwrap();\n\n        // Create initial commit\n        fs::write(repo_path.join(\"README.md\"), \"# Test Repo\").unwrap();\n        Command::new(\"git\")\n            .args([\"add\", \"README.md\"])\n            .current_dir(repo_path)\n            .output()\n            .unwrap();\n        Command::new(\"git\")\n            .args([\"commit\", \"-m\", \"Initial commit\"])\n            .current_dir(repo_path)\n            .output()\n            .unwrap();\n\n        temp_dir\n    }\n\n    #[test]\n    fn test_new_git_worktree() {\n        let temp_dir = setup_test_repo();\n        let git = GitWorktree::new(temp_dir.path()).unwrap();\n        assert_eq!(git.repo_path, temp_dir.path());\n    }\n\n    #[test]\n    fn test_new_git_worktree_invalid_path() {\n        let result = GitWorktree::new(\"/nonexistent/path\");\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_new_git_worktree_not_a_repo() {\n        let temp_dir = TempDir::new().unwrap();\n        let result = GitWorktree::new(temp_dir.path());\n        assert!(result.is_err());\n        assert!(result\n            .unwrap_err()\n            .to_string()\n            .contains(\"Not a git repository\"));\n    }\n\n    #[test]\n    fn test_create_worktree() {\n        let temp_dir = setup_test_repo();\n        let git = GitWorktree::new(temp_dir.path()).unwrap();\n\n        let worktree_path = temp_dir.path().join(\"feature-worktree\");\n        git.create(\u0026worktree_path, \"feature/test\", Some(\"main\"))\n            .unwrap();\n\n        // Verify worktree was created\n        assert!(worktree_path.exists());\n        assert!(worktree_path.join(\".git\").exists());\n    }\n\n    #[test]\n    fn test_create_worktree_already_exists() {\n        let temp_dir = setup_test_repo();\n        let git = GitWorktree::new(temp_dir.path()).unwrap();\n\n        let worktree_path = temp_dir.path().join(\"feature-worktree\");\n        fs::create_dir(\u0026worktree_path).unwrap();\n\n        let result = git.create(\u0026worktree_path, \"feature/test\", Some(\"main\"));\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_list_worktrees() {\n        let temp_dir = setup_test_repo();\n        let git = GitWorktree::new(temp_dir.path()).unwrap();\n\n        // Should have at least one worktree (the main repo)\n        let worktrees = git.list().unwrap();\n        assert!( d::new(\"git\")\n            .current_dir(repo_path)\n            .args([\"rev-parse\", \"feature/test\"])\n            .output()\n            .unwrap();\n        let head_before = String::from_utf8(head_before.stdout).unwrap();\n\n        // Remove the worktree directory to simulate manual cleanup.\n        fs::remove_dir_all(\u0026worktree_path).unwrap();\n\n        // Reattach without resetting the branch.\n        let restored_path = repo_path.join(\"feature-worktree-restored\");\n        git.attach_existing_branch(\u0026restored_path, \"feature/test\")\n            .unwrap();\n        assert!(restored_path.exists());\n\n        let head_after = Command::new(\"git\")\n            .current_dir(repo_path)\n            .args([\"rev-parse\", \"feature/test\"])\n            .output()\n            .unwrap();\n        let head_after = String::from_utf8(head_after.stdout).unwrap();\n\n        assert_eq!(head_before, head_after);\n    }\n\n    #[test]\n    fn test_branch_exists() {\n        let temp_dir = setup_test_repo();\n        let git = GitWorktree::new(temp_dir.path()).unwrap();\n\n        assert!(git.branch_exists(\"main\").unwrap());\n        assert!(!git.branch_exists(\"nonexistent\").unwrap());\n    }\n\n    #[test]\n    fn test_delete_branch() {\n        let temp_dir = setup_test_repo();\n        let git = GitWorktree::new(temp_dir.path()).unwrap();\n\n        // Create a new branch\n        Command::new(\"git\")\n            .args([\"branch\", \"test-branch\"])\n            .current_dir(temp_dir.path())\n            .output()\n            .unwrap();\n\n        assert!(git.branch_exists(\"test-branch\").unwrap());\n\n        git.delete_branch(\"test-branch\", false).unwrap();\n\n        assert!(!git.branch_exists(\"test-branch\").unwrap());\n    }\n\n    #[test]\n    fn test_parse_worktree_list() {\n        let output = r#\"worktree /path/to/repo\nHEAD abc123\nbranch refs/heads/main\n\nworktree /path/to/feature\nHEAD def456\nbranch refs/heads/feature/test\n\nworktree /path/to/detached\nHEAD 123abc\ndetached\n\"#;\n\n        let worktrees = parse_worktree_list(output).unwrap();\n        assert_eq!(worktrees.len(), 3);\n\n        assert_eq!(worktrees[0].path, PathBuf::from(\"/path/to/repo\"));\n        assert_eq!(worktrees[0].branch, \"main\");\n        assert!(!worktrees[0].is_detached);\n\n        assert_eq!(worktrees[1].path, PathBuf::from(\"/path/to/feature\"));\n        assert_eq!(worktrees[1].branch, \"feature/test\");\n        assert!(!worktrees[1].is_detached);\n\n        assert_eq!(worktrees[2].path, PathBuf::from(\"/path/to/detached\"));\n        assert!(worktrees[2].is_detached);\n    }\n}\n","traces":[{"line":17,"address":[],"length":0,"stats":{"Line":21}},{"line":18,"address":[],"length":0,"stats":{"Line":63}},{"line":20,"address":[],"length":0,"stats":{"Line":21}},{"line":21,"address":[],"length":0,"stats":{"Line":3}},{"line":22,"address":[],"length":0,"stats":{"Line":2}},{"line":23,"address":[],"length":0,"stats":{"Line":1}},{"line":28,"address":[],"length":0,"stats":{"Line":40}},{"line":29,"address":[],"length":0,"stats":{"Line":20}},{"line":30,"address":[],"length":0,"stats":{"Line":3}},{"line":31,"address":[],"length":0,"stats":{"Line":2}},{"line":32,"address":[],"length":0,"stats":{"Line":1}},{"line":36,"address":[],"length":0,"stats":{"Line":19}},{"line":60,"address":[],"length":0,"stats":{"Line":11}},{"line":61,"address":[],"length":0,"stats":{"Line":22}},{"line":62,"address":[],"length":0,"stats":{"Line":1}},{"line":65,"address":[],"length":0,"stats":{"Line":20}},{"line":66,"address":[],"length":0,"stats":{"Line":30}},{"line":67,"address":[],"length":0,"stats":{"Line":20}},{"line":70,"address":[],"length":0,"stats":{"Line":30}},{"line":73,"address":[],"length":0,"stats":{"Line":30}},{"line":76,"address":[],"length":0,"stats":{"Line":18}},{"line":77,"address":[],"length":0,"stats":{"Line":8}},{"line":80,"address":[],"length":0,"stats":{"Line":11}},{"line":82,"address":[],"length":0,"stats":{"Line":20} :[],"length":0,"stats":{"Line":10}},{"line":348,"address":[],"length":0,"stats":{"Line":12}},{"line":349,"address":[],"length":0,"stats":{"Line":0}},{"line":350,"address":[],"length":0,"stats":{"Line":0}},{"line":352,"address":[],"length":0,"stats":{"Line":12}},{"line":353,"address":[],"length":0,"stats":{"Line":3}},{"line":354,"address":[],"length":0,"stats":{"Line":1}},{"line":360,"address":[],"length":0,"stats":{"Line":9}},{"line":361,"address":[],"length":0,"stats":{"Line":6}},{"line":364,"address":[],"length":0,"stats":{"Line":3}}],"covered":145,"coverable":176},{"path":["/","workspaces","main","core","src","lib.rs"],"content":"//! Worktree Core Library\n//!\n//! Provides core functionality for git worktree and devcontainer orchestration.\n//!\n//! # Modules\n//!\n//! - [`naming`] - Generate DNS-safe, dasherized feature names\n//! - [`validation`] - Validate environment, git state, and configuration\n//! - [`adapters`] - Auto-detect and configure for different stacks\n//! - [`modules`] - Composable feature components\n//! - [`bootstrap`] - Self-bootstrapping devcontainer system (meta!)\n//! - [`git`] - Git worktree operations\n//! - [`error`] - Error types\n\npub mod adapters;\npub mod bootstrap;\npub mod cloudflare;\npub mod error;\npub mod git;\npub mod modules;\npub mod naming;\npub mod validation;\npub mod workflow;\npub mod workflows;\n\npub use error::{Error, Result};\n\n/// Library version\npub const VERSION: \u0026str = env!(\"CARGO_PKG_VERSION\");\n","traces":[],"covered":0,"coverable":0},{"path":["/","workspaces","main","core","src","modules","compose.rs"],"content":"//! Docker Compose Module\n//!\n//! Manages Docker Compose configuration for feature worktrees:\n//! - Container naming validation and uniqueness\n//! - Compose configuration validation\n//! - Network isolation per worktree\n//! - Environment variable validation\n\nuse super::Module;\nuse crate::{Error, Result};\nuse std::path::Path;\nuse std::process::Command;\n\n/// Docker Compose module\npub struct ComposeModule {\n    enabled: bool,\n    compose_project_name: String,\n    devcontainer_name: String,\n    compose_file_name: String,\n}\n\nimpl ComposeModule {\n    /// Create a new Compose module\n    pub fn new() -\u003e Self {\n        Self {\n            enabled: false,\n            compose_project_name: String::new(),\n            devcontainer_name: String::new(),\n            compose_file_name: String::new(),\n        }\n    }\n\n    /// Check for container name conflicts\n    fn check_container_conflicts(\u0026self) -\u003e Result\u003c()\u003e {\n        let output = Command::new(\"docker\")\n            .args([\n                \"ps\",\n                \"--filter\",\n                \u0026format!(\n                    \"label=com.docker.compose.project={}\",\n                    self.compose_project_name\n                ),\n                \"--format\",\n                \"{{.Names}}\",\n            ])\n            .output()\n            .map_err(|e| Error::validation(format!(\"Failed to check containers: {}\", e)))?;\n\n        if output.status.success() {\n            let containers = String::from_utf8_lossy(\u0026output.stdout);\n            if !containers.trim().is_empty() {\n                tracing::warn!(\n                    \"Containers with project name '{}' are already running: {}\",\n                    self.compose_project_name,\n                    containers.trim()\n                );\n            }\n        }\n\n        Ok(())\n    }\n\n    /// Cleanup orphaned containers\n    fn cleanup_orphaned_containers(\u0026self) -\u003e Result\u003c()\u003e {\n        // Remove orphaned containers\n        let output = Command::new(\"docker\")\n            .args([\n                \"ps\",\n                \"-a\",\n                \"--filter\",\n                \u0026format!(\n                    \"label=com.docker.compose.project={}\",\n                    self.compose_project_name\n                ),\n                \"--format\",\n                \"{{.ID}}\",\n            ])\n            .output()\n            .map_err(|e| Error::validation(format!(\"Failed to list containers: {}\", e)))?;\n\n        if output.status.success() {\n            let container_ids = String::from_utf8_lossy(\u0026output.stdout);\n            if !container_ids.trim().is_empty() {\n                tracing::info!(\"Removing orphaned containers...\");\n                for id in container_ids.lines() {\n                    let _ = Command::new(\"docker\")\n                        .args([\"rm\", \"-f\", id.trim()])\n                        .output();\n                }\n            }\n        }\n\n        // Remove orphaned networks\n        let output = Command::new(\"docker\")\n            .args([\n                \"network\",\n                \"ls\",\n                \"--filter\",\n                \u0026format!(\n                    \"label=com.docker.compose.project={}\",\n                    self.compose_project_name\n                ),\n                \"--format\",\n                \"{{.ID}}\",\n            ])\n            .output()\n            .map_err(|e| Error::validation(format!(\"Failed to list networks: {}\", e)))?;\n\n        if output.status.success() {\n            let network_ids = String::from_utf8_lossy(\u0026output.stdout);\n            if !network_ids.trim().is_empty() {\n                tracing::info!(\"Removing orphaned networks...\");\n                for id in network_ids.lines() {\n                    let _ = Command::new(\"docker\")\n                        .args([\"network\", \"rm\", id.trim()])\n                        .output();\n                }\n            }\n        }\n\n        Ok(())\n    }\n}\n\nimpl Default for ComposeModule {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl Module for ComposeModule {\n    fn name(\u0026self) -\u003e \u0026str {\n        \"compose\"\n    }\n\n    fn detect(\u0026self, project_dir: \u0026Path) -\u003e bool {\n        // Check for compose files\n        let compose_yaml = project_dir.join(\".devcontainer/compose.yaml\");\n        let compose_yml = project_dir.join(\".devcontainer/docker-compose.yml\");\n        let dockerfile = project_dir.join(\".devcontainer/Dockerfile\");\n\n        compose_yaml.exists() || compose_yml.exists() || dockerfile.exists()\n    }\n\n    fn init(\u0026mut self, main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        let work_feature = feature_dir\n            .file_name()\n            .and_then(|n| n.to_str())\n            .ok_or_else(|| Error::validation(\"Invalid feature directory name\".to_string()))?;\n\n        // Set compose project name and devcontainer name\n        let base_prefix = std::env::var(\"BASE_PREFIX\").unwrap_or_else(|_| \"app\".to_string());\n        self.compose_project_name = std::env::var(\"COMPOSE_PROJECT_NAME\")\n            .unwrap_or_else(|_| format!(\"{}-{}\", base_prefix, work_feature));\n        self.devcontainer_name = std::env::var(\"DEVCONTAINER_NAME\")\n            .unwrap_or_else(|_| format!(\"{}-{}\", base_prefix, work_feature));\n\n        // Find compose file\n        if main_dir.join(\".devcontainer/compose.yaml\").exists() {\n            self.compose_file_name = \"compose.yaml\".to_string();\n        } else if main_dir.join(\".devcontainer/docker-compose.yml\").exists() {\n            self.compose_file_name = \"docker-compose.yml\".to_string();\n        }\n\n        tracing::info!(\"Project name: {}\", self.compose_project_name);\n        tracing::info!(\"Devcontainer name: {}\", self.devcontainer_name);\n\n        self.enabled = true;\n        Ok(())\n    }\n\n    fn setup(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        tracing::info!(\"Validating Docker Compose configuration...\");\n\n        // Validate compose configuration\n        if !self.compose_file_name.is_empty() {\n            let compose_file = feature_dir\n                .join(\".devcontainer\")\n                .join(\u0026self.compose_file_name);\n            if compose_file.exists() {\n                self.validate(_main_dir, feature_dir)?;\n            } else {\n                tracing::info!(\"No compose file found, skipping validation\");\n            }\n        }\n\n        // Check for container name conflicts\n        self.check_container_conflicts()?;\n\n        tracing::info!(\"Compose configuration validated\");\n        Ok(())\n    }\n\n    fn teardown(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        tracing::info!(\"Stopping and removing containers...\");\n\n        let compose_file = feature_dir\n            .join(\".devcontainer\")\n            .join(\u0026self.compose_file_name);\n\n        if compose_file.exists() {\n            // Check if containers are running\n            let ps_output = Command::new(\"docker\")\n                .args([\n                    \"compose\",\n                    \"-f\",\n                    compose_file.to_str().unwrap(),\n                    \"ps\",\n                    \"--quiet\",\n                ])\n                .current_dir(feature_dir)\n                .output()\n                .map_err(|e| Error::validation(format!(\"Failed to check containers: {}\", e)))?;\n\n            if ps_output.status.success() \u0026\u0026 !ps_output.stdout.is_empty() {\n                tracing::info!(\"Stopping containers for {}...\", self.compose_project_name);\n\n                let down_output = Command::new(\"docker\")\n                    .args([\n                        \"compose\",\n                        \"-f\",\n                        compose_file.to_str().unwrap(),\n                        \"down\",\n                        \"-v\",\n                    ])\n                    .current_dir(feature_dir)\n                    .output()\n                    .map_err(|e| Error::validation(format!(\"Failed to stop containers: {}\", e)))?;\n\n                if down_output.status.success() {\n                    tracing::info!(\"Containers stopped and removed\");\n                } else {\n                    tracing::warn!(\"Failed to stop some containers\");\n                }\n            } else {\n                tracing::info!(\"No running containers found\");\n            }\n        } else {\n            tracing::info!(\"No compose file found, skipping container cleanup\");\n        }\n\n        // Clean up orphaned containers\n        self.cleanup_orphaned_containers()?;\n\n        Ok(())\n    }\n\n    fn validate(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        if self.compose_file_name.is_empty() {\n            return Ok(());\n        }\n\n        let compose_file = feature_dir\n            .join(\".devcontainer\")\n            .join(\u0026self.compose_file_name);\n\n        if compose_file.exists() {\n            let output = Command::new(\"docker\")\n                .args([\"compose\", \"-f\", compose_file.to_str().unwrap(), \"config\"])\n                .current_dir(feature_dir)\n                .output()\n                .map_err(|e| Error::validation(format!(\"Failed to validate compose: {}\", e)))?;\n\n            if !output.status.success() {\n                let stderr = String::from_utf8_lossy(\u0026output.stderr);\n                return Err(Error::validation(format!(\n                    \"Docker Compose configuration is invalid: {}\",\n                    stderr\n                )));\n            }\n\n            tracing::info!(\"Compose configuration is valid\");\n        }\n\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_detect_compose_yaml() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\".devcontainer\")).unwrap();\n        std::fs::write(\n            temp_dir.path().join(\".devcontainer/compose.yaml\"),\n            \"version: '3'\",\n        )\n        .unwrap();\n\n        let module = ComposeModule::new();\n        assert!(module.detect(temp_dir.path()));\n    }\n\n    #[test]\n    fn test_detect_dockerfile() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\".devcontainer\")).unwrap();\n        std::fs::write(\n            temp_dir.path().join(\".devcontainer/Dockerfile\"),\n            \"FROM ubuntu\",\n        )\n        .unwrap();\n\n        let module = ComposeModule::new();\n        assert!(module.detect(temp_dir.path()));\n    }\n\n    #[test]\n    fn test_detect_no_compose() {\n        let temp_dir = TempDir::new().unwrap();\n\n        let module = ComposeModule::new();\n        assert!(!module.detect(temp_dir.path()));\n    }\n\n    #[test]\n    fn test_init() {\n        let main_dir = TempDir::new().unwrap();\n        let feature_dir = main_dir.path().join(\"feature-test\");\n        std::fs::create_dir(\u0026feature_dir).unwrap();\n        std::fs::create_dir_all(main_dir.path().join(\".devcontainer\")).unwrap();\n        std::fs::write(\n            main_dir.path().join(\".devcontainer/compose.yaml\"),\n            \"version: '3'\",\n        )\n        .unwrap();\n\n        let mut module = ComposeModule::new();\n        module.init(main_dir.path(), \u0026feature_dir).unwrap();\n\n        assert!(module.enabled);\n        assert!(!module.compose_project_name.is_empty());\n        assert_eq!(module.compose_file_name, \"compose.yaml\");\n    }\n}\n","traces":[{"line":24,"address":[],"length":0,"stats":{"Line":22}},{"line":27,"address":[],"length":0,"stats":{"Line":44}},{"line":28,"address":[],"length":0,"stats":{"Line":22}},{"line":29,"address":[],"length":0,"stats":{"Line":22}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":
