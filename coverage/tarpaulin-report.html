te, seed)\n//! - Database cleanup during teardown\n//! - Multiple database engine support (PostgreSQL, MySQL, MongoDB, etc.)\n\nuse super::Module;\nuse crate::{Error, Result};\nuse std::fs;\nuse std::path::Path;\nuse std::process::Command;\n\n/// Database engine type\n#[derive(Debug, Clone, PartialEq)]\npub enum DatabaseEngine {\n    Postgres,\n    MySQL,\n    MongoDB,\n    Unknown,\n}\n\nimpl std::fmt::Display for DatabaseEngine {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            DatabaseEngine::Postgres =\u003e write!(f, \"postgres\"),\n            DatabaseEngine::MySQL =\u003e write!(f, \"mysql\"),\n            DatabaseEngine::MongoDB =\u003e write!(f, \"mongodb\"),\n            DatabaseEngine::Unknown =\u003e write!(f, \"unknown\"),\n        }\n    }\n}\n\n/// Database module\npub struct DatabaseModule {\n    enabled: bool,\n    database_name: String,\n    database_engine: DatabaseEngine,\n    database_volume_name: String,\n    setup_command: String,\n}\n\nimpl DatabaseModule {\n    /// Create a new Database module\n    pub fn new() -\u003e Self {\n        Self {\n            enabled: false,\n            database_name: String::new(),\n            database_engine: DatabaseEngine::Unknown,\n            database_volume_name: String::new(),\n            setup_command: String::new(),\n        }\n    }\n\n    /// Detect database engine from compose file or config files\n    fn detect_engine(\u0026self, project_dir: \u0026Path) -\u003e DatabaseEngine {\n        // Check compose file for database services\n        let compose_file = project_dir.join(\".devcontainer/compose.yaml\");\n        if compose_file.exists() {\n            if let Ok(content) = fs::read_to_string(\u0026compose_file) {\n                if content.contains(\"postgres\") {\n                    return DatabaseEngine::Postgres;\n                } else if content.contains(\"mysql\") {\n                    return DatabaseEngine::MySQL;\n                } else if content.contains(\"mongodb\") || content.contains(\"mongo:\") {\n                    return DatabaseEngine::MongoDB;\n                }\n            }\n        }\n\n        DatabaseEngine::Unknown\n    }\n\n    /// Get default setup command for engine\n    fn default_setup_command(\u0026self) -\u003e String {\n        match self.database_engine {\n            DatabaseEngine::Postgres | DatabaseEngine::MySQL =\u003e \"bin/rails db:setup\".to_string(),\n            _ =\u003e \"echo 'No default setup command'\".to_string(),\n        }\n    }\n\n    /// Cleanup PostgreSQL database\n    fn cleanup_postgres(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if psql is available\n        if Command::new(\"which\").arg(\"psql\").output().is_err() {\n            tracing::info!(\"psql not available, database will be cleaned up with volume\");\n            return Ok(());\n        }\n\n        // Check if database exists\n        let output = Command::new(\"psql\").args([\"-lqt\"]).output();\n\n        if let Ok(output) = output {\n            let stdout = String::from_utf8_lossy(\u0026output.stdout);\n            if stdout.contains(\u0026self.database_name) {\n                tracing::info!(\"Dropping PostgreSQL database: {}\", self.database_name);\n\n                let result = Command::new(\"dropdb\").arg(\u0026self.database_name).output();\n\n                if result.is_ok() {\n                    tracing::info!(\"Database dropped successfully\");\n                } else {\n                    tracing::warn!(\"Could not drop database (may have active connections)\");\n                }\n            } else {\n                tracing::info!(\"Database not found (may already be deleted)\");\n            }\n        }\n\n        Ok(())\n    }\n\n    /// Cleanup MySQL database\n    fn cleanup_mysql(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if mysql is available\n        if Command::new(\"which\").arg(\"mysql\").output().is_err() {\n            tracing::info!(\"mysql not available, database will be cleaned up with volume\");\n            return Ok(());\n        }\n\n        tracing::info!(\"Dropping MySQL database: {}\", self.database_name);\n\n        let sql = format!(\"DROP DATABASE IF EXISTS `{}`;\", self.database_name);\n        let result = Command::new(\"mysql\").args([\"-e\", \u0026sql]).output();\n\n        if result.is_ok() {\n            tracing::info!(\"Database dropped successfully\");\n        } else {\n            tracing::warn!(\"Could not drop database\");\n        }\n\n        Ok(())\n    }\n\n    /// Cleanup MongoDB database\n    fn cleanup_mongodb(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check for mongo or mongosh\n        let mongo_cmd = if Command::new(\"which\").arg(\"mongosh\").output().is_ok() {\n            \"mongosh\"\n        } else if Command::new(\"which\").arg(\"mongo\").output().is_ok() {\n            \"mongo\"\n        } else {\n            tracing::info!(\"mongo/mongosh not available, database will be cleaned up with volume\");\n            return Ok(());\n        };\n\n        tracing::info!(\"Dropping MongoDB database: {}\", self.database_name);\n\n        let eval = format!(\"db.getSiblingDB('{}').dropDatabase()\", self.database_name);\n        let result = Command::new(mongo_cmd).args([\"--eval\", \u0026eval]).output();\n\n        if result.is_ok() {\n            tracing::info!(\"Database dropped successfully\");\n        } else {\n            tracing::warn!(\"Could not drop database\");\n        }\n\n        Ok(())\n    }\n}\n\nimpl Default for DatabaseModule {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl Module for DatabaseModule {\n    fn name(\u0026self) -\u003e \u0026str {\n        \"database\"\n    }\n\n    fn detect(\u0026self, project_dir: \u0026Path) -\u003e bool {\n        // Check for common database config files\n        let config_files = [\"config/database.yml\", \"prisma/schema.prisma\", \"knexfile.js\"];\n\n        for file in \u0026config_files {\n            if project_dir.join(file).exists() {\n                return true;\n            }\n        }\n\n        // Check compose file for database services\n        let compose_file = project_dir.join(\".devcontainer/compose.yaml\");\n        if compose_file.exists() {\n            if let Ok(content) = fs::read_to_string(\u0026compose_file) {\n                if content.contains(\"postgres\")\n                    || content.contains(\"mysql\")\n                    || content.contains(\"mongodb\")\n                {\n                    return true;\n                }\n            }\n        }\n\n        false\n    }\n\n    fn init(\u0026mut self, main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        let work_feature = feature_dir\n            .file_name()\n            .and_then(|n| n.to_str())\n            .ok_or_else(|| Error::validation(\"Invalid feature directory name\".to_string()))?;\n\n        // Generate database name (sanitize for database naming)\n        let project_name =\n            std::env::var(\"COMPOSE_PROJECT_NAME\").unwrap_or_else(|_| \"app\".to_string());\n        self.database_name = format!(\"{}_{}\", project_name, work_feature.replace('-', \"_\"));\n\n        // Detect database engine\n        self.database_engine = self.detect_engine(main_dir);\n\n        // Set default setup command\n        self.setup_command = self.default_setup_command();\n\n        // Generate volume name\n        self.database_volume_name = format!(\"{}-{}-db-data\", project_name, work_feature);\n\n        tracing::info!(\"Database: {}\", self.database_name);\n        tracing::info!(\"Engine: {}\", self.database_engine);\n        tracing::info!(\"Volume: {}\", self.database_volume_name);\n\n        self.enabled = true;\n        Ok(())\n    }\n\n    fn setup(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        tracing::info!(\"Setting up database configuration...\");\n\n        // Update .env with database-specific variables\n        let env_file = feature_dir.join(\".env\");\n        if env_file.exists() {\n            let content = fs::read_to_string(\u0026env_file)?;\n            if !content.contains(\"DATABASE_NAME=\") {\n                let mut file = fs::OpenOptions::new().append(true).open(\u0026env_file)?;\n\n                use std::io::Write;\n                writeln!(file)?;\n                writeln!(\n                    file,\n                    \"# Database configuration (managed by database module)\"\n                )?;\n                writeln!(file, \"DATABASE_NAME={}\", self.database_name)?;\n\n                tracing::info!(\"Added DATABASE_NAME to .env\");\n            }\n        }\n\n        tracing::info!(\"Database configuration ready\");\n        tracing::info!(\"After opening devcontainer, run: {}\", self.setup_command);\n\n        Ok(())\n    }\n\n    fn teardown(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        tracing::info!(\"Cleaning up database...\");\n\n        // Try to read database name from .env\n        let env_file = feature_dir.join(\".env\");\n        let db_name = if env_file.exists() {\n            if let Ok(content) = fs::read_to_string(\u0026env_file) {\n                content\n                    .lines()\n                    .find(|line| line.starts_with(\"DATABASE_NAME=\"))\n                    .and_then(|line| line.split('=').nth(1))\n                    .map(|s| s.trim_matches(|c| c == '\"' || c == '\\'').to_string())\n                    .unwrap_or_else(|| self.database_name.clone())\n            } else {\n                self.database_name.clone()\n            }\n        } else {\n            self.database_name.clone()\n        };\n\n        if db_name.is_empty() {\n            tracing::info!(\"No database name found, skipping cleanup\");\n            return Ok(());\n        }\n\n        tracing::info!(\"Database name: {}\", db_name);\n\n        // Cleanup based on engine\n        match self.database_engine {\n            DatabaseEngine::Postgres =\u003e self.cleanup_postgres()?,\n            DatabaseEngine::MySQL =\u003e self.cleanup_mysql()?,\n            DatabaseEngine::MongoDB =\u003e self.cleanup_mongodb()?,\n            DatabaseEngine::Unknown =\u003e {\n                tracing::info!(\"Unknown database engine, skipping cleanup\");\n                tracing::info!(\"You may need to drop database '{}' manually\", db_name);\n            }\n        }\n\n        tracing::info!(\"Database volume cleanup handled by docker compose\");\n\n        Ok(())\n    }\n\n    fn validate(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        let env_file = feature_dir.join(\".env\");\n\n        if !env_file.exists() {\n            tracing::warn!(\".env file not found\");\n            return Ok(());\n        }\n\n        let content = fs::read_to_string(\u0026env_file)?;\n        if !content.contains(\"DATABASE_URL\") \u0026\u0026 !content.contains(\"DATABASE_NAME\") {\n            tracing::warn!(\"No database configuration found in .env\");\n            tracing::info!(\"This may be OK if database config is in other files\");\n        }\n\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_detect_database_yml() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\"config\")).unwrap();\n        std::fs::write(\n            temp_dir.path().join(\"config/database.yml\"),\n            \"production: {}\",\n        )\n        .unwrap();\n\n        let module = DatabaseModule::new();\n        assert!(module.detect(temp_dir.path()));\n    }\n\n    #[test]\n    fn test_detect_postgres_in_compose() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\".devcontainer\")).unwrap();\n        std::fs::write(\n            temp_dir.path().join(\".devcontainer/compose.yaml\"),\n            \"services:\\n  postgres:\\n    image: postgres:14\",\n        )\n        .unwrap();\n\n        let module = DatabaseModule::new();\n        assert!(module.detect(temp_dir.path()));\n    }\n\n    #[test]\n    fn test_detect_engine_postgres() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\".devcontainer\")).unwrap();\n        std::fs::write(\n            temp_dir.path().join(\".devcontainer/compose.yaml\"),\n            \"services:\\n  postgres:\\n    image: postgres:14\",\n        )\n        .unwrap();\n\n        let module = DatabaseModule::new();\n        let engine = module.detect_engine(temp_dir.path());\n        assert_eq!(engine, DatabaseEngine::Postgres);\n    }\n\n    #[test]\n    fn test_init() {\n        let main_dir = TempDir::new().unwrap();\n        let feature_dir = main_dir.path().join(\"feature-test\");\n        std::fs::create_dir(\u0026feature_dir).unwrap();\n\n        let mut module = DatabaseModule::new();\n        module.init(main_dir.path(), \u0026feature_dir).unwrap();\n\n        assert!(module.enabled);\n        assert!(!module.database_name.is_empty());\n        assert!(!module.database_volume_name.is_empty());\n    }\n\n    #[test]\n    fn test_default_setup_command() {\n        let mut module = DatabaseModule::new();\n        module.database_engine = DatabaseEngine::Postgres;\n        assert_eq!(module.default_setup_command(), \"bin/rails db:setup\");\n\n        module.database_engine = DatabaseEngine::Unknown;\n        assert_eq!(\n            module.default_setup_command(),\n            \"echo 'No default setup command'\"\n        );\n    }\n}\n","traces":[{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":28," e":146},{"path":["/","workspaces","main","core","src","modules","mod.rs"],"content":"//! Module system\n//!\n//! Composable feature components (tunnel, database, compose, specs)\n//!\n//! Modules provide optional features that can be enabled per worktree:\n//! - **Compose**: Docker Compose configuration management\n//! - **Database**: Database isolation and setup\n//! - **Tunnel**: Cloudflare tunnel provisioning\n//! - **Specs**: Feature specification lifecycle tracking\n\nuse crate::Result;\nuse std::collections::HashSet;\nuse std::path::Path;\n\npub mod compose;\npub mod database;\npub mod specs;\npub mod tunnel;\n\npub use compose::ComposeModule;\npub use database::{DatabaseEngine, DatabaseModule};\npub use specs::{SpecStatus, SpecsModule};\npub use tunnel::TunnelModule;\n\n/// Detected module with dependency metadata.\npub struct ModuleHandle {\n    pub name: String,\n    pub dependencies: Vec\u003cString\u003e,\n    pub module: Box\u003cdyn Module\u003e,\n}\n\nimpl ModuleHandle {\n    fn new(module: Box\u003cdyn Module\u003e) -\u003e Self {\n        let name = module.name().to_string();\n        let dependencies = module\n            .dependencies()\n            .iter()\n            .map(|value| value.to_string())\n            .collect();\n\n        Self {\n            name,\n            dependencies,\n            module,\n        }\n    }\n}\n\n/// Ordered plan of modules plus dependency warnings.\npub struct ModulePlan {\n    pub handles: Vec\u003cModuleHandle\u003e,\n    pub warnings: Vec\u003cString\u003e,\n}\n\nimpl ModulePlan {\n    pub fn new(handles: Vec\u003cModuleHandle\u003e, warnings: Vec\u003cString\u003e) -\u003e Self {\n        Self { handles, warnings }\n    }\n}\n\n/// Module trait\n///\n/// Modules implement the feature lifecycle:\n/// 1. `detect()` - Check if module should be enabled\n/// 2. `init()` - Initialize module configuration\n/// 3. `setup()` - Setup resources during feature-start\n/// 4. `validate()` - Validate configuration\n/// 5. `teardown()` - Cleanup during feature-teardown\npub trait Module {\n    /// Module name\n    fn name(\u0026self) -\u003e \u0026str;\n\n    /// Detect if this module should be enabled\n    fn detect(\u0026self, project_dir: \u0026Path) -\u003e bool;\n\n    /// Initialize module configuration\n    fn init(\u0026mut self, main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e;\n\n    /// Setup resources during feature-start\n    fn setup(\u0026self, main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e;\n\n    /// Cleanup resources during feature-teardown\n    fn teardown(\u0026self, main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e;\n\n    /// Validate module configuration\n    fn validate(\u0026self, main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e;\n\n    /// Declares module dependencies (other module names that must execute before this module).\n    fn dependencies(\u0026self) -\u003e \u0026[\u0026str] {\n        \u0026[]\n    }\n}\n\n/// Get all available modules\n///\n/// Returns a vector of boxed modules that can be used to\n/// detect and configure features for a worktree.\npub fn all_modules() -\u003e Vec\u003cBox\u003cdyn Module\u003e\u003e {\n    vec![\n        Box::new(ComposeModule::new()),\n        Box::new(DatabaseModule::new()),\n        Box::new(TunnelModule::new()),\n        Box::new(SpecsModule::new()),\n    ]\n}\n\n/// Detect and initialize enabled modules\n///\n/// Returns a plan containing ordered modules and dependency warnings.\npub fn detect_modules(project_dir: \u0026Path) -\u003e ModulePlan {\n    let mut detected: Vec\u003cModuleHandle\u003e = all_modules()\n        .into_iter()\n        .filter(|module| module.detect(project_dir))\n        .map(ModuleHandle::new)\n        .collect();\n\n    let mut ordered = Vec::with_capacity(detected.len());\n    let mut satisfied = HashSet::new();\n    let mut warnings = Vec::new();\n\n    while !detected.is_empty() {\n        let mut progress = false;\n        let mut idx = 0;\n\n        while idx \u003c detected.len() {\n            let unresolved: Vec\u003c\u0026String\u003e = detected[idx]\n                .dependencies\n                .iter()\n                .filter(|dep| !satisfied.contains(dep.as_str()))\n                .collect();\n\n            if unresolved.is_empty() {\n                let handle = detected.remove(idx);\n                satisfied.insert(handle.name.clone());\n                ordered.push(handle);\n                progress = true;\n            } else {\n                let missing: Vec\u003c\u0026String\u003e = unresolved\n                    .into_iter()\n                    .filter(|dep| !detected.iter().any(|handle| \u0026handle.name == *dep))\n                    .collect();\n\n                if !missing.is_empty() {\n                    let missing_list = missing\n                        .iter()\n                        .map(|dep| dep.as_str())\n                        .collect::\u003cVec\u003c_\u003e\u003e()\n                        .join(\", \");\n                    warnings.push(format!(\n                        \"Module '{}' depends on missing module(s): {}\",\n                        detected[idx].name, missing_list\n                    ));\n                    let handle = detected.remove(idx);\n                    satisfied.insert(handle.name.clone());\n                    ordered.push(handle);\n                    progress = true;\n                } else {\n                    idx += 1;\n                }\n            }\n        }\n\n        if !progress {\n            // Circular dependency detected. Log warning and append remaining modules in original order.\n            let names: Vec\u003cString\u003e = detected.iter().map(|handle| handle.name.clone()).collect();\n            if !names.is_empty() {\n                warnings.push(format!(\n                    \"Detected circular module dependency involving: {}\",\n                    names.join(\", \")\n                ));\n            }\n            ordered.append(\u0026mut detected);\n            break;\n        }\n    }\n\n    ModulePlan::new(ordered, warnings)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_all_modules() {\n        let modules = all_modules();\n        assert_eq!(modules.len(), 4);\n\n        let names: Vec\u003c\u0026str\u003e = modules.iter().map(|m| m.name()).collect();\n        assert!(names.contains(\u0026\"compose\"));\n        assert!(names.contains(\u0026\"database\"));\n        assert!(names.contains(\u0026\"tunnel\"));\n        assert!(names.contains(\u0026\"specs\"));\n    }\n\n    #[test]\n    fn test_detect_modules_empty_project() {\n        let temp_dir = TempDir::new().unwrap();\n        let plan = detect_modules(temp_dir.path());\n\n        // Tunnel module is always enabled for manual setup\n        assert!(!plan.handles.is_empty());\n        assert!(plan.warnings.is_empty());\n        assert!(plan.handles.iter().any(|h| h.name == \"tunnel\"));\n    }\n\n    #[test]\n    fn test_detect_modules_with_compose() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\".devcontainer\")).unwrap();\n        std::fs::write(\n            temp_dir.path().join(\".devcontainer/compose.yaml\"),\n            \"version: '3'\",\n        )\n        .unwrap();\n\n        let plan = detect_modules(temp_dir.path());\n        let names: Vec\u003c\u0026str\u003e = plan.handles.iter().map(|m| m.name.as_str()).collect();\n\n        assert!(names.contains(\u0026\"compose\"));\n    }\n\n    #[test]\n    fn test_detect_modules_with_database() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\"config\")).unwrap();\n        std::fs::write(temp_dir.path().join(\"config/database.yml\"), \"test\").unwrap();\n\n        let plan = detect_modules(temp_dir.path());\n        let names: Vec\u003c\u0026str\u003e = plan.handles.iter().map(|m| m.name.as_str()).collect();\n\n        assert!(names.contains(\u0026\"database\"));\n    }\n}\n","traces":[{"line":33,"address":[],"length":0,"stats":{"Line":36}},{"line":34,"address":[],"length":0,"stats":{"Line":108}},{"line":35,"address":[],"length":0,"stats":{"Line":72}},{"line":38,"address":[],"length":0,"stats":{"Line":36}},{"line":56,"address":[],"length":0,"stats":{"Line":17}},{"line":89,"address":[],"length":0,"stats":{"Line":36}},{"line":90,"address":[],"length":0,"stats":{"Line":36}},{"line":98,"address":[],"length":0,"stats":{"Line":18}},{"line":99,"address":[],"length":0,"stats":{"Line":18}},{"line":100,"address":[],"length":0,"stats":{"Line":18}},{"line":101,"address":[],"length":0,"stats":{"Line":18}},{"line":102,"address":[],"length":0,"stats":{"Line":18}},{"line":103,"address":[],"length":0,"stats":{"Line":18}},{"line":110,"address":[],"length":0,"stats":{"Line":17}},{"line":111,"address":[],"length":0,"stats":{"Line":51}},{"line":113,"address":[],"length":0,"stats":{"Line":221}},{"line":114,"address":[],"length":0,"stats":{"Line":17}},{"line":117,"address":[],"length":0,"stats":{"Line":68}},{"line":118,"address":[],"length":0,"stats":{"Line":34}},{"line":119,"address":[],"length":0,"stats":{"Line":34}},{"line":121,"address":[],"length":0,"stats":{"Line":34}},{"line":122,"address":[],"length":0,"stats":{"Line":34}},{"line":123,"address":[],"length":0,"stats":{"Line":34}},{"line":125,"address":[],"length":0,"stats":{"Line":106}},{"line":126,"address":[],"length":0,"stats":{"Line":108}},{"line":127,"address":[],"length":0,"stats":{"Line":36}},{"line":129,"address":[],"length":0,"stats":{"Line":36}},{"line":132,"address":[],"length":0,"stats":{"Line":108}},{"line":133,"address":[],"length":0,"stats":{"Line":180}},{"line":134,"address":[],"length":0,"stats":{"Line":180}},{"line":135,"address":[],"length":0,"stats":{"Line":108}},{"line":136,"address":[],"length":0,"stats":{"Line":36}},{"line":138,"address":[],"length":0,"stats":{"Line":0}},{"line":140,"address":[],"length":0,"stats":{"Line":0}},{"line":143,"address":[],"length":0,"stats":{"Line":0}},{"line":144,"address":[],"length":0,"stats":{"Line":0}},{"line":146,"address":[],"length":0,"stats":{"Line":0}},{"line":149,"address":[],"length":0,"stats":{"Line":0}},{"line":150,"address":[],"length":0,"stats":{"Line":0}},{"line":151,"address":[],"length":0,"stats":{"Line":0}},{"line":153,"address":[],"length":0,"stats":{"Line":0}},{"line":154,"address":[],"length":0,"stats":{"Line":0}},{"line":155,"address":[],"length":0,"stats":{"Line":0}},{"line":156,"address":[],"length":0,"stats":{"Line":0}},{"line":158,"address":[],"length":0,"stats":{"Line":0}},{"line":163,"address":[],"length":0,"stats":{"Line":17}},{"line":165,"address":[],"length":0,"stats":{"Line":0}},{"line":166,"address":[],"length":0,"stats":{"Line":0}},{"line":167,"address":[],"length":0,"stats":{"Line":0}},{"line":168,"address":[],"length":0,"stats":{"Line":0}},{"line":169,"address":[],"length":0,"stats":{"Line":0}},{"line":172,"address":[],"length":0,"stats":{"Line":0}},{"line":173,"address":[],"length":0,"stats":{"Line":0}},{"line":177,"address":[],"length":0,"stats":{"Line":51}}],"covered":34,"coverable":54},{"path":["/","workspaces","main","core","src","modules","specs.rs"],"content":"//! Feature Specs Module\n//!\n//! Manages feature specification lifecycle tracking:\n//! - Feature spec discovery and search\n//! - Feature spec creation\n//! - Feature spec lifecycle management (backlog → in-progress → completed)\n//! - Feature spec frontmatter updating\n\nuse super::Module;\nuse crate::{Error, Result};\nuse chrono::Utc;\nuse std::cell::RefCell;\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\n/// Feature specification status\n#[derive(Debug, Clone, PartialEq)]\npub enum SpecStatus {\n    Backlog,\n    InProgress,\n    Completed,\n}\n\nimpl SpecStatus {\n    fn as_str(\u0026self) -\u003e \u0026str {\n        match self {\n            SpecStatus::Backlog =\u003e \"backlog\",\n            SpecStatus::InProgress =\u003e \"in-progress\",\n            SpecStatus::Completed =\u003e \"completed\",\n        }\n    }\n}\n\n/// Feature Specs module\npub struct SpecsModule {\n    enabled: bool,\n    specs_dir: PathBuf,\n    spec_file: RefCell\u003cOption\u003cPathBuf\u003e\u003e,\n    spec_status: RefCell\u003cOption\u003cSpecStatus\u003e\u003e,\n    feature_title: String,\n    work_feature: String,\n}\n\nimpl SpecsModule {\n    /// Create a new Specs module\n    pub fn new() -\u003e Self {\n        Self {\n            enabled: false,\n            specs_dir: PathBuf::new(),\n            spec_file: RefCell::new(None),\n            spec_status: RefCell::new(None),\n            feature_title: String::new(),\n            work_feature: String::new(),\n        }\n    }\n\n    /// Create directory structure for specs\n    fn create_directory_structure(\u0026self) -\u003e Result\u003c()\u003e {\n        for status in \u0026[\n            SpecStatus::Backlog,\n            SpecStatus::InProgress,\n            SpecStatus::Completed,\n        ] {\n            let dir = self.specs_dir.join(status.as_str());\n            if !dir.exists() {\n                fs::create_dir_all(\u0026dir)?;\n                tracing::info!(\"Created {} directory\", status.as_str());\n            }\n        }\n        Ok(())\n    }\n\n    fn discover_spec_for(\u0026self, work_feature: \u0026str) -\u003e Option\u003c(PathBuf, SpecStatus)\u003e {\n        let candidate_name = format!(\"{work_feature}.md\");\n        let search_order = [\n            SpecStatus::InProgress,\n            SpecStatus::Backlog,\n            SpecStatus::Completed,\n        ];\n\n        for status in \u0026search_order {\n            let candidate = self.specs_dir.join(status.as_str()).join(\u0026candidate_name);\n            if candidate.exists() {\n                return Some((candidate, status.clone()));\n            }\n        }\n\n        None\n    }\n\n    fn set_spec_reference(\u0026self, path: PathBuf, status: SpecStatus) {\n        self.spec_file.replace(Some(path));\n        self.spec_status.replace(Some(status));\n    }\n\n    fn ensure_spec_exists(\u0026self, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        if self.current_spec().is_some() {\n            return Ok(());\n        }\n\n        let spec_path = self\n            .specs_dir\n            .join(SpecStatus::InProgress.as_str())\n            .join(format!(\"{}.md\", self.work_feature));\n\n        let frontmatter = format!(\n            \"---\\ntitle: {}\\nstatus: in-progress\\nworktree: {}\\ncreated: {}\\n---\\n\\n## Summary\\n\\nTODO: Describe the feature scope.\\n\\n## Requirements\\n\\n- [ ] Requirement 1\\n- [ ] Requirement 2\\n\",\n            self.feature_title,\n            feature_dir.display(),\n            Utc::now().date_naive()\n        );\n\n        fs::write(\u0026spec_path, frontmatter)?;\n        tracing::info!(\n            \"Created new feature spec at {}\",\n            spec_path\n                .strip_prefix(\u0026self.specs_dir)\n                .unwrap_or(\u0026spec_path)\n                .display()\n        );\n        self.set_spec_reference(spec_path, SpecStatus::InProgress);\n        Ok(())\n    }\n\n    fn current_spec(\u0026self) -\u003e Option\u003cPathBuf\u003e {\n        self.spec_file.borrow().clone()\n    }\n\n    fn current_status(\u0026self) -\u003e Option\u003cSpecStatus\u003e {\n        self.spec_status.borrow().clone()\n    }\n\n    /// Update spec frontmatter with worktree information\n    fn update_spec_frontmatter(\u0026self, spec_file: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        if !spec_file.exists() {\n            return Ok(());\n        }\n\n        let content = fs::read_to_string(spec_file)?;\n\n        // Simple frontmatter update - look for status field\n        // In a real implementation, this would use a proper YAML parser\n        let updated = if content.starts_with(\"---\") {\n            // Has frontmatter, update it\n            let parts: Vec\u003c\u0026str\u003e = content.splitn(3, \"---\").collect();\n            if parts.len() \u003e= 3 {\n                let frontmatter = parts[1];\n                let body = parts[2];\n\n                let mut updated_frontmatter = String::new();\n                let mut status_updated = false;\n\n                for line in frontmatter.lines() {\n                    if line.trim().starts_with(\"status:\") {\n                        updated_frontmatter.push_str(\"status: in-progress\\n\");\n                        status_updated = true;\n                    } else if line.trim().starts_with(\"worktree:\") {\n                        updated_frontmatter\n                            .push_str(\u0026format!(\"worktree: {}\\n\", feature_dir.display()));\n                    } else {\n                        updated_frontmatter.push_str(line);\n                        updated_frontmatter.push('\\n');\n                    }\n                }\n\n                if !status_updated {\n                    updated_frontmatter.push_str(\"status: in-progress\\n\");\n                }\n\n                format!(\"---\\n{}---{}\", updated_frontmatter, body)\n            } else {\n                content\n            }\n        } else {\n            // No frontmatter, add it\n            format!(\n                \"---\\nstatus: in-progress\\nworktree: {}\\n---\\n\\n{}\",\n                feature_dir.display(),\n                content\n            )\n        };\n\n        fs::write(spec_file, updated)?;\n        tracing::info!(\"Updated spec frontmatter\");\n        Ok(())\n    }\n}\n\nimpl Default for SpecsModule {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl Module for SpecsModule {\n    fn name(\u0026self) -\u003e \u0026str {\n        \"specs\"\n    }\n\n    fn detect(\u0026self, project_dir: \u0026Path) -\u003e bool {\n        // Check if specs directory exists or FEATURES_DIR is set\n        if std::env::var(\"FEATURES_DIR\").is_ok() {\n            return true;\n        }\n        // Enable by default; init will create the directory structure\n        let features_dir = project_dir.join(\"docs/features\");\n        if features_dir.exists() {\n            return true;\n        }\n        // Fallback: enable even if directory is missing\n        true\n    }\n\n    fn init(\u0026mut self, main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        // Set specs directory\n        self.specs_dir = if let Ok(features_dir) = std::env::var(\"FEATURES_DIR\") {\n            PathBuf::from(features_dir)\n        } else {\n            main_dir.join(\"docs/features\")\n        };\n\n        self.work_feature = feature_dir\n            .file_name()\n            .and_then(|n| n.to_str())\n            .ok_or_else(|| Error::validation(\"Invalid feature directory name\".to_string()))?\n            .to_string();\n        self.feature_title = self\n            .work_feature\n            .split('-')\n            .map(|segment| {\n                let mut chars = segment.chars();\n                match chars.next() {\n                    Some(first) =\u003e first.to_uppercase().collect::\u003cString\u003e() + chars.as_str(),\n                    None =\u003e String::new(),\n                }\n            })\n            .collect::\u003cVec\u003c_\u003e\u003e()\n            .join(\" \");\n\n        // Create directory structure\n        self.create_directory_structure()?;\n\n        tracing::info!(\"Initialized specs directory: {:?}\", self.specs_dir);\n        self.enabled = true;\n\n        if let Some((path, status)) = self.discover_spec_for(\u0026self.work_feature) {\n            tracing::info!(\n                \"Discovered existing feature spec {:?} in {}\",\n                path,\n                status.as_str()\n            );\n            self.set_spec_reference(path, status);\n        }\n\n        Ok(())\n    }\n\n    fn setup(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        tracing::info!(\"Setting up feature specification...\");\n\n        if self.current_spec().is_none() {\n            if let Some((path, status)) = self.discover_spec_for(\u0026self.work_feature) {\n                self.set_spec_reference(path, status);\n            } else {\n                tracing::info!(\n                    \"No feature spec found for {} - creating in-progress spec\",\n                    self.work_feature\n                );\n                self.ensure_spec_exists(feature_dir)?;\n                return Ok(());\n            }\n        }\n\n        // Move spec to in-progress if not already there\n        if let Some(spec_file) = self.current_spec() {\n            let spec_basename = spec_file\n                .file_name()\n                .ok_or_else(|| Error::validation(\"Invalid spec filename\".to_string()))?;\n\n            let in_progress_path = self\n                .specs_dir\n                .join(SpecStatus::InProgress.as_str())\n                .join(spec_basename);\n\n            // Check if spec is in backlog\n            let backlog_path = self\n                .specs_dir\n                .join(SpecStatus::Backlog.as_str())\n                .join(spec_basename);\n\n            let status_before = self.current_status();\n\n            if matches!(status_before, Some(SpecStatus::Backlog))\n                \u0026\u0026 backlog_path.exists()\n                \u0026\u0026 !in_progress_path.exists()\n            {\n                fs::rename(\u0026backlog_path, \u0026in_progress_path)?;\n                self.set_spec_reference(in_progress_path.clone(), SpecStatus::InProgress);\n                tracing::info!(\"Moved spec '{}' to in-progress\", in_progress_path.display());\n            }\n\n            // Update frontmatter\n            if in_progress_path.exists() {\n                self.update_spec_frontmatter(\u0026in_progress_path, feature_dir)?;\n                tracing::info!(\"Feature spec ready: {:?}\", in_progress_path);\n            }\n        }\n\n        Ok(())\n    }\n\n    fn teardown(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        tracing::info!(\"Handling feature specification...\");\n\n        let work_feature = feature_dir\n            .file_name()\n            .and_then(|n| n.to_str())\n            .ok_or_else(|| Error::validation(\"Invalid feature directory name\".to_string()))?;\n\n        let spec_file = self\n            .specs_dir\n            .join(SpecStatus::InProgress.as_str())\n            .join(format!(\"{}.md\", work_feature));\n\n        if spec_file.exists() {\n            self.set_spec_reference(spec_file.clone(), SpecStatus::InProgress);\n        }\n\n        if !spec_file.exists() {\n            tracing::info!(\"No feature spec found\");\n            return Ok(());\n        }\n\n        let complete = std::env::var(\"BRANCHBOX_COMPLETE_SPEC\")\n            .map(|value| value == \"1\" || value.eq_ignore_ascii_case(\"true\"))\n            .unwrap_or(false);\n\n        if complete {\n            let completed_dir = self.specs_dir.join(SpecStatus::Completed.as_str());\n            if !completed_dir.exists() {\n                fs::create_dir_all(\u0026completed_dir)?;\n            }\n            let completed_path = completed_dir.join(format!(\"{}.md\", work_feature));\n            fs::rename(\u0026spec_file, \u0026completed_path)?;\n            tracing::info!(\"Feature spec moved to completed: {:?}\", completed_path);\n        } else {\n            tracing::info!(\"Feature spec found: {:?}\", spec_file);\n            tracing::info!(\n                \"Spec remains in in-progress (use --complete-spec to move to completed)\"\n            );\n        }\n\n        Ok(())\n    }\n\n    fn validate(\u0026self, _main_dir: \u0026Path, _feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        // Validate that specs directory exists\n        if !self.specs_dir.exists() {\n            return Err(Error::validation(format!(\n                \"Specs directory not found: {:?}\",\n                self.specs_dir\n            )));\n        }\n\n        // Validate directory structure\n        for status in \u0026[\n            SpecStatus::Backlog,\n            SpecStatus::InProgress,\n            SpecStatus::Completed,\n        ] {\n            let dir = self.specs_dir.join(status.as_str());\n            if !dir.exists() {\n                tracing::warn!(\"Missing directory: {:?}\", dir);\n                fs::create_dir_all(\u0026dir)?;\n                tracing::info!(\"Created {} directory\", status.as_str());\n            }\n        }\n\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_detect() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\"docs/features\")).unwrap();\n\n        let module = SpecsModule::new();\n        assert!(module.detect(temp_dir.path()));\n    }\n\n    #[test]\n    fn test_init() {\n        let main_dir = TempDir::new().unwrap();\n        let feature_dir = main_dir.path().join(\"feature-test\");\n        std::fs::create_dir(\u0026feature_dir).unwrap();\n\n        let mut module = SpecsModule::new();\n        module.init(main_dir.path(), \u0026feature_dir).unwrap();\n\n        assert!(module.enabled);\n        assert!(module.specs_dir.join(\"backlog\").exists());\n        assert!(module.specs_dir.join(\"in-progress\").exists());\n        assert!(module.specs_dir.join(\"completed\").exists());\n    }\n\n    #[test]\n    fn test_create_directory_structure() {\n        let temp_dir = TempDir::new().unwrap();\n        let specs_dir = temp_dir.path().join(\"specs\");\n\n        let module = SpecsModule {\n            enabled: true,\n            specs_dir: specs_dir.clone(),\n            spec_file: RefCell::new(None),\n            spec_status: RefCell::new(None),\n            feature_title: String::new(),\n            work_feature: String::new(),\n        };\n\n        module.create_directory_structure().unwrap();\n\n        assert!(specs_dir.join(\"backlog\").exists());\n        assert!(specs_dir.join(\"in-progress\").exists());\n        assert!(specs_dir.join(\"completed\").exists());\n    }\n\n    #[test]\n    fn test_update_frontmatter() {\n        let temp_dir = TempDir::new().unwrap();\n        let spec_file = temp_dir.path().join(\"test.md\");\n\n        std::fs::write(\u0026spec_file, \"# Test Feature\\n\\nSome content\").unwrap();\n\n        let module = SpecsModule::new();\n        module\n            .update_spec_frontmatter(\u0026spec_file, temp_dir.path())\n            .unwrap();\n\n        let content = std::fs::read_to_string(\u0026spec_file).unwrap();\n        assert!(content.contains(\"status: in-progress\"));\n        assert!(content.contains(\"worktree:\"));\n    }\n\n    #[test]\n    fn test_setup_moves_backlog_spec() {\n        let main_dir = TempDir::new().unwrap();\n        let feature_dir = main_dir.path().join(\"feature-awesome\");\n        std::fs::create_dir(\u0026feature_dir).unwrap();\n\n        let specs_dir = main_dir.path().join(\"docs/features\");\n        std::fs::create_dir_all(specs_dir.join(\"backlog\")).unwrap();\n        std::fs::create_dir_all(specs_dir.join(\"in-progress\")).unwrap();\n        std::fs::create_dir_all(specs_dir.join(\"completed\")).unwrap();\n\n        let backlog_spec = specs_dir.join(\"backlog/feature-awesome.md\");\n        std::fs::write(\u0026backlog_spec, \"# Awesome Feature\\n\\nDetails TBD\").unwrap();\n\n        let mut module = SpecsModule::new();\n        module.init(main_dir.path(), \u0026feature_dir).unwrap();\n        module.setup(main_dir.path(), \u0026feature_dir).unwrap();\n\n        let in_progress_spec = specs_dir.join(\"in-progress/feature-awesome.md\");\n        assert!(in_progress_spec.exists());\n        let content = std::fs::read_to_string(in_progress_spec).unwrap();\n        assert!(content.contains(\"status: in-progress\"));\n    }\n\n    #[test]\n    fn test_setup_creates_spec_when_missing() {\n        let main_dir = TempDir::new().unwrap();\n        let feature_dir = main_dir.path().join(\"feature-bright\");\n        std::fs::create_dir(\u0026feature_dir).unwrap();\n\n        let specs_dir = main_dir.path().join(\"docs/features\");\n        std::fs::create_dir_all(specs_dir.join(\"backlog\")).unwrap();\n        std::fs::create_dir_all(specs_dir.join(\"in-progress\")).unwrap();\n        std::fs::create_dir_all(specs_dir.join(\"completed\")).unwrap();\n\n        let mut module = SpecsModule::new();\n        module.init(main_dir.path(), \u0026feature_dir).unwrap();\n        module.setup(main_dir.path(), \u0026feature_dir).unwrap();\n\n        let spec_path = specs_dir.join(\"in-progress/feature-bright.md\");\n        assert!(spec_path.exists());\n        let content = std::fs::read_to_string(spec_path).unwrap();\n        assert!(content.contains(\"title: Feature Bright\"));\n        assert!(content.contains(\"status: in-progress\"));\n    }\n\n    #[test]\n    fn test_teardown_moves_spec_when_complete_flag_set() {\n        let main_dir = TempDir::new().unwrap();\n        let feature_dir = main_dir.path().join(\"feature-complete\");\n        std::fs::create_dir(\u0026feature_dir).unwrap();\n\n        let specs_dir = main_dir.path().join(\"docs/features\");\n        std::fs::create_dir_all(specs_dir.join(\"in-progress\")).unwrap();\n        std::fs::create_dir_all(specs_dir.join(\"completed\")).unwrap();\n\n        let in_progress_spec = specs_dir.join(\"in-progress/feature-complete.md\");\n        std::fs::write(\u0026in_progress_spec, \"---\\nstatus: in-progress\\n---\").unwrap();\n\n        let mut module = SpecsModule::new();\n        module.init(main_dir.path(), \u0026feature_dir).unwrap();\n\n        std::env::set_var(\"BRANCHBOX_COMPLETE_SPEC\", \"1\");\n        module.teardown(main_dir.path(), \u0026feature_dir).unwrap();\n        std::env::remove_var(\"BRANCHBOX_COMPLETE_SPEC\");\n\n        assert!(!in_progress_spec.exists());\n        let completed_spec = specs_dir.join(\"completed/feature-complete.md\");\n        assert!(completed_spec.exists());\n    }\n}\n","traces":[{"line":25,"address":[],"length":0,"stats":{"Line":116}},{"line":26,"address":[],"length":0,"stats":{"Line":116}},{"line":27,"address":[],"length":0,"stats":{"Line":33}},{"line":28,"address":[],"length":0,"stats":{"Line":57}},{"line":29,"address":[],"length":0,"stats":{"Line":26}},{"line":46,"address":[],"length":0,"stats":{"Line":24}},{"line":49,"address":[],"length":0,"stats":{"Line":48}},{"line":50,"address":[],"length":0,"stats":{"Line":72}},{"line":51,"address":[],"length":0,"stats":{"Line":72}},{"line":52,"address":[],"length":0,"stats":{"Line":24}},{"line":53,"address":[],"length":0,"stats":{"Line":24}},{"line":58,"address":[],"length":0,"stats":{"Line":19}},{"line":59,"address":[],"length":0,"stats":{"Line":133}},{"line":60,"address":[],"length":0,"stats":{"Line":76}},{"line":61,"address":[],"length":0,"stats":{"Line":76}},{"line":62,"address":[],"length":0,"stats":{"Line":76}},{"line":64,"address":[],"length":0,"stats":{"Line":228}},{"line":65,"address":[],"length":0,"stats":{"Line":57}},{"line":66,"address":[],"length":0,"stats":{"Line":42}},{"line":67,"address":[],"length":0,"stats":{"Line":27}},{"line":70,"address":[],"length":0,"stats":{"Line":19}},{"line":73,"address":[],"length":0,"stats":{"Line":19}},{"line":74,"address":[],"length":0,"stats":{"Line":57}},{"line":75,"address":[],"length":0,"stats":{"Line":38}},{"line":76,"address":[],"length":0,"stats":{"Line":38}},{"line":77,"address":[],"length":0,"stats":{"Line":19}},{"line":78,"address":[],"length":0,"stats":{"Line":19}},{"line":81,"address":[],"length":0,"stats":{"Line":55}},{"line":82,"address":[],"length":0,"stats":{"Line":130}},{"line":83,"address":[],"length":0," :334,"address":[],"length":0,"stats":{"Line":14}},{"line":335,"address":[],"length":0,"stats":{"Line":10}},{"line":338,"address":[],"length":0,"stats":{"Line":7}},{"line":339,"address":[],"length":0,"stats":{"Line":12}},{"line":340,"address":[],"length":0,"stats":{"Line":3}},{"line":341,"address":[],"length":0,"stats":{"Line":0}},{"line":343,"address":[],"length":0,"stats":{"Line":12}},{"line":344,"address":[],"length":0,"stats":{"Line":9}},{"line":345,"address":[],"length":0,"stats":{"Line":4}},{"line":347,"address":[],"length":0,"stats":{"Line":4}},{"line":348,"address":[],"length":0,"stats":{"Line":4}},{"line":349,"address":[],"length":0,"stats":{"Line":0}},{"line":353,"address":[],"length":0,"stats":{"Line":7}},{"line":356,"address":[],"length":0,"stats":{"Line":0}},{"line":358,"address":[],"length":0,"stats":{"Line":0}},{"line":359,"address":[],"length":0,"stats":{"Line":0}},{"line":360,"address":[],"length":0,"stats":{"Line":0}},{"line":361,"address":[],"length":0,"stats":{"Line":0}},{"line":366,"address":[],"length":0,"stats":{"Line":0}},{"line":367,"address":[],"length":0,"stats":{"Line":0}},{"line":368,"address":[],"length":0,"stats":{"Line":0}},{"line":369,"address":[],"length":0,"stats":{"Line":0}},{"line":371,"address":[],"length":0,"stats":{"Line":0}},{"line":372,"address":[],"length":0,"stats":{"Line":0}},{"line":373,"address":[],"length":0,"stats":{"Line":0}},{"line":374,"address":[],"length":0,"stats":{"Line":0}},{"line":375,"address":[],"length":0,"stats":{"Line":0}},{"line":379,"address":[],"length":0,"stats":{"Line":0}}],"covered":164,"coverable":199},{"path":["/","workspaces","main","core","src","modules","tunnel.rs"],"content":"//! Cloudflare Tunnel Module\n//!\n//! Manages Cloudflare tunnel provisioning and DNS records:\n//! - Automatic tunnel provisioning via Cloudflare API\n//! - Manual tunnel configuration\n//! - DNS record management\n//! - Tunnel cleanup during teardown\n\nuse super::Module;\nuse crate::{\n    cloudflare::{CloudflareClient, TunnelProvision, TunnelSummary},\n    naming,\n    validation::AppUrl,\n    Error, Result,\n};\nuse std::fs;\nuse std::io::Write;\nuse std::path::Path;\n\n/// Cloudflare Tunnel module\npub struct TunnelModule {\n    enabled: bool,\n    tunnel_name: String,\n    feature_url: String,\n    base_domain: String,\n    service_url: String,\n    cloudflare_api_key: Option\u003cString\u003e,\n    cloudflare_account_id: Option\u003cString\u003e,\n}\n\nimpl TunnelModule {\n    fn emit(\u0026self, stage: \u0026str, message: \u0026str) {\n        if Self::telemetry_enabled() {\n            tracing::info!(\n                target: \"branchbox::telemetry::cloudflare\",\n                stage = stage,\n                tunnel = %self.tunnel_name,\n                feature_url = %self.feature_url,\n                message = message\n            );\n        }\n    }\n\n    /// Create a new Tunnel module\n    pub fn new() -\u003e Self {\n        Self {\n            enabled: false,\n            tunnel_name: String::new(),\n            feature_url: String::new(),\n            base_domain: String::new(),\n            service_url: String::new(),\n            cloudflare_api_key: None,\n            cloudflare_account_id: None,\n        }\n    }\n\n    /// Write tunnel configuration to .cloudflared.env\n    fn write_tunnel_config(\n        \u0026self,\n        feature_dir: \u0026Path,\n        tunnel_token: \u0026str,\n        feature_hostname: \u0026str,\n    ) -\u003e Result\u003c()\u003e {\n        let cloudflared_dir = feature_dir.join(\".devcontainer\");\n        fs::create_dir_all(\u0026cloudflared_dir)?;\n\n        let config_file = cloudflared_dir.join(\".cloudflared.env\");\n        let mut file = fs::File::create(\u0026config_file)?;\n\n        let timestamp = chrono::Utc::now().format(\"%Y-%m-%d\");\n        writeln!(\n            file,\n            \"# Cloudflare Tunnel Configuration for {}\",\n            feature_dir\n                .file_name()\n                .and_then(|n| n.to_str())\n                .unwrap_or(\"unknown\")\n        )?;\n        writeln!(file, \"# Generated on {}\", timestamp)?;\n        writeln!(file, \"TUNNEL_TOKEN={}\", tunnel_token)?;\n        writeln!(file, \"DEV_HOSTNAME={}\", feature_hostname)?;\n\n        tracing::info!(\"Tunnel configuration saved to {:?}\", config_file);\n        Ok(())\n    }\n\n    /// Validate tunnel configuration file\n    fn validate_config(\u0026self, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        let config_file = feature_dir.join(\".devcontainer/.cloudflared.env\");\n\n        if !config_file.exists() {\n            tracing::warn!(\"Tunnel configuration file not found\");\n            tracing::info!(\"Expected: {:?}\", config_file);\n            tracing::info!(\"This is OK if tunnel setup hasn't been completed yet\");\n            return Ok(());\n        }\n\n        let content = fs::read_to_string(\u0026config_file)?;\n        if !content.contains(\"TUNNEL_TOKEN=\") {\n            tracing::warn!(\"TUNNEL_TOKEN not found in .cloudflared.env\");\n            tracing::info!(\"Tunnel may not be configured correctly\");\n            return Ok(());\n        }\n\n        tracing::info!(\"Tunnel configuration looks valid\");\n        Ok(())\n    }\n\n    fn read_existing_token(\u0026self, feature_dir: \u0026Path) -\u003e Option\u003cString\u003e {\n        let token_path = feature_dir.join(\".devcontainer/.cloudflared.env\");\n        fs::read_to_string(token_path).ok().and_then(|content| {\n            content\n                .lines()\n                .find(|line| line.starts_with(\"TUNNEL_TOKEN=\"))\n                .and_then(|line| line.split('=').nth(1))\n                .map(|value| value.trim().trim_matches(['\"', '\\'']).to_string())\n        })\n    }\n\n    fn manual_setup_instructions(\u0026self) {\n        tracing::info!(\"\\nManual Cloudflare Tunnel Setup Required:\\n\");\n        tracing::info!(\"1. Open Cloudflare Dashboard: https://dash.cloudflare.com\");\n        tracing::info!(\"2. Navigate to: Zero Trust \u003e Access \u003e Tunnels\");\n        tracing::info!(\"3. Create a tunnel named: {}\", self.tunnel_name);\n        tracing::info!(\"4. Configure route:\");\n        tracing::info!(\"   - Hostname: {}\", self.feature_url);\n        tracing::info!(\"   - Service: {}\", self.service_url);\n        tracing::info!(\"5. Copy the tunnel token and add to .cloudflared.env\");\n        tracing::info!(\"   (or export CLOUDFLARE_TUNNEL_TOKEN for non-interactive usage)\");\n        self.emit(\"manual\", \"Displayed manual setup instructions\");\n    }\n\n    fn build_client(\u0026self) -\u003e Result\u003cCloudflareClient\u003e {\n        let api_key = self\n            .cloudflare_api_key\n            .as_ref()\n            .ok_or_else(|| Error::validation(\"Missing Cloudflare API key\"))?;\n        let account_id = self\n            .cloudflare_account_id\n            .as_ref()\n            .ok_or_else(|| Error::validation(\"Missing Cloudflare account id\"))?;\n\n        CloudflareClient::new(api_key.clone(), account_id.clone())\n    }\n\n    fn ensure_dns(\u0026self, client: \u0026CloudflareClient, tunnel: \u0026TunnelSummary) -\u003e Result\u003c()\u003e {\n        client.ensure_cname_record(\u0026self.feature_url, \u0026self.base_domain, \u0026tunnel.id)\n    }\n\n    fn ensure_dns_with_provision(\n        \u0026self,\n        client: \u0026CloudflareClient,\n        provision: \u0026TunnelProvision,\n    ) -\u003e Result\u003c()\u003e {\n        client.ensure_cname_record(\u0026self.feature_url, \u0026self.base_domain, \u0026provision.id)\n    }\n\n    fn infer_base_domain(\u0026self, hostname: \u0026str) -\u003e String {\n        hostname\n            .split_once('.')\n            .map(|(_, rest)| rest.to_string())\n            .unwrap_or_else(|| self.base_domain.clone())\n    }\n\n    fn tunnel_token_from_env(\u0026self) -\u003e Option\u003cString\u003e {\n        std::env::var(\"CLOUDFLARE_TUNNEL_TOKEN\").ok()\n    }\n\n    fn find_feature_hostname(\u0026self, feature_dir: \u0026Path) -\u003e Option\u003cString\u003e {\n        let env_candidate = feature_dir.join(\".env\");\n        if let Some(host) = Self::extract_env_var(\u0026env_candidate, \"APP_URL\") {\n            return Some(host);\n        }\n\n        let cloudflared = feature_dir.join(\".devcontainer/.cloudflared.env\");\n        Self::extract_env_var(\u0026cloudflared, \"DEV_HOSTNAME\")\n    }\n\n    fn extract_env_var(path: \u0026Path, key: \u0026str) -\u003e Option\u003cString\u003e {\n        fs::read_to_string(path).ok().and_then(|content| {\n            content\n                .lines()\n                .find(|line| line.starts_with(key))\n                .and_then(|line| line.split('=').nth(1))\n                .map(|value| value.trim().trim_matches(['\"', '\\'']).to_string())\n        })\n    }\n\n    fn telemetry_enabled() -\u003e bool {\n        std::env::var(\"BRANCHBOX_EMIT_TELEMETRY\").is_ok()\n    }\n}\n\nimpl Default for TunnelModule {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl Module for TunnelModule {\n    fn name(\u0026self) -\u003e \u0026str {\n        \"tunnel\"\n    }\n\n    fn detect(\u0026self, _project_dir: \u0026Path) -\u003e bool {\n        // Check for Cloudflare credentials in environment\n        let has_credentials = std::env::var(\"CLOUDFLARE_API_KEY\").is_ok()\n            \u0026\u0026 std::env::var(\"CLOUDFLARE_ACCOUNT_ID\").is_ok();\n\n        if !has_credentials {\n            tracing::debug!(\n                \"Cloudflare credentials not detected; tunnel module ready for manual setup\"\n            );\n        }\n\n        // Module can be enabled even without credentials for manual setup\n        true\n    }\n\n    fn init(\u0026mut self, main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        // Read Cloudflare credentials from environment\n        self.cloudflare_api_key = std::env::var(\"CLOUDFLARE_API_KEY\").ok();\n        self.cloudflare_account_id = std::env::var(\"CLOUDFLARE_ACCOUNT_ID\").ok();\n\n        let work_feature = feature_dir\n            .file_name()\n            .and_then(|n| n.to_str())\n            .ok_or_else(|| Error::validation(\"Invalid feature directory name\".to_string()))?;\n\n        // Generate tunnel name and feature URL\n        match AppUrl::from_env_file(\u0026main_dir.join(\".env\")) {\n            Ok(app_url) =\u003e {\n                self.base_domain = app_url.base_domain.clone();\n                self.tunnel_name = naming::generate_tunnel_name(\u0026app_url.base_prefix, work_feature);\n                self.feature_url = naming::generate_feature_url(\u0026app_url.url, work_feature);\n                self.emit(\"init\", \"Derived hostname from APP_URL\");\n            }\n            Err(err) =\u003e {\n                tracing::warn!(\n                    \"Falling back to localhost tunnel hostname (APP_URL parse failed: {})\",\n                    err\n                );\n                self.emit(\"init\", \"Falling back to default tunnel hostname\");\n                let fallback_prefix =\n                    std::env::var(\"BASE_PREFIX\").unwrap_or_else(|_| \"app\".to_string());\n                self.base_domain =\n                    std::env::var(\"BASE_DOMAIN\").unwrap_or_else(|_| \"localhost\".to_string());\n                self.tunnel_name = naming::generate_tunnel_name(\u0026fallback_prefix, work_feature);\n                self.feature_url =\n                    format!(\"{}-{}.{}\", fallback_prefix, work_feature, self.base_domain);\n            }\n        }\n\n        // Get service URL from environment or use default\n        self.service_url =\n            std::env::var(\"SERVICE_URL\").unwrap_or_else(|_| \"rails-app:3000\".to_string());\n\n        tracing::info!(\"Initialized tunnel: {}\", self.tunnel_name);\n        tracing::info!(\"Feature URL: https://{}\", self.feature_url);\n\n        self.enabled = true;\n        Ok(())\n    }\n\n    fn setup(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        tracing::info!(\"Setting up Cloudflare tunnel...\");\n\n        let mut tunnel_token = self\n            .read_existing_token(feature_dir)\n            .or_else(|| self.tunnel_token_from_env());\n\n        if self.cloudflare_api_key.is_some() \u0026\u0026 self.cloudflare_account_id.is_some() {\n            match self.build_client() {\n                Ok(client) =\u003e match client.find_tunnel_by_name(\u0026self.tunnel_name) {\n                    Ok(Some(existing)) =\u003e {\n                        tracing::warn!(\n                                \"Tunnel '{}' already exists in Cloudflare; token cannot be retrieved via API\",\n                                existing.name\n                            );\n                        self.emit(\"detect\", \"Existing tunnel detected\");\n                        if let Err(err) = self.ensure_dns(\u0026client, \u0026existing) {\n                            tracing::warn!(\n                                \"Failed to ensure DNS for existing tunnel '{}': {}\",\n                                existing.name,\n                                err\n                            );\n                            self.emit(\"dns\", \"DNS ensure failed for existing tunnel\");\n                        }\n                        if tunnel_token.is_none() {\n                            tracing::info!(\n                                    \"Provide the existing tunnel token via CLOUDFLARE_TUNNEL_TOKEN or update .cloudflared.env manually.\"\n                                );\n                            self.emit(\"token\", \"Existing tunnel lacks token\");\n                        }\n                    }\n                    Ok(None) =\u003e match client.create_tunnel(\u0026self.tunnel_name) {\n                        Ok(provision) =\u003e {\n                            tracing::info!(\"Provisioned Cloudflare tunnel '{}'\", provision.name);\n                            self.emit(\"provision\", \"Tunnel provisioned via API\");\n                            if let Err(err) = client.configure_tunnel(\n                                \u0026provision.id,\n                                \u0026self.feature_url,\n                                \u0026self.service_url,\n                            ) {\n                                tracing::warn!(\"Failed to configure tunnel ingress: {}\", err);\n                                self.emit(\"configure\", \"Ingress configuration failed\");\n                            }\n\n                            if let Err(err) = self.ensure_dns_with_provision(\u0026client, \u0026provision) {\n                                tracing::warn!(\n                                    \"Failed to configure DNS record for {}: {}\",\n                                    self.feature_url,\n                                    err\n                                );\n                                self.emit(\"dns\", \"DNS configuration failed\");\n                            }\n\n                            tunnel_token = Some(provision.token);\n                        }\n                        Err(err) =\u003e {\n                            tracing::warn!(\n                                \"Failed to provision tunnel via Cloudflare API: {}\",\n                                err\n                            );\n                            self.emit(\"provision\", \"Provisioning failed\");\n                            self.manual_setup_instructions();\n                        }\n                    },\n                    Err(err) =\u003e {\n                        tracing::warn!(\"Failed to query Cloudflare tunnels: {}\", err);\n                        self.emit(\"detect\", \"Failed to query Cloudflare API\");\n                        self.manual_setup_instructions();\n                    }\n                },\n                Err(err) =\u003e {\n                    tracing::warn!(\"Failed to initialize Cloudflare client: {}\", err);\n                    self.emit(\"client\", \"Client initialization failed\");\n                    self.manual_setup_instructions();\n                }\n            }\n        } else {\n            tracing::info!(\"No Cloudflare API credentials detected.\");\n            self.manual_setup_instructions();\n            self.emit(\"init\", \"API credentials missing\");\n        }\n\n        if let Some(token) = tunnel_token {\n            self.write_tunnel_config(feature_dir, \u0026token, \u0026self.feature_url)?;\n            tracing::info!(\"Tunnel configuration saved\");\n            self.emit(\"config\", \"Configuration saved\");\n        } else {\n            tracing::warn!(\"No tunnel token - you can add it later\");\n            tracing::info!(\n                \"Edit: {}/.devcontainer/.cloudflared.env\",\n                feature_dir.display()\n            );\n            self.emit(\"config\", \"Token missing\");\n        }\n\n        Ok(())\n    }\n\n    fn teardown(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        tracing::info!(\"Cleaning up Cloudflare tunnel...\");\n\n        let feature_url = self.find_feature_hostname(feature_dir).unwrap_or_default();\n\n        if feature_url.is_empty() {\n            tracing::info!(\"No tunnel information found\");\n            return Ok(());\n        }\n\n        let tunnel_name = feature_url.split('.').next().unwrap_or(\"\");\n        tracing::info!(\"Tunnel name: {}\", tunnel_name);\n        tracing::info!(\"Feature URL: {}\", feature_url);\n\n        if self.cloudflare_api_key.is_some() \u0026\u0026 self.cloudflare_account_id.is_some() {\n            match self.build_client() {\n                Ok(client) =\u003e {\n                    match client.find_tunnel_by_name(tunnel_name) {\n                        Ok(Some(summary)) =\u003e match client.delete_tunnel(\u0026summary.id) {\n                            Ok(_) =\u003e tracing::info!(\"Tunnel '{}' deleted via API\", summary.name),\n                            Err(err) =\u003e tracing::warn!(\n                                \"Failed to delete tunnel '{}': {}\",\n                                summary.name,\n                                err\n                            ),\n                        },\n                        Ok(None) =\u003e {\n                            tracing::info!(\n                                \"Tunnel '{}' not found (might already be removed)\",\n                                tunnel_name\n                            );\n                        }\n                        Err(err) =\u003e {\n                            tracing::warn!(\"Failed to look up tunnel '{}': {}\", tunnel_name, err);\n                        }\n                    }\n\n                    let base_domain = self.infer_base_domain(\u0026feature_url);\n                    match client.delete_dns_record(\u0026feature_url, \u0026base_domain) {\n                        Ok(true) =\u003e tracing::info!(\"DNS record {} removed\", feature_url),\n                        Ok(false) =\u003e tracing::info!(\"DNS record {} not found\", feature_url),\n                        Err(err) =\u003e tracing::warn!(\n                            \"Failed to delete DNS record for {}: {}\",\n                            feature_url,\n                            err\n                        ),\n                    }\n                }\n                Err(err) =\u003e {\n                    tracing::warn!(\n                        \"Failed to initialize Cloudflare client for teardown: {}\",\n                        err\n                    );\n                }\n            }\n        } else {\n            tracing::info!(\"Skipping Cloudflare API cleanup (no credentials detected)\");\n        }\n\n        Ok(())\n    }\n\n    fn validate(\u0026self, _main_dir: \u0026Path, feature_dir: \u0026Path) -\u003e Result\u003c()\u003e {\n        self.validate_config(feature_dir)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_detect() {\n        let temp_dir = TempDir::new().unwrap();\n        let module = TunnelModule::new();\n        assert!(module.detect(temp_dir.path()));\n    }\n\n    #[test]\n    fn test_init() {\n        let main_dir = TempDir::new().unwrap();\n        let feature_dir = main_dir.path().join(\"feature-test\");\n        std::fs::create_dir(\u0026feature_dir).unwrap();\n\n        let mut module = TunnelModule::new();\n        module.init(main_dir.path(), \u0026feature_dir).unwrap();\n\n        assert!(module.enabled);\n        assert!(!module.tunnel_name.is_empty());\n        assert!(!module.feature_url.is_empty());\n        assert!(module.feature_url.contains(\"feature-test\"));\n    }\n\n    #[test]\n    fn test_write_config() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\".devcontainer\")).unwrap();\n\n        let module = TunnelModule::new();\n\n        module\n            .write_tunnel_config(temp_dir.path(), \"test_token\", \"test.example.com\")\n            .unwrap();\n\n        let config_file = temp_dir.path().join(\".devcontainer/.cloudflared.env\");\n        assert!(config_file.exists());\n\n        let content = std::fs::read_to_string(\u0026config_file).unwrap();\n        assert!(content.contains(\"TUNNEL_TOKEN=test_token\"));\n        assert!(content.contains(\"DEV_HOSTNAME=test.example.com\"));\n    }\n\n    #[test]\n    fn read_existing_token_extracts_value() {\n        let temp_dir = TempDir::new().unwrap();\n        std::fs::create_dir_all(temp_dir.path().join(\".devcontainer\")).unwrap();\n        std::fs::write(\n            temp_dir.path().join(\".devcontainer/.cloudflared.env\"),\n            \"TUNNEL_TOKEN=abc123\\nDEV_HOSTNAME=test.example.com\",\n        )\n        .unwrap();\n\n        let module = TunnelModule::new();\n        let
