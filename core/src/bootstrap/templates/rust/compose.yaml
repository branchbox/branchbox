name: "${DEVCONTAINER_NAME:-rust-project}"

services:
  rust-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    privileged: true

    volumes:
      - ../..:/workspaces:cached
      - dind-data:/var/lib/docker
      - ../.codex:/home/vscode/.codex

    command: sleep infinity

    env_file:
      - ../.env

    environment:
      DOCKER_CONTAINER: "true"
      RUST_BACKTRACE: "1"

volumes:
  dind-data:
