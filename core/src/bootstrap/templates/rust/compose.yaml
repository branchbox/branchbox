name: "rust-project"

services:
  rust-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    privileged: true

    volumes:
      - ../..:/workspaces:cached
      - dind-var-lib-docker:/var/lib/docker
      - ../.codex:/home/vscode/.codex

    command: sleep infinity

    environment:
      DOCKER_CONTAINER: "true"
      RUST_BACKTRACE: "1"

volumes:
  dind-var-lib-docker:
