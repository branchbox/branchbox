name: ${DEVCONTAINER_NAME:-nodejs-project}
services:
  nodejs-app:
    # Official BranchBox pre-built image (instant startup)
    # Falls back to local build if unavailable or DEVCONTAINER_PULL_POLICY=build
    image: ${DEVCONTAINER_IMAGE:-ghcr.io/branchbox/branchbox/devcontainer-nodejs:latest}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    pull_policy: ${DEVCONTAINER_PULL_POLICY:-missing}
    privileged: true
    init: true
    ipc: host
    container_name: ${DEVCONTAINER_NAME:-nodejs-project}
    volumes:
      - ../..:/workspaces:cached
      - dind-data:/var/lib/docker
      - ${SHARED_CONFIG_DIR:-../..}/.codex:/home/vscode/.codex
      - ${SHARED_CONFIG_DIR:-../..}/.claude:/home/vscode/.claude
      - ${SHARED_CONFIG_DIR:-../..}/.claude.json:/home/vscode/.claude.json
      - ${SHARED_CONFIG_DIR:-../..}/.gh:/home/vscode/.config/gh
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
      - path: .branchbox.env
        required: false
    environment:
      NODE_ENV: development
volumes:
  dind-data: null
