name: "${DEVCONTAINER_NAME:-nodejs-project}"

services:
  nodejs-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    privileged: true

    volumes:
      - ../..:/workspaces:cached
      - dind-data:/var/lib/docker
      - ../.codex:/home/vscode/.codex

    command: sleep infinity

    env_file:
      - ../.env

    environment:
      NODE_ENV: development

volumes:
  dind-data:
