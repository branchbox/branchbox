name: "nodejs-project"

services:
  nodejs-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    privileged: true

    volumes:
      - ../..:/workspaces:cached
      - dind-var-lib-docker:/var/lib/docker
      - ../.codex:/home/vscode/.codex

    command: sleep infinity

    environment:
      NODE_ENV: development

volumes:
  dind-var-lib-docker:
