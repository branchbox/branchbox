name: "${DEVCONTAINER_NAME:-dev-project}"

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    privileged: true

    volumes:
      - ../..:/workspaces:cached
      - dind-data:/var/lib/docker
      - ../.codex:/home/vscode/.codex

    command: sleep infinity

    env_file:
      - ../.env

volumes:
  dind-data:
