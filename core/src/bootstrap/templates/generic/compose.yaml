name: "dev-project"

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    privileged: true

    volumes:
      - ../..:/workspaces:cached
      - dind-var-lib-docker:/var/lib/docker
      - ../.codex:/home/vscode/.codex

    command: sleep infinity

volumes:
  dind-var-lib-docker:
