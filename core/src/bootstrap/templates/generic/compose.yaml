name: ${DEVCONTAINER_NAME:-dev}
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    privileged: true
    container_name: ${DEVCONTAINER_NAME:-dev}
    volumes:
      - ../..:/workspaces:cached
      - dind-data:/var/lib/docker
      - ${SHARED_CONFIG_DIR:-../..}/.codex:/home/vscode/.codex
      - ${SHARED_CONFIG_DIR:-../..}/.claude:/home/vscode/.claude
      - ${SHARED_CONFIG_DIR:-../..}/.gh:/home/vscode/.config/gh
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
      - path: .branchbox.env
        required: false
volumes:
  dind-data: null
