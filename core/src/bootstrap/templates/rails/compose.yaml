# BranchBox Rails Devcontainer
# Works with SQLite, Postgres, or MySQL based projects
services:
  rails-app:
    # Official BranchBox pre-built image (instant startup)
    # Falls back to local build if unavailable or DEVCONTAINER_PULL_POLICY=build
    image: ${DEVCONTAINER_IMAGE:-ghcr.io/branchbox/branchbox/devcontainer-rails:latest}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    pull_policy: ${DEVCONTAINER_PULL_POLICY:-missing}
    privileged: true
    init: true
    ipc: host
    volumes:
      - ../..:/workspaces:cached
      - dind-data:/var/lib/docker
      - mise-cache:/home/vscode/.local/share/mise
      - ${SHARED_CONFIG_DIR:-../..}/.ai-agents/codex:/home/vscode/.codex
      - ${SHARED_CONFIG_DIR:-../..}/.ai-agents/claude:/home/vscode/.claude
      - ${SHARED_CONFIG_DIR:-../..}/.ai-agents/claude.json:/home/vscode/.claude.json
      - ${SHARED_CONFIG_DIR:-../..}/.ai-agents/gh:/home/vscode/.config/gh
      - ./.github-token.env:/home/vscode/.github-token.env:ro
      - ./.git-signing-key:/home/vscode/.git-signing-key:ro
      - ./.gitconfig.env:/home/vscode/.gitconfig.env:ro
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
      - path: .branchbox.env
        required: false
      - path: .github-token.env
        required: false
    environment:
      # Disable Solid Queue Puma plugin by default (enable if you have queue DB configured)
      SOLID_QUEUE_IN_PUMA: ${SOLID_QUEUE_IN_PUMA:-false}
    # Uncomment to enable Postgres (for apps using pg gem instead of sqlite3)
    # depends_on:
    #   - postgres

  # Postgres service - uncomment if your app uses PostgreSQL
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   restart: unless-stopped
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres

volumes:
  dind-data: null
  mise-cache: null
  # postgres-data: null
