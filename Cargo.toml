[workspace]
members = [
    "core",
    "cli",
    "agent",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/branchbox/branchbox"
authors = ["Rida Al Barazi <rbarazi@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7" }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Git operations
git2 = { version = "0.18", features = ["vendored-libgit2", "vendored-openssl"] }

# Command execution
which = "6.0"

# File system
walkdir = "2.4"
pathdiff = "0.2"
tempfile = "3.8"
dirs = "5.0"

# Regex
regex = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# HTTP
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Testing
rstest = "0.18"
mockito = "1.2"
jsonc-parser = { version = "0.27", features = ["serde"] }

[workspace.metadata.release]
# Version management
sign-commit = false
sign-tag = false
pre-release-commit-message = "chore(release): prepare {{version}}"
tag-message = "Release {{version}}"
tag-prefix = "v"
tag-name = "{{prefix}}{{version}}"
consolidate-commits = true

# Pre-release validation
pre-release-hook = ["cargo", "test", "--all"]

# Disable automatic publishing to crates.io (we'll add this later)
publish = false
